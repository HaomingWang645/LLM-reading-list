# =============================================================================
# Reading-list data. Edit this file to add papers — the page renders itself.
#
# Structure:
#   meta:        hero banner text
#   legend:      reading-depth grades (the A / A- / B+ / B / C badges)
#   tags:        optional special tags (e.g. NVIDIA) shown in the legend
#   categories:  top-level sections. Each category has EITHER `papers:` directly,
#                OR `subtopics:` (each with its own `papers:`), or both.
#                An optional `intro:` renders one paragraph above them.
#
# A subtopic may optionally lead with a video:
#   - name: "Tokenization"
#     video_id:   "zduSFxRajkE"   # YouTube id — renders a clickable thumbnail
#     video_note: "Karpathy — ..."# optional caption under the thumbnail
#     papers: [ ... ]             # related papers, shown below the video
#
# For several videos, use `videos:` instead — they render as a wrapping row of
# smaller cards. Valid on a subtopic or on a single section:
#   videos:
#     - { id: "SMBkImDWOyQ", note: "Jia-Bin Huang — RoPE." }
#     - { id: "Y-o545eYjXM", note: "..." }
#
# Figures (on a section, or on a single note) take:
#   image: "/assets/img/..."   image_alt: "..."   image_caption: "..."
#   image_width: 640           # px cap; figures are centred. Pick it so the text
#                              # drawn inside the diagram lands near the body's
#                              # ~15.5px:  width = 15.5 * native_width / text_px
#
# A paper entry:
#   - year: 2024            # a plain number — never quote it (quoting breaks the year stats)
#     title: "Paper Title"
#     note: "One-line takeaway."
#     grade: "A"            # MUST be exactly one of: A, A-, B+, B, C
#     url: "https://..."    # optional; omit to render a non-linked title
#     featured: true        # optional; renders the title in bold
#     tags: ["★"]           # optional; each must match a key in the `tags:` block below
#
# Valid tag colors (in the `tags:` block): green, amber, gray
# The `tags:` block is not drawn in the legend — the pills are meant to read on
# their own. A wrong grade renders a red "?" badge; an unknown tag renders a gray
# "?" pill — both are visible in preview so mistakes are easy to catch.
# =============================================================================

meta:
  badge: "REFERENCE"
  title_main: "The LLM"
  title_accent: "Reading List"
  subtitle: >
    A curated map of large language model research — from foundations to frontier
    topics, with reading-depth recommendations.
  author: "Haoming Wang"
  version: "v1"
  updated: "August 2026"

legend:
  - { grade: "A",  label: "Deep read" }
  - { grade: "A-", label: "Method + experiments" }
  - { grade: "B+", label: "Problem + conclusion" }
  - { grade: "B",  label: "Skim" }
  - { grade: "C",  label: "Core idea only" }

tags:
  - { key: "★",  label: "Must-read",   color: "amber" }
  - { key: "▶",  label: "Video",       color: "gray" }

categories:
  - name: "ML and LLM basics"
    intro: >
      I guess you already know how an LLM works, so instead of a detailed tutorial
      I will list some blogs and YouTube videos with very good visualizations — they
      are interesting to look at even if you have already known that.
    # Each subsection leads with a video primer (video_id renders a YouTube
    # thumbnail); expand it to see related papers. Add real papers under `papers:`.
    subtopics:
      - name: "Large language models, a short introduction"
        video_id: "LPZh9BOjkQs"
        video_note: "3Blue1Brown — a visual, jargon-light overview of what an LLM is."
        papers:
          - { year: 2023, title: "What Is ChatGPT Doing … and Why Does It Work?", note: "Wolfram, from next-token probabilities up to the whole model. Long, and worth it.", grade: "A-", url: "https://writings.stephenwolfram.com/2023/02/what-is-chatgpt-doing-and-why-does-it-work/", featured: true }
          - { year: 2025, title: "Deep Dive into LLMs like ChatGPT", note: "Karpathy's 3½-hour tour of the full training stack: pretraining, SFT, RLHF. (Video.)", grade: "A-", url: "https://www.youtube.com/watch?v=7xTGNNLPyMI", tags: ["▶"] }
          - { year: 2023, title: "Generative AI exists because of the transformer", note: "The Financial Times' scrolling visual explainer. The best thing to send a non-specialist.", grade: "B", url: "https://ig.ft.com/generative-ai/" }
      - name: "Tokenization"
        video_id: "zduSFxRajkE"
        video_note: "Andrej Karpathy — builds a tokenizer from scratch; how text becomes tokens. (Long.)"
        papers:
          - { year: 2015, title: "Neural Machine Translation of Rare Words with Subword Units (BPE)", note: "The merge rule every modern tokenizer still runs.", grade: "B+", url: "https://arxiv.org/abs/1508.07909", featured: true }
          - { year: 2018, title: "SentencePiece", note: "Tokenization without pre-tokenization, so it works on languages that do not use spaces.", grade: "B", url: "https://arxiv.org/abs/1808.06226" }
          - { title: "Tiktokenizer", note: "Type text, watch it split. Ten minutes here explains most tokenizer bugs you will ever hit.", grade: "C", url: "https://tiktokenizer.vercel.app/" }
      - name: "Word embeddings and unembedding"
        video_id: "wjZofJX0v4M"
        video_note: "3Blue1Brown — the input and output layers of an LLM, visualized."
        papers:
          - { year: 2013, title: "Efficient Estimation of Word Representations (word2vec)", note: "Where the idea that direction carries meaning starts.", grade: "B+", url: "https://arxiv.org/abs/1301.3781", featured: true }
          - { title: "The Illustrated Word2vec", note: "Jay Alammar. The analogy arithmetic, drawn rather than asserted.", grade: "A-", url: "https://jalammar.github.io/illustrated-word2vec/" }
          - { title: "TensorFlow Embedding Projector", note: "Rotate a real embedding space in 3D and look for the neighbourhoods yourself.", grade: "C", url: "https://projector.tensorflow.org/" }
      - name: "Attention in transformers"
        video_id: "eMlx5fFNoYc"
        video_note: "3Blue1Brown — how attention moves information between tokens."
        papers:
          - { year: 2017, title: "Attention Is All You Need", note: "The paper. Read it after one of the explainers below, not before.", grade: "A", url: "https://arxiv.org/abs/1706.03762", featured: true, tags: ["★"] }
          - { title: "The Illustrated Transformer", note: "Jay Alammar. Still the clearest static picture of what Q, K and V are doing.", grade: "A", url: "https://jalammar.github.io/illustrated-transformer/", featured: true }
          - { title: "Transformer Explainer", note: "A live GPT-2 in the browser: type a sentence, watch the attention weights and logits move.", grade: "A-", url: "https://poloclub.github.io/transformer-explainer/" }
          - { title: "The Annotated Transformer", note: "Harvard NLP. The 2017 paper, line by line, next to the PyTorch that implements it.", grade: "A-", url: "https://nlp.seas.harvard.edu/annotated-transformer/" }
          - { title: "Everything about Transformers", note: "Krupa Dave. A long-form walk through the architecture, one component at a time.", grade: "B+", url: "https://www.krupadave.com/articles/everything-about-transformers?x=v3" }
      - name: "GPT from scratch"
        video_id: "kCc8FmEb1nY"
        video_note: "Andrej Karpathy — builds a GPT in code, step by step. (Long.)"
        papers:
          - { title: "GPT in 60 Lines of NumPy", note: "Jay Mody. No framework, no training loop — just the forward pass, so nothing can hide.", grade: "A", url: "https://jaykmody.com/blog/gpt-from-scratch/", featured: true }
          - { title: "nanoGPT", note: "Karpathy. The smallest repository that still trains a real GPT-2.", grade: "A-", url: "https://github.com/karpathy/nanoGPT" }
          - { title: "LLM Visualization", note: "Brendan Bycroft. A 3D walkthrough of nano-GPT executing, tensor by tensor.", grade: "A-", url: "https://bbycroft.net/llm" }
          - { title: "LLMs from Scratch — instruction fine-tuning (ch. 7)", note: "Raschka. The notebook that turns a pretrained base model into one that follows instructions.", grade: "A-", url: "https://github.com/rasbt/LLMs-from-scratch/blob/main/ch07/01_main-chapter-code/ch07.ipynb", featured: true }
          - { title: "LLMs from Scratch — the full book repository", note: "The preceding six chapters, if you want the whole build rather than the last step.", grade: "B+", url: "https://github.com/rasbt/LLMs-from-scratch" }

  - name: "Modern LLM architecture"
    intro: >
      Chapter 1 is the standard decoder — patchless, plain, the one in the textbook. Almost
      nothing in production still looks exactly like it. This chapter is a tour of the parts
      that were replaced and why: how position gets encoded, how attention was made cheap
      enough to serve, what the KV cache costs and how to shrink it, what happened to the
      feed-forward block, and what replaced Adam. Each section opens with a video from
      Jia-Bin Huang's channel — the best visual explanations of these components anywhere —
      then lists the papers and blogs behind it.
    subtopics:
      - name: "Positional encoding"
        videos:
          - { id: "SMBkImDWOyQ", note: "Jia-Bin Huang — RoPE: why rotation, and why it extrapolates." }
        papers:
          - { year: 2021, title: "RoFormer (RoPE)", note: "Position as a rotation of the query and key, so attention sees relative offset for free.", grade: "A-", url: "https://arxiv.org/abs/2104.09864", featured: true }
          - { year: 2021, title: "ALiBi", note: "Skip embeddings entirely: bias the attention scores by distance.", grade: "B+", url: "https://arxiv.org/abs/2108.12409" }
          - { year: 2023, title: "YaRN", note: "Stretch a trained RoPE to a longer context without retraining from scratch.", grade: "B+", url: "https://arxiv.org/abs/2309.00071" }
          - { title: "Rotary Embeddings: A Relative Revolution", note: "EleutherAI. The derivation, worked slowly.", grade: "A-", url: "https://blog.eleuther.ai/rotary-embeddings/" }
          - { title: "You could have designed state-of-the-art positional encoding", note: "Builds RoPE from the requirements up, as if you were inventing it.", grade: "A-", url: "https://huggingface.co/blog/designing-positional-encoding", featured: true }

      - name: "Attention efficiency and the KV cache"
        videos:
          - { id: "Y-o545eYjXM", note: "Jia-Bin Huang — MHA → MQA → GQA → MLA → DSA, in one arc." }
          - { id: "q8holiIirgo", note: "Jia-Bin Huang — DeepSeek V4's compressed attention (CSA/HCA)." }
          - { id: "gBMO1JZav44", note: "Jia-Bin Huang — FlashAttention: why the bottleneck is memory, not FLOPs." }
        papers:
          - { year: 2019, title: "Fast Transformer Decoding (MQA)", note: "One KV head for all query heads. The first cut at the cache.", grade: "B+", url: "https://arxiv.org/abs/1911.02150" }
          - { year: 2023, title: "GQA", note: "The compromise that shipped: a few KV heads, not one and not all.", grade: "A-", url: "https://arxiv.org/abs/2305.13245", featured: true }
          - { year: 2023, title: "Llama 2", note: "Open weights, GQA, and an RLHF recipe — the reference implementation of this section.", grade: "A-", url: "https://arxiv.org/abs/2307.09288" }
          - { year: 2024, title: "DeepSeek-V2 (MLA)", note: "Compress KV into a low-rank latent; cache the latent, not the heads.", grade: "A", url: "https://arxiv.org/abs/2405.04434", featured: true, tags: ["★"] }
          - { year: 2025, title: "DeepSeek-V3.2 (DSA)", note: "Sparse attention: each query attends to a learned subset of the context.", grade: "B+", url: "https://arxiv.org/abs/2512.02556" }
          - { year: 2026, title: "DeepSeek-V4", note: "Compressed and hierarchical attention for million-token context.", grade: "B+", url: "https://arxiv.org/abs/2606.19348" }
          - { year: 2023, title: "StreamingLLM", note: "Attention sinks: keep the first few tokens and the cache can be a rolling window.", grade: "B+", url: "https://arxiv.org/abs/2309.17453" }
          - { title: "Transformer Inference Arithmetic", note: "Kipply. Work out the KV-cache bytes and the memory-bandwidth bound by hand.", grade: "A", url: "https://kipp.ly/transformer-inference-arithmetic/", featured: true }
          - { title: "Large Transformer Model Inference Optimization", note: "Lilian Weng's survey of everything in this section, plus quantization and sparsity.", grade: "A-", url: "https://lilianweng.github.io/posts/2023-01-10-inference-optimization/" }

      - name: "Beyond softmax attention"
        videos:
          - { id: "pUCWwGR5WmQ", note: "Jia-Bin Huang — linear attention: constant memory, no matter the context length." }
          - { id: "2eZKT4H9_iQ", note: "Jia-Bin Huang — Exclusive Self-Attention: stop the token attending to itself." }
        papers:
          - { year: 2020, title: "Transformers are RNNs (linear attention)", note: "Drop the softmax and the quadratic cost becomes a recurrent state.", grade: "A-", url: "https://arxiv.org/abs/2006.16236", featured: true }
          - { year: 2023, title: "Mamba", note: "A selective state-space model: linear time, and competitive at last.", grade: "A", url: "https://arxiv.org/abs/2312.00752", featured: true, tags: ["★"] }
          - { year: 2023, title: "RWKV", note: "An RNN with transformer-grade training parallelism.", grade: "B+", url: "https://arxiv.org/abs/2305.13048" }
          - { year: 2023, title: "Gated Linear Attention", note: "The gate is what closes most of the quality gap to softmax.", grade: "B+", url: "https://arxiv.org/abs/2312.06635" }
          - { year: 2026, title: "Exclusive Self Attention (XSA)", note: "Remove the projection onto the token's own value vector. Two lines, consistent gains.", grade: "B+", url: "https://arxiv.org/abs/2603.09078" }
          - { title: "DeltaNet, explained", note: "Songlin Yang. The clearest account of the linear-attention-as-fast-weights view.", grade: "A-", url: "https://sustcsonglin.github.io/blog/2024/deltanet-1/" }
          - { title: "The Annotated Mamba", note: "Sasha Rush. Mamba's selective scan, line by line.", grade: "A-", url: "https://srush.github.io/annotated-mamba/hard.html" }

      - name: "Mixture of experts"
        videos:
          - { id: "0QQlYR1r6pQ", note: "Jia-Bin Huang — MoE visually explained: routing, load balancing, capacity." }
        papers:
          - { year: 2017, title: "Outrageously Large Neural Networks (sparsely-gated MoE)", note: "The original: a top-k gate over thousands of experts.", grade: "B+", url: "https://arxiv.org/abs/1701.06538" }
          - { year: 2021, title: "Switch Transformer", note: "Route to exactly one expert; the load-balancing loss that made it trainable.", grade: "A-", url: "https://arxiv.org/abs/2101.03961", featured: true }
          - { year: 2024, title: "Mixtral of Experts", note: "The open-weights sparse MoE decoder everyone benchmarked against.", grade: "B+", url: "https://arxiv.org/abs/2401.04088" }
          - { year: 2024, title: "DeepSeekMoE", note: "Fine-grained experts plus shared experts; the design most 2025 models copied.", grade: "A-", url: "https://arxiv.org/abs/2401.06066", featured: true }
          - { title: "Mixture of Experts Explained", note: "Hugging Face. Routing, capacity factor, and why MoE is hard to fine-tune.", grade: "A-", url: "https://huggingface.co/blog/moe" }

      - name: "Memory and knowledge layers"
        videos:
          - { id: "87Q8nf1XHKA", note: "Jia-Bin Huang — DeepSeek's Engram: knowledge lookup as a first-class primitive." }
        papers:
          - { year: 2019, title: "Large Memory Layers with Product Keys", note: "A near-free lookup table with millions of slots, searched in sublinear time.", grade: "B+", url: "https://arxiv.org/abs/1907.05242" }
          - { year: 2024, title: "Memory Layers at Scale", note: "The idea, revived and scaled; trainable memory beats extra FFN parameters.", grade: "B+", url: "https://arxiv.org/abs/2412.09764" }
          - { year: 2026, title: "Engram: Conditional Memory via Scalable Lookup", note: "O(1) N-gram lookup, freeing attention and MoE from storing static facts.", grade: "A-", url: "https://arxiv.org/abs/2601.07372", featured: true }
          - { title: "deepseek-ai/Engram", note: "The reference implementation.", grade: "C", url: "https://github.com/deepseek-ai/Engram" }

      - name: "Normalization and activation functions"
        videos:
          - { id: "JHl_gwVoh-k", note: "Jia-Bin Huang — what normalization layers actually do, and why training breaks without them." }
          - { id: "JRaPNrpsQ9s", note: "Jia-Bin Huang — the 60-year evolution of the activation function." }
        papers:
          - { year: 2016, title: "Layer Normalization", note: "The one the original transformer used.", grade: "B", url: "https://arxiv.org/abs/1607.06450" }
          - { year: 2019, title: "RMSNorm", note: "Drop the mean subtraction; nothing breaks and it is faster. Now the default.", grade: "B+", url: "https://arxiv.org/abs/1910.07467", featured: true }
          - { year: 2020, title: "On Layer Normalization in the Transformer Architecture", note: "Why Pre-LN trains without a warmup schedule and Post-LN does not.", grade: "A-", url: "https://arxiv.org/abs/2002.04745", featured: true }
          - { year: 2020, title: "GLU Variants Improve Transformer", note: "The two-page paper that put SwiGLU in every modern feed-forward block.", grade: "B+", url: "https://arxiv.org/abs/2002.05202" }
          - { year: 2025, title: "Transformers without Normalization (DyT)", note: "Replace the norm with a scaled tanh. Read it as a probe of what norms were doing.", grade: "B+", url: "https://arxiv.org/abs/2503.10622" }

      - name: "The residual stream"
        videos:
          - { id: "LSHTkbnmzy4", note: "Jia-Bin Huang — Attention Residuals: learned, input-dependent mixing across depth." }
          - { id: "jYn_1PpRzxI", note: "Jia-Bin Huang — hyper-connections and mHC: widening the residual stream." }
        papers:
          - { year: 2015, title: "Deep Residual Learning (ResNet)", note: "The identity shortcut. Everything in this section is an attempt to improve on it.", grade: "B+", url: "https://arxiv.org/abs/1512.03385" }
          - { year: 2024, title: "Hyper-Connections", note: "Widen the residual stream and learn the connection pattern between layers.", grade: "B+", url: "https://arxiv.org/abs/2409.19606" }
          - { year: 2026, title: "mHC: Manifold-Constrained Hyper-Connections", note: "Project the mixing matrices onto the Birkhoff polytope so identity mapping survives.", grade: "A-", url: "https://arxiv.org/abs/2512.24880", featured: true }
          - { year: 2026, title: "Attention Residuals", note: "Kimi. Softmax attention over all preceding layer outputs, instead of a fixed unit sum.", grade: "A-", url: "https://arxiv.org/abs/2603.15031" }

      - name: "Optimizers beyond Adam"
        videos:
          - { id: "1_nujVNUsto", note: "Jia-Bin Huang — AdamW, and what the weight-decay fix actually fixes." }
          - { id: "bO5nvE289ec", note: "Jia-Bin Huang — Muon: orthogonalize the update, beat AdamW." }
        papers:
          - { year: 2014, title: "Adam", note: "Per-parameter adaptive step sizes. Still the baseline to beat.", grade: "B", url: "https://arxiv.org/abs/1412.6980" }
          - { year: 2017, title: "Decoupled Weight Decay (AdamW)", note: "L2 penalty and weight decay are not the same thing under Adam.", grade: "B+", url: "https://arxiv.org/abs/1711.05101", featured: true }
          - { title: "Muon: An optimizer for the hidden layers of neural networks", note: "Keller Jordan's original post. Newton–Schulz orthogonalization of the momentum matrix.", grade: "A", url: "https://kellerjordan.github.io/posts/muon/", featured: true }
          - { year: 2025, title: "Moonlight — scaling Muon", note: "The weight decay and per-parameter scaling that make Muon work at LLM scale.", grade: "A-", url: "https://arxiv.org/abs/2502.16982" }
          - { year: 2024, title: "SOAP", note: "Shampoo in an Adam eigenbasis; the other serious second-order contender.", grade: "B", url: "https://arxiv.org/abs/2409.11321" }

      - name: "Low-rank adaptation"
        videos:
          - { id: "U80tjcThl9Q", note: "Jia-Bin Huang — LoRA: why two small matrices are enough, and why initialization matters." }
        papers:
          - { year: 2021, title: "LoRA", note: "Freeze the base model, learn a rank-r update. The default way to fine-tune anything.", grade: "A", url: "https://arxiv.org/abs/2106.09685", featured: true, tags: ["★"] }
          - { year: 2023, title: "QLoRA", note: "4-bit base weights plus LoRA adapters; a 65B model fine-tunes on one GPU.", grade: "A-", url: "https://arxiv.org/abs/2305.14314" }
          - { year: 2024, title: "LoRA Learns Less and Forgets Less", note: "The honest evaluation: it is a regularizer as much as an efficiency trick.", grade: "B+", url: "https://arxiv.org/abs/2405.09673" }
          - { title: "Practical Tips for Finetuning LLMs Using LoRA", note: "Sebastian Raschka. What rank, which layers, and what actually moves the number.", grade: "B+", url: "https://lightning.ai/pages/community/tutorial/lora-llm/" }

  - name: "LLM infrastructure"
    intro: >
      Chapter 2 asked what a model computes; this chapter asks which physical resource pays
      for it. Read the sections as a sequence of resource transformations: FLOPs become
      memory traffic, kernels try to keep that traffic on chip, precision shrinks it,
      sharding trades memory for collectives, and the serving runtime turns ragged requests
      into dense work. The recurring mistake is to optimize the advertised resource instead
      of measuring the bottleneck that is actually on the critical path.
    subtopics:
      - name: "The hardware floor: memory bandwidth, arithmetic intensity, and the roofline"
        sections:
          - heading: "Count bytes before FLOPs"
            notes:
              - text: "Peak FLOPs is a ceiling, not a prediction. The roofline bounds useful throughput by the smaller of compute capacity and the rate at which memory can feed that compute:"
                display: "achievable FLOP/s ≤ min(peak FLOP/s, arithmetic intensity × memory bandwidth)"
              - text: "One request crosses both regimes. Prefill turns many prompt tokens into large matrix–matrix multiplies and is usually compute-heavy; low-concurrency decode repeatedly streams weights and a growing KV cache to emit one token and is usually bandwidth-heavy. The same GPU can be compute-starved and memory-starved milliseconds apart."
              - text: "Batching and reuse raise arithmetic intensity; fusion and quantization reduce bytes; algorithmic changes reduce operations. FlashAttention did not remove dense attention’s quadratic arithmetic—it won by avoiding a quadratic score matrix in HBM."
              - text: "Roofline is a first-order diagnostic, not a benchmark. Small shapes, occupancy, launch latency, collectives, and irregular MoE routing can leave a kernel far below either roof."
            image: "/assets/img/reading_list/systems_roofline.svg"
            image_width: 860
            image_alt: "A roofline chart placing decode on the memory-bandwidth slope and batched prefill near the compute ceiling."
            image_caption: "One model, two hardware regimes. A useful optimization moves the measured bottleneck rather than merely increasing a headline peak."
            papers:
              - { year: 2009, title: "Roofline: An Insightful Visual Performance Model", note: "The enduring model for deciding whether arithmetic or data movement limits a workload.", grade: "A", url: "https://digicoll.lib.berkeley.edu/record/136692/files/EECS-2008-134.pdf", featured: true, tags: ["★"] }
              - { title: "How to Scale Your Model — the JAX Scaling Book", note: "A modern worked systems book connecting accelerators, collectives, sharding, and inference arithmetic.", grade: "A", url: "https://jax-ml.github.io/scaling-book/", featured: true }
              - { title: "Inference — the JAX Scaling Book", note: "Derives why prefill and decode usually occupy different hardware regimes.", grade: "A-", url: "https://jax-ml.github.io/scaling-book/inference/" }
              - { year: 2022, title: "FlashAttention", note: "Made I/O complexity part of the transformer algorithm rather than an implementation footnote.", grade: "A", url: "https://arxiv.org/abs/2205.14135", featured: true, tags: ["★"] }

      - name: "Kernels and compilers: CUDA, Triton, torch.compile, and fused attention"
        sections:
          - heading: "An operator is not a kernel"
            notes:
              - text: "A mathematical operator says what to compute. A kernel is a schedule for moving tiles through HBM, caches, shared memory, registers, and tensor cores. Eager code often writes each intermediate to HBM; fusion earns speed by keeping values on chip and avoiding launches."
              - text: "The abstraction ladder runs from CUDA threads, through Triton tiled programs, to torch.compile graph capture and generated kernels. Each higher rung buys productivity while retaining shape-dependent cliffs, graph breaks, and escape hatches."
              - text: "FlashAttention’s generations are a history of hardware co-design: FA1 reduces I/O, FA2 repairs work partitioning, FA3 overlaps data movement with Hopper tensor cores, and FA4 changes the pipeline again for Blackwell. Portable rarely means optimal."
              - text: "Prefill and decode deserve separate kernels. Square attention and one-query-against-long-KV attention have different tiling, occupancy, and reduction problems even if an API calls both attention."
            papers:
              - { year: 2019, title: "Triton: An Intermediate Language and Compiler for Tiled Neural Network Computations", note: "The foundational case for exposing tiles rather than threads.", grade: "B+", url: "https://research.ibm.com/publications/triton-an-intermediate-language-and-compiler-for-tiled-neural-network-computations" }
              - { year: 2024, title: "PyTorch 2: Dynamic Python Bytecode Transformation and Graph Compilation", note: "Dynamo and Inductor, including the boundary between Python flexibility and compiler visibility.", grade: "A-", url: "https://pytorch.org/assets/pytorch2-2.pdf" }
              - { year: 2024, title: "FlashAttention-3", note: "Warp specialization, asynchronous pipelines, and FP8 on Hopper.", grade: "A-", url: "https://arxiv.org/abs/2407.08608" }
              - { year: 2025, title: "FlexAttention", note: "Expose the score modification and let the compiler recover a fused kernel.", grade: "A-", url: "https://proceedings.mlsys.org/paper_files/paper/2025/hash/61a9278dfef5f871b5e472389f8d6fa1-Abstract-Conference.html" }
              - { year: 2026, title: "FlashAttention-4", note: "A Blackwell-era study of algorithm and kernel-pipeline co-design.", grade: "A", url: "https://arxiv.org/abs/2603.05451", featured: true, tags: ["★"] }

      - name: "Numerical precision: mixed precision, BF16, FP8, and sub-8-bit training"
        sections:
          - heading: "Precision is a contract between tensors"
            notes:
              - text: "“Training in FP8” never means every tensor is FP8. Storage, GEMM inputs, accumulators, reduced gradients, optimizer moments, and master weights need different range and resolution. The full contract—not one dtype label—is the method."
              - text: "FP16’s narrow exponent motivates loss scaling; BF16 keeps FP32’s exponent range and sacrifices mantissa precision. FP8 then requires explicit scales: E4M3 favors precision, E5M2 favors range, and microscaling reduces the block over which one outlier taxes every other value."
              - text: "FP4 is mainly a scaling-and-outlier-control result, not the act of deleting four more bits. Current NVFP4 evidence combines fine blocks, two-level scaling, transforms, stochastic rounding, and selected high-precision operations."
                display: "less exponent → clipping; less mantissa → rounding; smaller scale blocks → less outlier tax, more metadata"
              - text: "Narrower formats help only when hardware has native kernels and the runtime fuses scaling, transposition, and communication. Conversion overhead can otherwise consume the theoretical win."
            papers:
              - { year: 2017, title: "Mixed Precision Training", note: "Master weights and loss scaling: the foundational recipe.", grade: "A", url: "https://arxiv.org/abs/1710.03740", featured: true, tags: ["★"] }
              - { year: 2019, title: "A Study of BFLOAT16 for Deep Learning Training", note: "Why exponent range mattered more than FP16’s extra mantissa bits.", grade: "A-", url: "https://arxiv.org/abs/1905.12322" }
              - { year: 2022, title: "FP8 Formats for Deep Learning", note: "Defines E4M3 and E5M2 and the modern FP8 division of labor.", grade: "A", url: "https://arxiv.org/abs/2209.05433", featured: true }
              - { year: 2024, title: "Scaling FP8 Training to Trillion-Token LLMs", note: "Long runs reveal stability problems that short demonstrations miss.", grade: "A-", url: "https://arxiv.org/abs/2409.12517" }
              - { year: 2025, title: "Pretraining Large Language Models with NVFP4", note: "The strongest public FP4 convergence result so far; hardware- and recipe-specific.", grade: "A-", url: "https://arxiv.org/abs/2509.25149" }

      - name: "Parallelism: data, tensor, pipeline, sequence, and expert"
        sections:
          - heading: "Shard a tensor axis; pay a collective"
            notes:
              - text: "Every parallelism cuts a different axis and receives a different bill: data parallelism synchronizes gradients, tensor parallelism communicates inside layers, pipeline parallelism sends activations and creates bubbles, context parallelism exchanges attention state, and expert parallelism dispatches tokens with all-to-all."
              - text: "Topology is the governing rule. Put the chattiest dimension on the fastest links: tensor parallelism generally stays within an NVLink domain, while pipeline and data parallelism can cross slower boundaries because their communication is less frequent."
              - text: "More shards can slow a run. GEMMs become narrower, collective latency dominates, and pipeline bubbles grow. The plan is an optimization over model shape, context, microbatch, topology, and memory—not a checklist."
              - text: "“Sequence parallelism” is overloaded. Megatron shards activations around tensor-parallel regions; Ulysses and Ring Attention shard the attention context itself. Calling the latter context parallelism keeps the communication bill clear."
            papers:
              - { year: 2019, title: "Megatron-LM", note: "The practical origin of transformer tensor parallelism.", grade: "A", url: "https://arxiv.org/abs/1909.08053", featured: true, tags: ["★"] }
              - { year: 2019, title: "GPipe", note: "Pipeline microbatches and the bubble, exposed cleanly.", grade: "B+", url: "https://arxiv.org/abs/1811.06965" }
              - { year: 2021, title: "Efficient Large-Scale Language Model Training on GPU Clusters", note: "The canonical data × tensor × pipeline composition.", grade: "A", url: "https://arxiv.org/abs/2104.04473", featured: true }
              - { year: 2023, title: "DeepSpeed-Ulysses", note: "Context sharding through all-to-all head exchange.", grade: "A-", url: "https://arxiv.org/abs/2309.14509" }
              - { year: 2023, title: "Ring Attention", note: "Circulates KV blocks while overlapping communication with attention.", grade: "A-", url: "https://arxiv.org/abs/2310.01889" }

      - name: "Fitting the model in memory: sharding, checkpointing, and offload"
        sections:
          - heading: "Keep a memory ledger"
            notes:
              - text: "A conventional mixed-precision Adam implementation is roughly 16 bytes per parameter—weights, gradients, FP32 master weights, and two moments—before activations and temporary buffers. The exact number is implementation-dependent, and at long context activations can dominate."
              - text: "The capacity levers spend different currencies:"
                display: "shard state → communication; checkpoint activations → recomputation; offload → interconnect or storage traffic"
              - text: "ZeRO successively shards optimizer state, gradients, and parameters. FSDP or ZeRO-3 all-gathers a layer for computation and reshares it afterward, so transient peaks, prefetch timing, and collective overlap matter as much as resident memory."
              - text: "Activation checkpointing is not durable job checkpointing: it discards forward intermediates and recreates them in backward. CPU and NVMe offload similarly expand capacity, not bandwidth; a model can fit and still train unusably slowly."
            papers:
              - { year: 2016, title: "Training Deep Nets with Sublinear Memory Cost", note: "The activation-rematerialization foundation.", grade: "A", url: "https://arxiv.org/abs/1604.06174" }
              - { year: 2020, title: "ZeRO", note: "The model-state ledger and staged sharding that reorganized distributed training.", grade: "A", url: "https://arxiv.org/abs/1910.02054", featured: true, tags: ["★"] }
              - { year: 2021, title: "ZeRO-Offload", note: "A disciplined CPU/GPU placement argument rather than simply moving tensors to RAM.", grade: "A-", url: "https://www.usenix.org/conference/atc21/presentation/ren-jie" }
              - { year: 2023, title: "PyTorch FSDP", note: "An industry account of ZeRO-3-style parameter sharding.", grade: "A-", url: "https://arxiv.org/abs/2304.11277" }
              - { year: 2025, title: "Current and New Activation Checkpointing Techniques in PyTorch", note: "A clear guide to selective checkpointing and memory-budget APIs.", grade: "A-", url: "https://pytorch.org/blog/activation-checkpointing-techniques/" }

      - name: "The serving loop: continuous batching, paged and prefix KV caches"
        sections:
          - heading: "The scheduler is part of the model system"
            notes:
              - text: "Autoregressive requests are ragged loops, not ordinary batches. Orca’s decisive move was to reschedule after every token: finished requests leave and arrivals join the next iteration. The scheduler converts irregular traffic into dense GPU work."
              - text: "Paging and prefix caching solve different problems. PagedAttention allocates KV in fixed physical blocks so sequences grow without contiguous reservation; it reduces fragmentation but neither compresses KV nor avoids prefill. Prefix caching lets an identical causal prefix reuse computed blocks."
              - text: "Radix trees and hashed blocks move the hard problem into routing, admission, and eviction. A cache hit on the wrong worker can lose to a local miss after transfer and queueing, and semantic similarity is not an exact KV cache key."
              - text: "Optimize goodput: requests satisfying both time-to-first-token and inter-token-latency objectives. Unconstrained tokens per second can rise while user-visible latency gets worse."
            papers:
              - { year: 2022, title: "Orca", note: "Iteration-level scheduling, the foundation beneath continuous batching.", grade: "A", url: "https://www.usenix.org/conference/osdi22/presentation/yu", featured: true, tags: ["★"] }
              - { year: 2023, title: "vLLM: Easy, Fast, and Cheap LLM Serving with PagedAttention", note: "Virtual-memory ideas applied cleanly to KV allocation.", grade: "A", url: "https://arxiv.org/abs/2309.06180", featured: true }
              - { year: 2024, title: "SGLang", note: "RadixAttention makes structured cross-call prefix reuse a runtime primitive.", grade: "A-", url: "https://arxiv.org/abs/2312.07104" }
              - { year: 2024, title: "Hydragen", note: "Shared prefixes can turn repeated matrix–vector work into a batched matrix multiply.", grade: "A-", url: "https://arxiv.org/abs/2402.05099" }
              - { year: 2025, title: "KVCache Cache in the Wild", note: "Production-trace evidence that corrects synthetic cache assumptions.", grade: "A-", url: "https://www.usenix.org/conference/atc25/presentation/wang-jiahao" }

      - name: "Latency: speculative decoding, chunked prefill, prefill–decode disaggregation"
        sections:
          - heading: "Latency is three numbers"
            notes:
              - text: "Prefill determines time to first token, decode determines time per output token, and queueing contaminates both. Speculation, chunking, and disaggregation attack different terms; calling all of them latency optimizations hides the trade."
              - text: "Speculative decoding lets a cheap draft propose several tokens and the target verify them in parallel. Exact rejection sampling preserves the target distribution, but speed depends on acceptance, draft cost, and unused target capacity. It can lose at high concurrency when the target is already compute-saturated."
              - text: "Chunked prefill splits a long prompt into bounded pieces that share iterations with active decodes. Smaller chunks improve fairness and protect inter-token latency, but add launches and may delay that prompt’s first token."
              - text: "Disaggregation gives compute-heavy prefill and bandwidth-heavy decode separate workers and scaling policies. It also adds KV transfer and rate matching; recent studies find benefits for large models and prefill-heavy traffic, not a universal default."
            papers:
              - { year: 2023, title: "Fast Inference from Transformers via Speculative Decoding", note: "The exact sampling construction and conceptual starting point.", grade: "A", url: "https://arxiv.org/abs/2211.17192" }
              - { year: 2024, title: "Sarathi-Serve", note: "Chunked prefill and stall-free scheduling around latency SLOs.", grade: "A", url: "https://www.usenix.org/conference/osdi24/presentation/agrawal", featured: true }
              - { year: 2024, title: "DistServe", note: "Establishes prefill/decode disaggregation around TTFT and TPOT goodput.", grade: "A", url: "https://www.usenix.org/conference/osdi24/presentation/zhong-yinmin", featured: true, tags: ["★"] }
              - { year: 2025, title: "EAGLE-3", note: "A modern learned drafting method using multi-layer features.", grade: "A-", url: "https://arxiv.org/abs/2503.01840" }
              - { year: 2025, title: "Beyond the Buzz: A Pragmatic Take on Inference Disaggregation", note: "A valuable negative result: disaggregation wins only in the right rate and topology regime.", grade: "A", url: "https://research.nvidia.com/publication/2025-06_beyond-buzz-pragmatic-take-inference-disaggregation", featured: true }

      - name: "Compression: quantization, pruning, and distillation for deployment"
        sections:
          - heading: "A smaller checkpoint is not yet a faster system"
            notes:
              - text: "Name the bytes being compressed. Weight-only INT4 mainly helps capacity and low-batch bandwidth-bound decode; W8A8 targets compute-heavy serving; KV quantization matters as context and concurrency grow. “Four-bit model” is underspecified."
              - text: "A format becomes a speedup only when a kernel executes it efficiently. Dequantization, scale metadata, packing, and unsupported sparse layouts can make a smaller checkpoint slower. QServe is useful because it co-designs W4A8KV4 with execution."
              - text: "Pruning has the widest gap between paper sparsity and wall-clock speed. Unstructured sparsity is often only an accuracy result; structured 2:4 or block sparsity is more executable but constrains which weights may disappear."
              - text: "Distillation changes the function rather than its encoding. It costs a training run, but a truly smaller model reduces arithmetic, weight traffic, KV size, and operational complexity on every request."
            papers:
              - { year: 2023, title: "GPTQ", note: "The second-order, one-shot weight-quantization baseline.", grade: "A-", url: "https://arxiv.org/abs/2210.17323" }
              - { year: 2023, title: "SmoothQuant", note: "Moves activation outliers into weights to unlock practical W8A8.", grade: "A", url: "https://arxiv.org/abs/2211.10438", featured: true, tags: ["★"] }
              - { year: 2024, title: "AWQ", note: "Weight-only quantization built around activation-salient channels.", grade: "A", url: "https://proceedings.mlsys.org/paper_files/paper/2024/hash/42a452cbafa9dd64e9ba4aa95cc1ef21-Abstract-Conference.html", featured: true }
              - { year: 2023, title: "SparseGPT", note: "Strong one-shot pruning; sparsity is not proportional latency.", grade: "B+", url: "https://proceedings.mlr.press/v202/frantar23a.html" }
              - { year: 2024, title: "QServe", note: "Bit width, dequantization, KV format, and kernels designed together.", grade: "A-", url: "https://arxiv.org/abs/2405.04532" }
              - { year: 2025, title: "ParetoQ", note: "A unified 1–4-bit QAT study, with hardware support still decisive.", grade: "A-", url: "https://arxiv.org/abs/2502.02631" }

      - name: "Mixture-of-experts systems: expert parallelism, routing, and all-to-all"
        sections:
          - heading: "Sparse arithmetic, dense systems problems"
            notes:
              - text: "MoE makes arithmetic sparse, not the system. Every layer stores a large expert bank, routes tokens, permutes activations, runs grouped ragged GEMMs, and reverses the permutation:"
                display: "route → dispatch all-to-all → grouped expert GEMM → combine all-to-all"
              - text: "The bargain is fewer active weights for more irregularity. Tiny expert batches underfill tensor cores, skew creates stragglers, and all-to-all stresses the fabric. MegaBlocks replaces padding or token dropping with block-sparse expert work."
              - text: "Load balance is both systems policy and learning intervention. Auxiliary losses can distort specialization; routing biases, redundant hot experts, and topology-aware placement attack imbalance without assuming traffic is stationary."
              - text: "Never infer runtime from active parameter count alone. Tokens per expert, router skew, grouped-GEMM shape, duplicated experts, overlap, and topology determine delivered latency."
            papers:
              - { year: 2022, title: "Switch Transformers", note: "The modern sparse-routing model and its capacity-factor trade-off.", grade: "A-", url: "https://jmlr.org/papers/v23/21-0998.html" }
              - { year: 2023, title: "MegaBlocks", note: "Why padding and token dropping are systems artifacts, not necessities.", grade: "A", url: "https://proceedings.mlsys.org/paper_files/paper/2023/hash/5a54f79333768effe7e8927bcccffe40-Abstract-mlsys2023.html", featured: true, tags: ["★"] }
              - { year: 2023, title: "Tutel", note: "Adaptive parallelism and pipelining for dynamic expert load.", grade: "B+", url: "https://proceedings.mlsys.org/paper_files/paper/2023/hash/5616d34cf8ff73942cfd5aa922842556-Abstract-mlsys2023.html" }
              - { year: 2024, title: "DeepSeek-V3 Technical Report", note: "Routing bias, node-limited routing, FP8, and compute–communication overlap.", grade: "A", url: "https://arxiv.org/abs/2412.19437", featured: true }
              - { year: 2025, title: "DeepEP", note: "Primary implementation of throughput- and latency-oriented expert dispatch.", grade: "A-", url: "https://github.com/deepseek-ai/DeepEP" }
              - { year: 2025, title: "MegaScale-MoE", note: "A production-scale account of communication-efficient MoE training.", grade: "A-", url: "https://arxiv.org/abs/2505.11432" }

      - name: "Long-context serving: KV offload, cache compression, and reuse across requests"
        sections:
          - heading: "The KV cache becomes a data plane"
            notes:
              - text: "For dense attention, KV storage and decode traffic grow linearly with context. GQA and MLA reduce the coefficient, not the state-management problem:"
                display: "KV bytes = 2 × layers × tokens × KV heads × head dimension × bytes/value × batch"
              - text: "Four levers are different: allocate blocks better, retain fewer positions, store fewer bits, or move and reuse state. Once KV survives a request or crosses workers, routing, admission, eviction, prefetch, serialization, and access control become first-class."
              - text: "Offload wins only if fetching is cheaper than recomputation and I/O is hidden. Strata shows why a naïve GPU–CPU–SSD ladder fails: fragmented transfers, loading stalls, and concurrent requests waiting for the same missing prefix can erase the hit."
              - text: "Exact reuse applies to identical causal prefixes. Retrieved chunks cannot simply be spliced because KV depends on preceding tokens and positions. Modular reuse requires an explicit recomputation or approximation story."
              - text: "Evaluate cache compression with workload quality, realized bytes, first-token latency, and output-token latency together. Needle retrieval and perplexity alone are easy places to hide a bad trade."
            papers:
              - { year: 2023, title: "H₂O: Heavy-Hitter Oracle for Efficient Generative Inference", note: "The influential recent-tokens-plus-heavy-hitters eviction policy.", grade: "A-", url: "https://arxiv.org/abs/2306.14048" }
              - { year: 2024, title: "KIVI", note: "Keys quantize naturally per channel while values favor per-token quantization.", grade: "A-", url: "https://arxiv.org/abs/2402.02750" }
              - { year: 2024, title: "CacheGen", note: "Treats KV as a compressed network stream rather than only GPU memory.", grade: "A-", url: "https://arxiv.org/abs/2310.07240" }
              - { year: 2024, title: "Mooncake", note: "Kimi’s production architecture makes disaggregated KV storage central to scheduling.", grade: "A", url: "https://arxiv.org/abs/2407.00079", featured: true, tags: ["★"] }
              - { year: 2025, title: "LMCache", note: "An open KV layer spanning requests, engines, GPU, CPU, storage, and network.", grade: "A-", url: "https://arxiv.org/abs/2510.09665" }
              - { year: 2026, title: "Strata", note: "The strongest current hierarchical-cache study and a production SGLang result.", grade: "A", url: "https://www.usenix.org/conference/osdi26/presentation/xie-zhiqiang", featured: true }

  - name: "LLM reasoning"
    intro: >
      Reasoning is not one capability. It is a family of ways to spend computation:
      write intermediate state into tokens, sample alternative trajectories, search
      prefixes, call an exact tool, or recur in latent space. The readings below follow
      that computation from the first scratchpad to the question that matters at the end:
      did the trace cause the answer, or did it merely explain the answer afterward?
    subtopics:
      - name: "Chain of thought — language as a scratchpad"
        sections:
          - heading: "What the extra tokens buy"
            notes:
              - text: "A direct answer asks a fixed-depth transformer to compress the whole computation into the hidden state that predicts its first answer token. Chain of thought feeds each intermediate result back through the model, adding both serial depth and an external working memory:"
                display: "p(z, y | x) = ∏ₜ p(zₜ | x, z<ₜ) · p(y | x, z)"
              - text: "This is the cleanest mental model for CoT: the model is allowed to leave state for its next forward pass. Scratchpads help long arithmetic and program execution for exactly this reason; no claim about an inner symbolic reasoner is required."
              - text: "CoT does not inject missing knowledge. It helps when the model knows the local moves but fails to compose them; it cannot rescue a false premise, an unseen algorithm, or an upstream perception error."
              - text: "The surprising empirical result is that valid demonstrations are not always essential. Incorrect rationales retain much of the gain when they preserve relevance and ordering, suggesting that format and decomposition often matter more than imitation of a proof."
            papers:
              - { year: 2021, title: "Show Your Work: Scratchpads for Intermediate Computation with Language Models", note: "The pre-CoT demonstration that emitted state gives transformers effective serial computation.", grade: "A-", url: "https://arxiv.org/abs/2112.00114" }
              - { year: 2022, title: "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models", note: "The foundational elicitation result.", grade: "A", url: "https://arxiv.org/abs/2201.11903", featured: true, tags: ["★"] }
              - { year: 2022, title: "Large Language Models are Zero-Shot Reasoners", note: "The minimal “think step by step” intervention.", grade: "B+", url: "https://arxiv.org/abs/2205.11916" }
              - { year: 2022, title: "Towards Understanding Chain-of-Thought Prompting: What Matters", note: "Incorrect demonstrations reveal what the prompt is actually supplying.", grade: "A-", url: "https://arxiv.org/abs/2212.10001", featured: true }

          - heading: "Decompose first; diversify second"
            notes:
              - text: "Decomposition is the robust part of the recipe. Least-to-most solves simpler subproblems before the original one; question decomposition isolates subanswers in separate contexts, making it harder for a final answer to bypass the advertised reasoning."
              - text: "Self-consistency treats the rationale as a latent variable rather than a canonical proof: sample multiple paths, then marginalize them by final answer."
                display: "ŷ = argmaxᵧ Σᵢ 1[answer(zᵢ) = y]"
              - text: "Voting works when independent paths converge on a unique answer. It is much weaker for open-ended tasks and shared systematic errors: ten copies of the same misconception are still a consensus."
              - text: "A practical progression is one trace → explicit subproblems → diverse traces → external selection. Each step adds machinery because the previous one cannot itself establish that a plausible path is correct."
            papers:
              - { year: 2022, title: "Least-to-Most Prompting Enables Complex Reasoning", note: "Solve primitives before asking for their composition.", grade: "A-", url: "https://arxiv.org/abs/2205.10625" }
              - { year: 2022, title: "Self-Consistency Improves Chain of Thought Reasoning", note: "Marginalize paths instead of trusting greedy decoding.", grade: "A", url: "https://arxiv.org/abs/2203.11171", featured: true }
              - { year: 2023, title: "Plan-and-Solve Prompting", note: "Separates construction of a plan from its execution.", grade: "B+", url: "https://arxiv.org/abs/2305.04091" }
              - { year: 2023, title: "Question Decomposition Improves the Faithfulness of Model-Generated Reasoning", note: "Decomposition can increase causal dependence on the stated steps.", grade: "A-", url: "https://arxiv.org/abs/2307.11768" }

      - name: "Test-time compute — sample, search, and verify"
        sections:
          - heading: "Three different ways to spend a budget"
            notes:
              - text: "“More test-time compute” hides three algorithms: extend one trajectory, sample more completed leaves, or search over unfinished prefixes. They have different failure modes and should not be compared as one scalar token budget."
                display: "sequential depth  |  N completed leaves  |  prefix-tree search"
              - text: "Repeated sampling increases coverage approximately as 1 − (1 − p)ᴺ under an independence assumption. Large Language Monkeys shows that coverage keeps rising long after practical selectors stop converting it into delivered accuracy."
              - text: "Allocation should depend on difficulty. Snell et al. report more than a 4× efficiency gain from adaptive allocation and regimes where a smaller model with inference compute beats a 14× larger model. The condition matters: the small model must already have a nontrivial chance of finding a solution."
              - text: "Longer is not monotonically better. Budget forcing can prompt reconsideration, but overthinking can also abandon a correct answer. The missing mechanism is a learned stopping rule, not an indefinitely larger token limit."
            image: "/assets/img/reading_list/reasoning_compute.svg"
            image_width: 860
            image_alt: "Three test-time compute strategies: one long path, many complete samples with a selector, and prefix-tree search with a verifier."
            image_caption: "A token budget becomes useful reasoning compute only when it buys depth, diversity, or a better verified decision."
            papers:
              - { year: 2024, title: "Scaling LLM Test-Time Compute Optimally can be More Effective than Scaling Model Parameters", note: "Difficulty-aware allocation is the central result.", grade: "A", url: "https://arxiv.org/abs/2408.03314", featured: true, tags: ["★"] }
              - { year: 2024, title: "Large Language Monkeys", note: "Solution coverage scales much farther than selection accuracy.", grade: "A-", url: "https://arxiv.org/abs/2407.21787" }
              - { year: 2024, title: "Learning to Reason with LLMs", note: "Primary evidence that performance scales with train- and test-time compute; methodological detail is limited.", grade: "B+", url: "https://openai.com/index/learning-to-reason-with-llms/" }
              - { year: 2025, title: "s1: Simple Test-Time Scaling", note: "Budget forcing as a deliberately minimal replication.", grade: "B+", url: "https://arxiv.org/abs/2501.19393" }
              - { year: 2026, title: "When More Thinking Hurts", note: "Recent evidence for diminishing and sometimes negative marginal returns.", grade: "B", url: "https://arxiv.org/abs/2604.10739" }

          - heading: "The selector is the bottleneck"
            notes:
              - text: "Pass@N asks whether any candidate is correct. A deployed system must identify that candidate without seeing the answer. The gap is the verifier problem:"
                display: "delivered accuracy ≈ coverage(N) × selector recall"
              - text: "An outcome verifier ranks completed solutions. A process verifier scores prefixes, allowing search to prune an error before paying for the rest of its trajectory. Process supervision and tree search therefore belong in the same story."
              - text: "Tree of Thoughts shows the upside when intermediate states are easy to score. Its Game-of-24 result should not be generalized blindly: on open-ended tasks, self-evaluation may be less reliable than generation."
              - text: "Under fixed budgets, generating more candidates can beat spending heavily on generative verification. Search earns its cost only when the verifier is genuinely better at judging a partial state than the policy is at continuing it."
            papers:
              - { year: 2021, title: "Training Verifiers to Solve Math Word Problems", note: "Generate many, then rank; also introduced GSM8K.", grade: "A-", url: "https://arxiv.org/abs/2110.14168" }
              - { year: 2023, title: "Let’s Verify Step by Step", note: "Process supervision and PRM800K.", grade: "A", url: "https://arxiv.org/abs/2305.20050", featured: true, tags: ["★"] }
              - { year: 2023, title: "Tree of Thoughts", note: "Prefix-level branching, evaluation, and backtracking.", grade: "A-", url: "https://arxiv.org/abs/2305.10601" }
              - { year: 2025, title: "When To Solve, When To Verify", note: "The fixed-budget trade between candidate generation and verification.", grade: "B+", url: "https://arxiv.org/abs/2504.01005" }
              - { year: 2025, title: "rStar-Math", note: "MCTS, a process preference model, and iterative self-evolution in one system.", grade: "A-", url: "https://arxiv.org/abs/2501.04519" }

      - name: "Executable reasoning — code, tools, and environments"
        sections:
          - heading: "Put the brittle step in a runtime"
            notes:
              - text: "Language models are often better at translating a problem into operations than at executing those operations exactly. PAL and Program of Thoughts exploit the asymmetry: let the model write the computation and let an interpreter perform it."
                display: "problem → executable plan → runtime trace → checked result"
              - text: "Execution changes the status of a rationale. The answer is causally downstream of a visible program, so arithmetic and state transitions can be replayed. That is a stronger guarantee than fluent prose."
              - text: "It is not a proof of semantic correctness. A perfectly executed program can encode the wrong equation, query the wrong field, or call the right tool on the wrong object."
              - text: "ReAct generalizes one program into an interactive loop. Fresh observations break a self-contained hallucination cycle, but introduce planning, tool-selection, argument-generation, and recovery failures."
            papers:
              - { year: 2022, title: "PAL: Program-Aided Language Models", note: "Natural-language decomposition with exact execution.", grade: "A", url: "https://arxiv.org/abs/2211.10435", featured: true, tags: ["★"] }
              - { year: 2022, title: "Program of Thoughts Prompting", note: "Explicitly separates reasoning from computation.", grade: "A-", url: "https://arxiv.org/abs/2211.12588" }
              - { year: 2023, title: "Faithful Chain-of-Thought Reasoning", note: "Symbolic translation followed by a deterministic solver.", grade: "A-", url: "https://arxiv.org/abs/2301.13379" }
              - { year: 2022, title: "ReAct", note: "Interleaves reasoning, action, and fresh evidence.", grade: "A", url: "https://arxiv.org/abs/2210.03629", featured: true }
              - { year: 2023, title: "Toolformer", note: "Self-supervised learning of when and how to invoke APIs.", grade: "B+", url: "https://arxiv.org/abs/2302.04761" }

      - name: "Learning the trace — bootstrapping and distillation"
        sections:
          - heading: "From demonstrations to self-improvement loops"
            notes:
              - text: "Final-answer supervision says where a trajectory ended. Rationale supervision exposes a dense token-level path, but also copies every stylistic habit and hidden error of its teacher."
              - text: "STaR provides the basic loop: sample rationales, keep those that reach a correct answer, fine-tune, and repeat. Its weakness is equally important—outcome filtering can retain a logically broken trace that arrived at the answer by accident."
                display: "sample → verify outcome or process → retain or score → train → repeat"
              - text: "ReST-MCTS and rStar-Math use process-guided search to improve traces before distillation. The verifier supplies denser information, but the loop can now amplify verifier blind spots instead of policy blind spots."
              - text: "The modern recipe composes stages: cold-start traces teach a readable protocol; search or RL discovers trajectories; distillation moves them back into the policy. The adjacent RL chapter carries the GRPO and RLVR half of this story."
            papers:
              - { year: 2022, title: "STaR: Bootstrapping Reasoning With Reasoning", note: "The canonical self-generated-rationale loop.", grade: "A", url: "https://arxiv.org/abs/2203.14465", featured: true, tags: ["★"] }
              - { year: 2023, title: "Distilling Step-by-Step", note: "Rationales as data-efficient supervision for smaller models.", grade: "A-", url: "https://arxiv.org/abs/2305.02301" }
              - { year: 2024, title: "Quiet-STaR", note: "Extends self-taught rationales from QA to arbitrary next-token prediction.", grade: "A-", url: "https://arxiv.org/abs/2403.09629" }
              - { year: 2024, title: "ReST-MCTS*: Self-Training via Process Reward Guided Tree Search", note: "Search produces both traces and per-step value targets.", grade: "A-", url: "https://arxiv.org/abs/2406.03816" }
              - { year: 2025, title: "rStar-Math", note: "The full search–verifier–distillation flywheel.", grade: "A-", url: "https://arxiv.org/abs/2501.04519" }

      - name: "Latent reasoning — thought need not be English"
        sections:
          - heading: "Language is an interface, not necessarily the substrate"
            notes:
              - text: "Verbal CoT asks one representation to carry computation, communicate with the user, and remain easy to score. English is discrete, redundant, and autoregressively expensive; there is no theorem that it is the best internal state."
              - text: "Pause tokens isolate the compute hypothesis by adding serial states without meaningful words. They help only when the model is trained to use them, which argues against treating arbitrary filler as free reasoning."
              - text: "Coconut feeds a hidden state back as the next input embedding; recurrent-depth models repeat a transformer block. Both spend computation without serializing every intermediate through the vocabulary:"
                display: "verbal: h → token → embedding → h′     latent: h → h′"
              - text: "The evidence remains proof-of-concept. A plausible hybrid uses latent computation for routine spans and explicit checkpoints at uncertainty or tool boundaries, preserving some auditability without verbalizing every transition."
            papers:
              - { year: 2023, title: "Think Before You Speak: Training Language Models With Pause Tokens", note: "Extra serial compute without semantic scratchpad text.", grade: "A-", url: "https://arxiv.org/abs/2310.02226" }
              - { year: 2024, title: "Training LLMs to Reason in a Continuous Latent Space (Coconut)", note: "Hidden states recursively become continuous thoughts.", grade: "A", url: "https://arxiv.org/abs/2412.06769", featured: true, tags: ["★"] }
              - { year: 2025, title: "Scaling Test-Time Compute with Latent Reasoning: A Recurrent Depth Approach", note: "Scale inference compute by depth rather than output length.", grade: "A-", url: "https://arxiv.org/abs/2502.05171" }
              - { year: 2025, title: "CODI", note: "Self-distills explicit chain of thought into continuous space.", grade: "B+", url: "https://arxiv.org/abs/2502.21074" }
              - { year: 2026, title: "Selective Latent Thinking", note: "A recent hybrid preserving precision-critical explicit spans; promising, not settled.", grade: "B", url: "https://arxiv.org/abs/2605.25745" }

      - name: "Faithfulness and evaluation"
        sections:
          - heading: "A useful scratchpad is not necessarily an honest explanation"
            notes:
              - text: "Two claims are routinely collapsed: the trace improves the answer, and the trace reports why the model chose it. The first is well established. The second fails whenever decision-critical information flows directly from prompt to answer while the trace supplies a plausible story afterward."
                display: "faithful: x → z → y          shortcut: x ─────────→ y"
              - text: "Hint experiments make the failure causal. Models change answers after biased hints yet frequently omit the hints from their stated reasoning. Longer and more polished traces do not solve this."
              - text: "Faithfulness should be tested with interventions: corrupt, truncate, paraphrase, or mask the trace and observe the answer. Necessity, sufficiency, and completeness are stronger evidence than whether a human finds prose convincing."
              - text: "CoT remains useful as an alarm surface, not a proof of safety. Recent monitorability studies find real signal and persistent blind spots; extrapolations to future systems should remain explicitly uncertain."
            papers:
              - { year: 2023, title: "Language Models Don’t Always Say What They Think", note: "Biasing features produce unacknowledged rationalizations.", grade: "A", url: "https://arxiv.org/abs/2305.04388", featured: true, tags: ["★"] }
              - { year: 2023, title: "Measuring Faithfulness in Chain-of-Thought Reasoning", note: "Intervention-based faithfulness across tasks and scales.", grade: "A", url: "https://arxiv.org/abs/2307.13702", featured: true }
              - { year: 2025, title: "Reasoning Models Don’t Always Say What They Think", note: "Modern reasoning models still rarely disclose decision-changing hints.", grade: "A-", url: "https://arxiv.org/abs/2505.05410" }
              - { year: 2025, title: "Evaluating Chain-of-Thought Monitorability", note: "Monitorability across test-time compute, RL, and pretraining scale.", grade: "A-", url: "https://openai.com/index/evaluating-chain-of-thought-monitorability/" }
              - { year: 2026, title: "Faithfulness as Information Flow", note: "Structural metrics and interventions that route information through the trace.", grade: "B+", url: "https://arxiv.org/abs/2605.24286" }

          - heading: "Test generalization, not benchmark familiarity"
            notes:
              - text: "A benchmark score measures an inference system: weights, prompt, sampler, token budget, tools, verifier, and stopping rule. Reporting “model accuracy” without that protocol is increasingly meaningless."
              - text: "Static tests confound reasoning with memorized questions and familiar procedures. Counterfactual rules and GSM-Symbolic preserve the operation while changing values, phrasing, or irrelevant clauses; the resulting drops show that reasoning and recitation coexist."
              - text: "Live evaluation reduces contamination, while ARC-like tasks test adaptation to rules demonstrated only inside the problem. Neither is sufficient alone: fresh expert questions can still reward knowledge, and abstract puzzles underrepresent real work."
              - text: "A useful report includes pass@1, coverage or pass@k, selector accuracy, tokens or FLOPs, robustness under meaning-preserving transformations, and calibration. Exact-match accuracy is the first coordinate, not the conclusion."
            papers:
              - { year: 2023, title: "Reasoning or Reciting?", note: "Counterfactual task rules separate transferable procedures from learned defaults.", grade: "A-", url: "https://arxiv.org/abs/2307.02477" }
              - { year: 2024, title: "GSM-Symbolic", note: "Controlled variants reveal numerical and irrelevant-clause fragility.", grade: "A-", url: "https://arxiv.org/abs/2410.05229" }
              - { year: 2024, title: "LiveBench", note: "Frequently refreshed, objective, contamination-resistant evaluation.", grade: "A-", url: "https://arxiv.org/abs/2406.19314" }
              - { year: 2025, title: "MathArena", note: "Evaluates competitions immediately and includes proof writing.", grade: "A", url: "https://arxiv.org/abs/2505.23281", featured: true }
              - { year: 2026, title: "ARC Prize 2025 Technical Report", note: "Few-shot abstraction, refinement loops, and the limits of knowledge coverage.", grade: "A-", url: "https://arxiv.org/abs/2601.10904" }

  - name: "Reinforcement learning"
    subtopics:
      - name: "Algorithms — policy optimization for LLMs"
        sections:
          - heading: "Overview"
            notes:
              - text: "Post-training an LLM with RL is a narrow instance of the general problem. The environment is degenerate — a prompt arrives, the policy emits one trajectory of tokens, the episode ends — and the reward is usually a single scalar at the last token. What makes it hard is not exploration but credit assignment over thousands of tokens, and stability at a scale where a diverged run costs a cluster-week."
              - text: "Every algorithm below is a different answer to the same three questions: how to estimate the advantage of a trajectory, how far the policy may move in one update, and what to do about the fact that the samples were drawn by a slightly different policy than the one being updated."
                display: "advantage estimate + trust region + off-policy correction = an RL algorithm for LLMs"
              - text: "This chapter follows the taxonomy of Lorenzo Xiao's RL reading list, regrouped so that the algorithmic, reward, preference, systems, and agent literatures each read as one thread."

          - heading: "Core RL: PPO → GRPO → DAPO → CISPO"
            notes:
              - text: "PPO is the starting point, and its two ideas outlive it: clip the importance ratio so a single batch cannot move the policy arbitrarily far, and subtract a learned baseline so the gradient sees advantage rather than raw return. InstructGPT wires that into the alignment loop — fit a reward model to human preferences, optimise against it with PPO, and penalise KL drift from the SFT policy so the reward model is never queried far from its training distribution."
              - text: "The value network is the first casualty. It doubles memory, it is hard to fit against a sparse terminal reward, and for a fixed prompt one can simply sample a group of completions and use the group's own statistics as the baseline. That is GRPO:"
                display: "A_i = (r_i − mean(r_1..r_G)) / std(r_1..r_G)   — a baseline from the group, not from a critic"
              - text: "DeepSeek-R1 then showed the payoff: run GRPO on verifiable maths and code with a rule-based reward, and long chain-of-thought emerges without any process supervision. Everything after that is repair work on GRPO's details. Dr. GRPO removes the length bias and the standard-deviation normalisation that quietly reweight the objective; DAPO supplies the token-level loss, dynamic sampling and clip-higher tricks that make the recipe reproducible at scale; GSPO moves the importance ratio from tokens to whole sequences."
              - text: "The most instructive edit is CISPO, in MiniMax-M1. PPO's clip discards the gradient of any token whose ratio strays outside the trust region — and those are exactly the rare, high-entropy tokens (“wait”, “however”, “let me reconsider”) that pivot a reasoning trace. CISPO clips the importance weight but keeps the token in the sum, so the trust region bounds the update's magnitude without deleting its most informative terms."
              - text: "The 2026 papers reopen the objective itself. MaxRL optimises pass@k rather than mean reward, placing RL and maximum-likelihood on one continuum; DPPO replaces the ratio clip with an explicit total-variation / KL trust region, which is what PPO was approximating all along."
            papers:
              - { year: 2017, title: "PPO", note: "Ratio clipping and a trust region; the substrate everything else edits.", grade: "B", url: "https://arxiv.org/abs/1707.06347" }
              - { year: 2022, title: "InstructGPT", note: "Reward model + PPO + KL penalty. The template for RLHF.", grade: "A-", url: "https://arxiv.org/abs/2203.02155" }
              - { year: 2024, title: "Revisiting REINFORCE (RLOO)", note: "Leave-one-out baselines make the critic look optional.", grade: "B", url: "https://arxiv.org/abs/2402.14740" }
              - { year: 2024, title: "DeepSeekMath (GRPO origin)", note: "Group-relative advantage, no value network. Start the story here.", grade: "A", url: "https://arxiv.org/abs/2402.03300", featured: true, tags: ["★"] }
              - { year: 2025, title: "DeepSeek-R1", note: "Rule-based reward on verifiable tasks; long CoT emerges from RL alone.", grade: "A", url: "https://arxiv.org/abs/2501.12948", featured: true, tags: ["★"] }
              - { year: 2025, title: "DAPO", note: "An open, reproducible GRPO recipe: token-level loss, dynamic sampling, clip-higher.", grade: "A-", url: "https://arxiv.org/abs/2503.14476" }
              - { year: 2025, title: "Dr. GRPO", note: "Fixes GRPO's length bias and std normalisation — a two-line diff with a real effect.", grade: "A-", url: "https://openreview.net/forum?id=5PAF7PAY2Y" }
              - { year: 2025, title: "GSPO", note: "Importance ratio at the sequence level rather than the token level.", grade: "B+", url: "https://arxiv.org/abs/2507.18071" }
              - { year: 2025, title: "MiniMax-M1 (CISPO)", note: "Clips the weight, keeps the token: high-entropy pivot tokens survive the update.", grade: "A-", url: "https://arxiv.org/abs/2506.13585", featured: true }
              - { year: 2025, title: "PPO Collapse in Long-CoT", note: "Why value-based PPO destabilises as traces get long.", grade: "B+", url: "https://arxiv.org/abs/2503.01491" }
              - { year: 2025, title: "SAPO", note: "Another point in the clipping-variant space.", grade: "C", url: "https://arxiv.org/abs/2511.20347" }
              - { year: 2026, title: "MaxRL", note: "A pass@k objective; places RL and MLE on one continuum.", grade: "B+", url: "https://arxiv.org/abs/2602.02710" }
              - { year: 2026, title: "DPPO", note: "An explicit TV/KL trust region instead of the ratio clip.", grade: "B+", url: "https://arxiv.org/abs/2602.04879" }

          - heading: "Scaling laws and recipes"
            notes:
              - text: "Pre-training has a scaling law; RL post-training is only now getting one. The question is which axis buys performance — model size, prompt count, rollouts per prompt, or gradient steps — and whether the curve saturates."
              - text: "ProRL and BroRL split the two rollout-side axes cleanly. ProRL scales the number of training steps and argues that RL keeps discovering genuinely new reasoning strategies long past the point where the reward curve looks flat; BroRL scales the number of rollouts per prompt instead, sharpening the advantage estimate rather than taking more of them. ScaleRL then fits the whole thing: a sigmoidal compute–performance curve whose ceiling and rate are set by different design choices, so a recipe can be extrapolated from small runs before the large one is launched."
              - text: "Qwen3 is the applied counterpart — one model with a thinking and a non-thinking mode, and a thinking budget the user can dial — and is the clearest published account of how the stages compose in a production run."
            papers:
              - { year: 2025, title: "ScaleRL — The Art of Scaling RL Compute", note: "Sigmoidal compute curves; predict the large run from small ones.", grade: "A-", url: "https://arxiv.org/abs/2510.13786", featured: true }
              - { year: 2025, title: "Scaling Behaviors of LLM RL Post-Training", note: "Power law across model scale × data × compute.", grade: "B+", url: "https://arxiv.org/abs/2509.25300" }
              - { year: 2025, title: "ProRL", note: "Prolonged RL: the steps axis. Read before ScaleRL.", grade: "A-", url: "https://arxiv.org/abs/2505.24864" }
              - { year: 2025, title: "BroRL", note: "The rollouts axis; complements ProRL.", grade: "B+", url: "https://arxiv.org/abs/2510.01180" }
              - { year: 2025, title: "Qwen3 Technical Report", note: "Unified thinking / non-thinking model with a thinking budget.", grade: "A-", url: "https://arxiv.org/abs/2505.09388" }

          - heading: "Cascade and stage-wise RL"
            notes:
              - text: "A single RL stage over a mixture of domains is not what frontier labs actually run. The Nemotron line stages it: SFT, then RL on maths, then code, then tool use, each stage inheriting the previous policy — and the surprise is that later stages do not erase earlier ones as catastrophically as forgetting would predict, provided the stage order and the data mixture are chosen with care."
              - text: "Nemotron-Cascade 2 is the payoff — gold-medal performance at IMO, IOI and ICPC from a 30B mixture-of-experts model — and it gets there with on-policy distillation inside the cascade rather than a bigger final RL run."
            papers:
              - { year: 2025, title: "AceReason-Nemotron 1.1", note: "SFT and RL synergy for maths and code reasoning.", grade: "B+", url: "https://arxiv.org/abs/2505.16400" }
              - { year: 2025, title: "Nemotron-Cascade 1", note: "The motivation for staged RL; read as the setup for Cascade 2.", grade: "B+", url: "https://arxiv.org/abs/2512.13607" }
              - { year: 2026, title: "Nemotron-Cascade 2", note: "IMO/IOI/ICPC gold; 30B MoE; on-policy distillation inside the cascade.", grade: "A", url: "https://arxiv.org/abs/2603.19220", featured: true }
              - { year: 2026, title: "Nemotron 3 Super Technical Report", note: "LatentMoE, NVFP4, and simultaneous multi-environment RL.", grade: "A-", url: "https://research.nvidia.com/labs/nemotron/files/NVIDIA-Nemotron-3-Super-Technical-Report.pdf" }

          - heading: "Distillation: on-policy, self, and context"
            notes:
              - text: "RL is sample-inefficient because a scalar reward per trajectory is a thin gradient signal. Distillation is dense — every token carries a full teacher distribution — but off-policy SFT on teacher traces trains the student on states it will never visit. On-policy distillation takes both: the student samples the trajectory, the teacher scores it token by token."
                display: "student samples the states; teacher supplies per-token targets → dense reward, on-policy states"
              - text: "The Thinking Machines post is the clearest statement of the compute trade-off, and MiMo-V2-Flash is the production form with multiple teachers — the technique underneath Nemotron-Cascade 2. Two 2026 variants push on what the teacher is: in Self-Distilled Reasoner the teacher is the same model granted privileged information the student will not have at test time, and On-Policy Context Distillation compresses a long prompt into weights the same way."
            papers:
              - { year: 2025, title: "On-Policy Distillation (Thinking Machines)", note: "The clearest account of the dense-signal / on-policy-state trade-off.", grade: "A", url: "https://thinkingmachines.ai/blog/on-policy-distillation/", featured: true }
              - { year: 2026, title: "MiMo-V2-Flash", note: "Multi-teacher on-policy distillation at production scale.", grade: "A-", url: "https://arxiv.org/abs/2601.02780" }
              - { year: 2026, title: "Self-Distilled Reasoner", note: "The teacher is the student, plus privileged information.", grade: "B+", url: "https://arxiv.org/abs/2601.18734" }
              - { year: 2026, title: "On-Policy Context Distillation", note: "Folds a long context into the weights, on-policy.", grade: "B", url: "https://arxiv.org/abs/2602.12275" }

      - name: "Reward modeling"
        sections:
          - heading: "Why the reward is the hard part"
            notes:
              - text: "On maths and code the reward is free: run the tests, check the answer. Everywhere else it has to be learned, and a learned reward is an adversary the policy will eventually defeat. Every design below is a bet about which representation of “good” is hardest to hack."
              - text: "The axis that organises this literature is where the reward is emitted and what it is made of — a scalar head or a token, the final answer or every step, an opaque preference or an explicit rubric."
                display: "scalar head → generative judge → per-step verifier → explicit rubric"

          - heading: "Generative reward models"
            notes:
              - text: "A classical reward model bolts a scalar head onto a transformer and throws away the language modelling head. Generative Verifiers makes the observation that this discards the model's own competence: instead, ask “is this response correct? yes/no” and read the probability of the yes token. Scoring becomes next-token prediction, so it inherits chain-of-thought and majority voting for free."
              - text: "DeepSeek-GRM pushes further with SPCT, training the judge itself with online RL so that it learns to generate principles before critiquing; RM-R1 makes the reasoning explicit — reason first, score second. HelpSteer3-Preference is the data-side contribution, and P-GenRM conditions the judge on a persona, which is where reward modelling meets personalisation."
            papers:
              - { year: 2024, title: "Generative Verifiers: RM as Next-Token Prediction", note: "The origin of the generative RM; yes-token probability plus majority vote.", grade: "A", url: "https://arxiv.org/abs/2408.15240", featured: true }
              - { year: 2025, title: "DeepSeek-GRM / SPCT", note: "Online RL for the judge; generates principles, then critiques.", grade: "A-", url: "https://arxiv.org/abs/2504.02495" }
              - { year: 2025, title: "RM-R1: Reward Modeling as Reasoning", note: "Reason first, then score.", grade: "B+", url: "https://arxiv.org/abs/2505.02387" }
              - { year: 2025, title: "HelpSteer3-Preference", note: "40k preference samples; the data behind an RM-Bench SOTA.", grade: "B+", url: "https://arxiv.org/abs/2505.11475" }
              - { year: 2026, title: "P-GenRM", note: "A personalised generative reward model.", grade: "B", url: "https://arxiv.org/abs/2602.12116" }

          - heading: "Process reward models"
            notes:
              - text: "An outcome reward tells a 400-step derivation that it was wrong, without saying where. A process reward model scores each step, which is a far denser signal — and the question is what a step's score should mean."
              - text: "Rewarding Progress gives the answer that makes the rest coherent: a process reward should be an advantage, the change in the probability of eventually succeeding contributed by that step. Not “is this step correct” but “did this step help”."
                display: "PRM(s_t) ≈ A(s_t) = V(s_t) − V(s_{t−1})   — progress, not correctness"
              - text: "The practical papers then ask how to obtain those labels without humans. Monte-Carlo rollouts from each prefix estimate the value directly; ThinkPRM turns the verifier into a long-CoT reasoner; GenPRM adds test-time generative reasoning to the score; ReasonFlux-PRM supervises step and trajectory jointly. The Qwen lessons paper is the one to read before building any of them — it is largely a catalogue of what silently fails."
            papers:
              - { year: 2024, title: "PAV / Rewarding Progress", note: "Process reward = advantage. The conceptual anchor.", grade: "A", url: "https://openreview.net/forum?id=A6Y7AqlzLW", featured: true }
              - { year: 2025, title: "Lessons of Developing PRMs", note: "What actually works: annotation, stability, evaluation traps.", grade: "A-", url: "https://arxiv.org/abs/2501.07301" }
              - { year: 2025, title: "ThinkPRM", note: "A long chain-of-thought verifier.", grade: "B+", url: "https://arxiv.org/abs/2504.00125" }
              - { year: 2025, title: "GenPRM", note: "Test-time generative reasoning inside the PRM.", grade: "B", url: "https://arxiv.org/abs/2504.15221" }
              - { year: 2025, title: "ReasonFlux-PRM", note: "Trajectory-aware dual supervision over steps and traces.", grade: "B+", url: "https://arxiv.org/abs/2506.18896" }
              - { year: 2025, title: "R-PRM", note: "Reasoning-driven process supervision.", grade: "C", url: "https://arxiv.org/abs/2503.06266" }
              - { year: 2026, title: "PRISM", note: "A recent process-supervision variant.", grade: "C", url: "https://arxiv.org/abs/2603.02479" }

          - heading: "Rubrics as rewards"
            notes:
              - text: "Preference data compresses a whole judgement into one bit, and that bit is where reward hacking hides. A rubric decomposes it: instead of “A is better than B”, a checklist of criteria, each independently checkable. The reward becomes a weighted sum of satisfied criteria, and it is legible — one can read why a response scored what it scored."
              - text: "Rubrics as Rewards establishes the format on subjective tasks; OpenRubrics scales rubric generation. The 2026 papers close the loop: Rubric-ARM alternates between improving the rubric generator and the judge, and Golden Goose uses rubrics as the bridge that turns a non-verifiable domain into a verifiable one — which is precisely the move that lets RLVR escape maths and code."
            papers:
              - { year: 2025, title: "Rubrics as Rewards (RaR)", note: "Structures subjective preference into checkable criteria.", grade: "A-", url: "https://arxiv.org/abs/2503.11042", featured: true }
              - { year: 2025, title: "OpenRubrics", note: "Scaling rubric generation.", grade: "B", url: "https://arxiv.org/abs/2504.00831" }
              - { year: 2026, title: "Rubric-ARM", note: "Alternating optimisation of the rubric generator and the judge.", grade: "B+", url: "https://arxiv.org/abs/2602.01454" }
              - { year: 2026, title: "Golden Goose", note: "The non-verifiable → verifiable bridge; the load-bearing idea for RLVR beyond maths.", grade: "A-", url: "https://arxiv.org/abs/2601.22975" }

          - heading: "Evaluating reward models"
            notes:
              - text: "A reward model that ranks a static preference set well can still be useless as an RL objective, because RL drives the policy off that distribution on purpose. The PPE paper measures that offline–online gap directly, by correlating benchmark accuracy against the downstream quality of the policy it trains — the correlation is weaker than the field assumed."
              - text: "RewardBench 2 is built around the failure mode rather than around agreement: it asks whether a reward model can be hacked. Long-form RewardBench extends the question to responses long enough that a single scalar has to summarise pages."
            papers:
              - { year: 2024, title: "How to Evaluate Reward Models for RLHF (PPE)", note: "The offline–online gap: benchmark rank ≠ downstream policy quality.", grade: "A-", url: "https://arxiv.org/abs/2410.14872", featured: true }
              - { year: 2024, title: "HelpSteer3", note: "Feedback and edit data; inference-time scaling of the RM.", grade: "B+", url: "https://arxiv.org/abs/2503.04378" }
              - { year: 2025, title: "RewardBench 2", note: "Built around reward hacking rather than agreement.", grade: "B+", url: "https://arxiv.org/abs/2506.01937" }
              - { year: 2026, title: "Long-form RewardBench", note: "Reward modelling when the response is pages long.", grade: "B", url: "https://arxiv.org/abs/2603.12963" }

      - name: "RLHF and preference optimization"
        sections:
          - heading: "Foundations"
            notes:
              - text: "The RLHF pipeline as it was frozen in 2022: supervised fine-tuning, a Bradley–Terry reward model on human preference pairs, then PPO against that reward with a KL penalty. Bai et al. add the safety half — helpfulness and harmlessness as competing objectives, and the HH-RLHF dataset that everyone trained on afterwards."
              - text: "DPO's insight is that the RLHF optimum has a closed form: the optimal policy is the reference policy reweighted by the exponentiated reward, so the reward can be written in terms of the policy and eliminated. The reward model, the rollouts and the RL loop all disappear into a classification loss on preference pairs."
                display: "r(x,y) = β·log[ π(y|x) / π_ref(y|x) ] + logZ(x)   — the reward was never a separate object"
              - text: "Read DPO knowing how it eventually fell short. The derivation is exact, but it is exact for the offline distribution the preference pairs were drawn from; the reward model it implicitly defines is never queried at the states the trained policy visits."
            papers:
              - { year: 2022, title: "InstructGPT", note: "The canonical three-stage pipeline.", grade: "A-", url: "https://arxiv.org/abs/2203.02155" }
              - { year: 2022, title: "Bai et al. — HH-RLHF", note: "Helpfulness vs harmlessness, and the dataset that defined the era.", grade: "B+", url: "https://arxiv.org/abs/2204.05862" }
              - { year: 2023, title: "DPO", note: "Preference optimisation with no reward model and no rollouts. Know why it fell short.", grade: "A", url: "https://arxiv.org/abs/2305.18290", featured: true, tags: ["★"] }

          - heading: "From simplification back to online RL"
            notes:
              - text: "The two years after DPO run in one direction and then reverse. First simplification: SimPO drops the reference model entirely and length-normalises the implicit reward, which is roughly the endpoint of how much can be removed."
              - text: "Then the reversal. Online Iterative RLHF is the turning point — regenerate the preference pairs from the current policy each round, and the gap to offline DPO is large enough that the field concedes the point: what mattered was never the RL algorithm, it was that the data is on-policy. Asynchronous RLHF makes the resulting generation cost tolerable by decoupling rollout from training, and OLMo 3 is the fully open reproduction of the whole SFT → DPO → RL sequence, checkpoints and data included."
            papers:
              - { year: 2024, title: "SimPO", note: "Reference-free, length-normalised DPO. The simplification endpoint.", grade: "B+", url: "https://arxiv.org/abs/2405.14734" }
              - { year: 2024, title: "Online Iterative RLHF", note: "The turning point: on-policy preference data ≫ offline DPO.", grade: "A-", url: "https://arxiv.org/abs/2405.07863", featured: true }
              - { year: 2025, title: "Asynchronous RLHF", note: "Decouples generation from training to pay for going online.", grade: "B+", url: "https://openreview.net/forum?id=FhTAG591Ve" }
              - { year: 2025, title: "OLMo 3", note: "SFT → DPO → RL → RL-Zero, fully open: data, code, checkpoints.", grade: "A-", url: "https://arxiv.org/abs/2512.13961" }

          - heading: "Multi-turn, social, and creative RLHF"
            notes:
              - text: "Verifiable rewards ended at the boundary of maths and code, and this is the literature trying to cross it. A conversation has no unit test; a good short story has no answer key; a role-play persona is judged by consistency with a character rather than by correctness."
              - text: "The shared move is to decompose the reward into a part that can be verified and a part that must be judged. RLMR is the cleanest example — an objective constraint verifier for the instructions (“exactly four stanzas, no adverbs”) plus a subjective aesthetic reward model for everything else — and PPP does the same for agents, scoring task success, proactivity and personalisation as three separate objectives against the UserVille benchmark. RL from User Conversations conditions the reward on a persona so that “good” is defined per user, and HER, OMAR and Social-R1 carry the idea into role-play and social reasoning."
            papers:
              - { year: 2025, title: "RLMR: Mixed Rewards for Creative Writing", note: "Objective constraint verifier + subjective aesthetic RM.", grade: "A-", url: "https://arxiv.org/abs/2508.18642", featured: true }
              - { year: 2025, title: "PPP: Proactive and Personalized Agents", note: "Three-objective RL; the UserVille benchmark.", grade: "B+", url: "https://arxiv.org/abs/2511.02208" }
              - { year: 2025, title: "RL from User Conversations", note: "Persona-conditioned rewards learned from real dialogue.", grade: "B+", url: "https://arxiv.org/abs/2509.25137" }
              - { year: 2026, title: "HER: RL for Role-playing", note: "Dual-layer thinking for in-character reasoning.", grade: "B", url: "https://arxiv.org/abs/2601.21459" }
              - { year: 2026, title: "OMAR — One Model All Roles", note: "One policy across many personas.", grade: "C", url: "https://arxiv.org/abs/2602.03109" }
              - { year: 2026, title: "Social-R1", note: "RL for social reasoning.", grade: "C", url: "https://arxiv.org/abs/2603.09249" }

      - name: "Systems — making RL runs survive"
        sections:
          - heading: "Synchronous versus asynchronous training"
            notes:
              - text: "An RL step is two workloads with opposite hardware profiles: generation is memory-bandwidth bound and wildly variable in length, training is compute bound and uniform. Running them in lockstep means every GPU waits for the longest rollout in the batch, and with long chain-of-thought that tail is brutal."
                display: "sync: idle GPUs waiting on the longest trajectory   |   async: stale gradients from an older policy"
              - text: "Asynchrony buys the utilisation back and pays for it in staleness — the trajectories were generated by a policy some steps behind the one being updated, which is off-policy data that PPO's importance ratio was only ever meant to correct for locally. AReaL and slime are the systems that make the trade concrete; A-3PO decouples PPO explicitly; StaleFlow and GAC are the 2026 attempts to bound the staleness rather than tolerate it. Magistral is worth reading as the counterpoint: a synchronous run, done carefully, at scale."
            papers:
              - { year: 2025, title: "AReaL", note: "A fully asynchronous RL system for reasoning models.", grade: "A-", url: "https://arxiv.org/abs/2505.24298" }
              - { year: 2025, title: "slime (SGLang RL)", note: "The engineering of a rollout–training split, written up plainly.", grade: "B+", url: "https://lmsys.org/blog/2025-07-09-slime/" }
              - { year: 2025, title: "Magistral", note: "Mistral's reasoning RL stack; the synchronous counterpoint.", grade: "B+", url: "https://arxiv.org/abs/2506.10910" }
              - { year: 2025, title: "A-3PO", note: "Decoupled PPO — staleness as an explicit design dimension.", grade: "B", url: "https://arxiv.org/abs/2512.06547" }
              - { year: 2026, title: "StaleFlow", note: "Bounding staleness rather than tolerating it.", grade: "B", url: "https://arxiv.org/abs/2601.12784" }
              - { year: 2026, title: "GAC", note: "A recent asynchronous-RL system paper.", grade: "C", url: "https://arxiv.org/abs/2603.01501" }

          - heading: "Train–inference mismatch and RL stability"
            notes:
              - text: "This is the subtopic that surprises people. The rollout is produced by an inference engine (vLLM, SGLang) and the gradient is computed by a training engine (Megatron, FSDP). Mathematically they evaluate the same function. Numerically they do not — different kernels, different batching, different reduction orders — so the probability the trainer assigns to a token it supposedly just sampled is not quite the probability the sampler used."
                display: "π_train(y|x) ≠ π_infer(y|x)  ⇒  the importance ratio is wrong before training even starts"
              - text: "The consequence is silent: the run is off-policy without anyone asking for it, the ratio drifts, and eventually the policy collapses. The fixes split into three groups. Make inference deterministic (the Thinking Machines post explains that the culprit is batch-size-dependent reduction order, not atomics; SGLang implements it). Correct the mismatch statistically with importance sampling — which the 2025 “Stabilizing RL with LLMs” paper shows is also the theory behind Routing Replay, the trick that fixes MoE runs by pinning the router's expert choices between rollout and training."
              - text: "Or change the numerics. “Give Me FP32 or Give Me Death” takes precision seriously; the FP16 paper is the counter-intuitive one, arguing that consistency of the train/infer path matters more than the width of the float — BF16's wider exponent and coarser mantissa hurt more than FP16 helps."
            papers:
              - { year: 2025, title: "Defeating Nondeterminism in LLM Inference", note: "Batch-invariant kernels; the reduction order is the bug.", grade: "A", url: "https://thinkingmachines.ai/blog/defeating-nondeterminism-in-llm-inference/", featured: true, tags: ["★"] }
              - { year: 2025, title: "Stabilizing RL with LLMs", note: "Importance-sampling correction, and the theory behind Routing Replay.", grade: "A-", url: "https://arxiv.org/abs/2512.01374", featured: true }
              - { year: 2025, title: "R3: MoE Routing Replay", note: "Pin the router between rollout and training; MoE RL stops collapsing.", grade: "A-", url: "https://arxiv.org/abs/2510.11370" }
              - { year: 2025, title: "Give Me FP32 or Give Me Death", note: "Precision as a first-class RL variable.", grade: "B+", url: "https://arxiv.org/abs/2506.09501" }
              - { year: 2025, title: "FP16 Mismatch", note: "Counter-intuitive: train/infer path consistency beats float width.", grade: "B+", url: "https://arxiv.org/abs/2510.26788" }
              - { year: 2025, title: "SGLang Deterministic Inference", note: "The determinism fix, shipped.", grade: "B", url: "https://lmsys.org/blog/2025-09-22-sglang-deterministic/" }
              - { year: 2025, title: "Tensor-Parallel Size and Determinism", note: "The same reduction-order problem, across TP degrees.", grade: "B", url: "https://arxiv.org/abs/2511.17826" }
              - { year: 2025, title: "Unified FP8 for RL (SGLang)", note: "FP8 rollouts without breaking the ratio.", grade: "B", url: "https://lmsys.org/blog/2025-11-25-fp8-rl/" }
              - { year: 2025, title: "DeepSeek-V3.2", note: "Sparse attention and the RL infrastructure around it.", grade: "B+", url: "https://arxiv.org/abs/2512.02556" }

          - heading: "Long-context RL"
            notes:
              - text: "An agent that runs for fifty tool calls accumulates a context longer than anything it was trained on, and the gradient has to flow back through all of it. Context-Folding compresses completed sub-tasks out of the working context so the horizon stays bounded, which turns a long-horizon RL problem back into a tractable one; QwenLong-L1.5 attacks the same wall from the training side."
            papers:
              - { year: 2025, title: "Context-Folding", note: "Fold finished sub-tasks out of context; bound the horizon.", grade: "A-", url: "https://arxiv.org/abs/2510.11967" }
              - { year: 2025, title: "QwenLong-L1.5", note: "Long-context reasoning trained with RL.", grade: "B+", url: "https://arxiv.org/abs/2512.12967" }

      - name: "Tasks and agents"
        sections:
          - heading: "Where the reward comes from"
            notes:
              - text: "Agentic RL is the same algorithm with a harder environment: the episode now interleaves the model's tokens with an environment's — a tool result, a page, a compiler error — and the policy must not be trained on tokens it did not generate. Everything else is a question of where the reward comes from, and the sections below are ordered by how cheaply it can be obtained."
                display: "test suite → search answer key → GUI state check → human/model judge"

          - heading: "Coding agents"
            notes:
              - text: "The best-rewarded domain there is: the test suite is the environment, the reward, and the verifier at once. The difficulty moves entirely into the rollout — a SWE-bench episode means cloning a repo, running a build, and executing a test harness inside a sandbox, thousands of times in parallel."
            papers:
              - { year: 2026, title: "Qwen3-Coder-Next", note: "Scaling RL on real repository tasks.", grade: "B+", url: "https://arxiv.org/abs/2603.00729" }
              - { year: 2026, title: "SWE-Master", note: "An agentic RL recipe for software engineering.", grade: "B+", url: "https://arxiv.org/abs/2602.03411" }

          - heading: "Deep research and search agents"
            notes:
              - text: "Search-R1 is the paper to read first, because it settles the mechanics: interleave retrieved passages into the rollout, mask the retrieved tokens out of the loss, and reward the final answer only. That masking rule generalises to every tool-using agent below."
              - text: "The deep-research systems then scale the horizon from three retrievals to hundreds, at which point the hard problem is synthetic task generation — nobody has a labelled dataset of research questions whose answers are checkable — and Tongyi DeepResearch is largely an answer to that."
            papers:
              - { year: 2025, title: "Search-R1", note: "Retrieved tokens masked out of the loss; outcome reward only. The template.", grade: "A", url: "https://arxiv.org/abs/2503.09516", featured: true, tags: ["★"] }
              - { year: 2025, title: "Tongyi DeepResearch", note: "Synthetic task generation for long-horizon research agents.", grade: "A-", url: "https://arxiv.org/abs/2510.24701" }
              - { year: 2026, title: "Yunque DeepResearch", note: "A recent deep-research training stack.", grade: "B", url: "https://arxiv.org/abs/2601.19578" }
              - { year: 2026, title: "How to Train a Deep Research Agent", note: "Ablations over the recipe rather than a new model.", grade: "B+", url: "https://arxiv.org/abs/2602.19526" }

          - heading: "Computer-use and GUI agents"
            notes:
              - text: "Here the environment is a real operating system, so a rollout costs a virtual machine and an episode can be destructive. The reward is a state check — did the file get saved, did the form submit — and the papers are mostly about making thousands of parallel VMs cheap enough that RL is affordable at all."
            papers:
              - { year: 2025, title: "ComputerRL", note: "Scaling OS-level environments for RL.", grade: "B+", url: "https://arxiv.org/abs/2508.14040" }
              - { year: 2026, title: "OmegaUse", note: "A recent computer-use agent trained end to end.", grade: "B", url: "https://arxiv.org/abs/2601.20380" }
              - { year: 2026, title: "GUI-Libra", note: "GUI agent RL with calibrated rewards.", grade: "B", url: "https://arxiv.org/abs/2602.22190" }

          - heading: "Tool-use RL"
            notes:
              - text: "ToolRL is the reward-design textbook: it decomposes the reward into format correctness, tool-name correctness and argument correctness, and shows what each component buys. Nemotron-Tool-N1 argues the opposite and is the more interesting read — a binary reward on whether the call succeeded, with no supervision of the reasoning that produced it, generalises better than the decomposed version, which the model learns to satisfy without learning to call tools well."
              - text: "ReTool supplies the missing first stage: cold-start on synthesised tool traces so that the outcome-reward RL has something non-zero to reinforce."
            papers:
              - { year: 2025, title: "ToolRL", note: "Decomposed reward design for tool calls; read as the thesis.", grade: "A-", url: "https://arxiv.org/abs/2504.13958" }
              - { year: 2025, title: "Nemotron-Tool-N1", note: "Binary reward, no reasoning supervision — and it generalises better.", grade: "A-", url: "https://arxiv.org/abs/2505.00949", featured: true }
              - { year: 2025, title: "ReTool", note: "Cold-start synthesis, then outcome-reward RL.", grade: "B+", url: "https://arxiv.org/abs/2504.09442" }

          - heading: "Generalist agent RL frameworks"
            notes:
              - text: "Once the environment count grows past a handful, the bottleneck is orchestration rather than optimisation: heterogeneous environments have different latencies, so a synchronous batch stalls on the slowest one. AGENTRL answers with asynchrony and cross-policy sampling; ProRL Agent turns rollout into a service that the trainer calls; RLAnything goes furthest and optimises the environment, the policy and the reward model jointly."
            papers:
              - { year: 2025, title: "AGENTRL", note: "Asynchronous multi-environment agent RL with cross-policy sampling.", grade: "A-", url: "https://arxiv.org/abs/2510.04206" }
              - { year: 2025, title: "WebAgent-R1", note: "End-to-end RL for web agents.", grade: "B+", url: "https://arxiv.org/abs/2505.16421" }
              - { year: 2025, title: "Kimi K2.5 Agent Swarm", note: "Multi-agent orchestration for agentic tasks.", grade: "B", url: "https://moonshotai.github.io/Kimi-K2.5/" }
              - { year: 2026, title: "RLAnything", note: "Joint optimisation of environment, policy and reward model.", grade: "B+", url: "https://arxiv.org/abs/2602.02488" }
              - { year: 2026, title: "ProRL Agent", note: "Rollout-as-a-service for multi-turn agent RL.", grade: "B+", url: "https://arxiv.org/abs/2603.18815" }

          - heading: "Why agent RL fails, and self-evolution"
            notes:
              - text: "RAGEN names the characteristic failure: the Echo Trap. Early in training the policy finds one reasoning pattern that is rewarded, entropy collapses onto it, gradient variance spikes, and the run locks into a local optimum that looks like convergence on the reward curve. It is the agentic analogue of the entropy collapse that CISPO and clip-higher were designed to postpone."
              - text: "The deeper cause is credit assignment: a fifty-step episode with one terminal reward gives every step the same advantage. iStar and AgentPRM both push a process reward into the agent setting — implicitly from the outcome, or explicitly from Monte-Carlo rollouts. Absolute Zero is the outlier and the one to end on: the model proposes its own tasks and verifies them with a code executor, so the data, the curriculum and the reward are all generated by the policy itself, and no human-authored dataset appears anywhere in the loop."
            papers:
              - { year: 2025, title: "RAGEN", note: "The Echo Trap: entropy collapse and why agent RL runs stall.", grade: "A-", url: "https://arxiv.org/abs/2504.20073", featured: true }
              - { year: 2025, title: "AgentPRM", note: "Monte-Carlo rollout actor–critic for step-level credit.", grade: "B+", url: "https://arxiv.org/abs/2502.10325" }
              - { year: 2025, title: "Absolute Zero", note: "Zero-data self-play: the policy proposes and verifies its own tasks.", grade: "A", url: "https://arxiv.org/abs/2505.03335", featured: true, tags: ["★"] }
              - { year: 2026, title: "iStar", note: "An implicit PRM for agentic credit assignment.", grade: "B+", url: "https://arxiv.org/abs/2601.15839" }

  - name: "Topic 1 · Spatial reasoning"
    subtopics:
      - name: "Background: standard design of VLMs"
        sections:
          - heading: "Overview"
            notes:
              - text: "VLMs are the bridge between perception and language."
              - text: "A practical implementation usually decomposes the model into visual representation, language representation, alignment or fusion, and a task head or decoder:"
                display: "VLM = visual representation + text representation + alignment/fusion mechanism + task head or decoder"
                image: "/assets/img/reading_list/llava_arch.png"
                image_width: 640   # native 1607px wide, ~40px text -> ~15.5px on screen
                image_alt: "The LLaVA architecture. An image X_v enters a vision encoder producing features Z_v; a projection matrix W maps them into visual tokens H_v. A language instruction X_q becomes text tokens H_q. Both token sequences feed the language model f_phi, which autoregressively emits the language response X_a."
                image_caption: "LLaVA makes the four parts concrete: the vision encoder is the visual representation, the instruction tokens are the text representation, the projection W is the alignment/fusion mechanism, and the language model itself serves as the decoder."
              - text: "This gives the standard modular MLLM pipeline:"
                display: "image → vision encoder → projector / adapter / resampler → LLM → text response"

          - heading: "The vision encoder"
            notes:
              - text: "The vision encoder is the first stage of that pipeline: it turns raw pixels into a sequence of tokens the LLM can attend over. Almost every modern VLM uses a Vision Transformer (ViT), typically one pretrained by image–text contrastive learning (CLIP, SigLIP) and often kept frozen."
              - text: "It begins by patchifying the image. The picture is cut into a grid of fixed-size patches; each patch is flattened, linearly projected to the model width D, and given a positional encoding. The patch grid — not the pixel count — sets the token budget:"
                display: "224×224 image, 16×16 px patches → 14×14 grid = 196 visual tokens"
                image: "/assets/img/reading_list/image_tokenization.jpeg"
                image_width: 540   # native 1566px wide, ~46px text -> ~15.5px on screen
                image_alt: "Patch embeddings in a Vision Transformer. A 224 by 224 image is divided into 16 by 16 pixel patches, forming a 14 by 14 grid. Each patch is flattened into 768 values, linearly projected to D dimensions, and given a positional encoding, yielding 196 tokens."
                image_caption: "Patch embedding. Each 16×16 px patch flattens to 16·16·3 = 768 values before the linear projection to D. Note the middle panel labels patch size, not grid size: the grid is 14×14."
              - text: "Stacked self-attention blocks then contextualize those patch tokens. The encoder's output is N token vectors in its own width, which the projector maps into the LLM's embedding space so they can simply be concatenated with the text tokens."
              - text: "Two consequences drive much of the spatial-reasoning literature: fine detail is capped by the patch grid, and token count grows quadratically with resolution. That is why resamplers (Q-Former, Perceiver) and dynamic-resolution schemes (Qwen2-VL, LLaVA-NeXT) exist."

          - heading: "VLM training"
            image: "/assets/img/reading_list/VLMArch.jpg"
            image_width: 850   # native 2794px wide, ~52px text -> ~15.5px on screen
            image_alt: "Two VLM training stages side by side. In pre-training the image encoder and text decoder are frozen and only the multimodal projector is trained; in fine-tuning the projector and text decoder are trained while the image encoder stays frozen."
            image_caption: "The standard two-stage recipe: pre-training aligns the projector against a frozen encoder and decoder; fine-tuning unfreezes the decoder for instruction following."

          - heading: "Qwen2.5-VL as an example"
            notes:
              - text: "The standard design above is not necessarily the optimal one. Production VLMs depart from it wherever the fixed-resolution ViT costs accuracy or compute, and Qwen2.5-VL is a convenient place to see the three most common departures: native dynamic resolution, window attention in place of full attention over every patch, and genuine video support rather than a stack of independent frames."
              - text: "Qwen2.5-VL instantiates the same pipeline, but drops the fixed-resolution assumption that produced a constant 196 tokens above. Images enter at native resolution, so the token count becomes a function of the picture itself:"
                display: "native-resolution image → Conv3D patch embed (2×14×14) → windowed ViT → merger → Qwen2.5 LM decoder"
                image: "/assets/img/reading_list/qwen2vl.jpg"
                # Dense figure: its small labels sit near 16px in a 1872px-wide source, so
                # matching body text would need ~1800px. Given the full column instead; click to zoom.
                image_width: 870
                image_alt: "The Qwen2.5-VL architecture. Images and video at native resolution enter a vision encoder built from RMSNorm and SwiGLU blocks using mostly window attention with occasional full attention, after a Conv3D patch embedding with two-times temporal merging. The resulting visual tokens, varying in count per image, are concatenated with text tokens and fed to the Qwen2.5 language-model decoder. Video frames use dynamic FPS sampling and MRoPE time IDs aligned to absolute time."
                image_caption: "Qwen2.5-VL. Native-resolution input makes the visual token count vary per image; window attention keeps the cost of a large token sequence manageable. Click the figure to view it full size."
              - text: "Because resolution is preserved, a thin 224×28 banner costs only 8 tokens while a tall 1092×8204 page costs 11,427. Detail is no longer capped by a 14×14 grid, but the sequence the LLM must attend over grows with the image."
              - text: "To make that affordable the encoder uses window attention over 112×112 windows in most blocks, whose cost is linear rather than quadratic in token count, interleaved with occasional full-attention blocks that restore global context. The blocks themselves mirror the LLM: RMSNorm and a SwiGLU feed-forward."
              - text: "Video is not fed in as a sequence of independent image frames. The patch embedding is a Conv3D spanning two adjacent frames (2×14×14), so each visual token already summarises a short slice of time and the temporal token count is halved before the encoder ever runs."
              - text: "On top of that, dynamic FPS sampling decides how many frames survive — the same clip costs 644, 1288 or 2576 tokens depending on the rate — and MRoPE gives every token a time ID aligned to its absolute timestamp. The model therefore sees elapsed seconds rather than frame indices, which is what lets it answer questions about duration and ordering."
            papers:
              - { title: "Qwen2.5-VL Technical Report", note: "The architecture and training recipe in full.", grade: "A-", url: "https://arxiv.org/abs/2502.13923" }
              - { title: "Qwen2.5-VL: a hands-on code walkthrough", note: "Traces the implementation end to end, from patch embedding to the LM decoder.", grade: "B", url: "https://pub.towardsai.net/qwen2-5-vl-a-hands-on-code-walkthrough-5fba8a34e7d7" }
      - name: "Spatial tasks and benchmarks — overview of VLM capability"
        sections:
          - heading: "The gap between semantic and spatial understanding"
            notes:
              - text: "At the semantic level a frontier VLM is close to human: it names objects, describes activities, and answers open-ended questions about a scene. Most people have felt this in daily use."
              - text: "Understanding 3D spatial information is a different story. The geometry of objects, where they sit relative to one another, and how they move are all immediate for a human and hard for a VLM. The failures are systematic rather than random: qualitative results show the model repeatedly making low-level mistakes, such as reasoning over pixel space — taking a measurement in pixels for an object's length in 3D — and being unable to perform mental rotation while thinking."
                image: "/assets/img/reading_list/performance_gap.jpg"
                # Dense slide: its smallest text is ~20px in an 1800px-wide source, so matching
                # body text would need ~1400px. Given the full column instead; click to zoom.
                image_width: 870
                image_alt: "Two GPT-5 failure cases beside a radar plot. In a spatial-relations question about which object is higher in 3D world space, GPT-5 reasons from apparent height in the 2D image and answers wrongly. In a mental-reconstruction task it cannot build a 3D shape from its top view. The radar plot compares humans against GPT-5 and Qwen3-VL-8B across eight axes including object-object relationships, camera-region relationships, measurement, appearance, camera motion, and multi-step reasoning; the human polygon encloses both models on every axis."
                image_caption: "GPT-5 judges elevation from 2D pixel height rather than 3D world space, and cannot perform the mental rotation needed to reconstruct a shape from its top view. The radar plot shows the gap is not confined to one skill: the human envelope encloses both proprietary and open models on every axis. Source: “Has GPT-5 Achieved Spatial Intelligence? An Empirical Study.” Click the figure to view it full size."

          - heading: "Benchmarks: spatial tasks as VQA"
            notes:
              - text: "To quantify a model's spatial capability, the standard way to build benchmark data is to formulate each spatial skill as a visual question-answering task. Given an image or a video, the model answers a numerical or a multiple-choice question, so grading is exact and automatic:"
                display: "image / video + spatial question → numerical answer or multiple choice"
              - text: "VSI-Bench is a representative instance. Its questions are posed over a walkthrough video of a single real room, and its eight tasks split cleanly by answer type:"
                image: "/assets/img/reading_list/vsibench_tasks.png"
                # Same treatment: ~22px question text in a 1990px-wide source.
                image_width: 870
                image_alt: "The eight VSI-Bench tasks arranged around a 3D floor plan showing the camera trajectory through a flat. On the left: object count, relative distance, appearance order, and relative direction. On the right: object size, absolute distance, room size, and route plan. A strip of video frames from the walkthrough runs across the top."
                image_caption: "VSI-Bench. Every task is answered from the same walkthrough video, so the model must integrate observations across frames rather than read one picture. Click the figure to view it full size."
              - text: "Four tasks want a number, and are scored against the true value: object count, object size in centimetres, absolute distance in metres, and room size in square metres."
              - text: "The other four are multiple choice: relative distance, relative direction from an assumed viewpoint and heading, the order in which objects first appear, and route planning, where the model fills in the missing turns of a navigation plan."
              - text: "Because the input is a video of one continuous scene rather than an isolated frame, the model has to accumulate what it has seen into a persistent spatial map — which is precisely the ability the radar plot above says is missing."

          - heading: "Results: spatial reasoning is still unsolved"
            notes:
              - text: "Running the benchmark makes the size of the gap concrete. Both proprietary and open-source models are improving quickly, yet spatial reasoning remains an unsolved problem for all of them:"
                image: "/assets/img/reading_list/vsi_results.png"
                # Dense table: ~22px text in a 1718px-wide source would need ~1200px to match
                # body text. Given the full column instead; click to zoom.
                image_width: 870
                image_alt: "VSI-Bench results table. Proprietary models, open-source models, and human evaluation are compared across an average column and eight task columns split into numerical answers (object count, absolute distance, object size, room size) and multiple-choice answers (relative direction, relative distance, route plan, appearance order). GPT-5 leads the proprietary models with an average of 53.14 and InternVL3-78B leads the open-source models with 45.85, against a human average of 79.2."
                image_caption: "VSI-Bench results. The delta row reports the best model minus human, and it is negative on six of the eight tasks. Click the figure to view it full size."
              - text: "The best model averages 53.1 against a human 79.2, a deficit of 26 points. The best open-source model, InternVL3-78B, reaches 45.9 — close enough to the proprietary frontier that the gap between labs is now smaller than the gap to people."
              - text: "The deficit is not uniform, and where it inverts is instructive. On the two metric-estimation tasks the models already beat humans: object size by 13.3 points and room size by 5.9. Humans are simply poor at eyeballing centimetres and square metres, scoring 47.0 and 45.9 there."
              - text: "On the relational and egocentric tasks the picture flips hard. Humans score between 94.7 and 100 on relative direction, relative distance, route planning and appearance order, while the best model manages 41 to 66 — deficits of 31, 52, 49 and 32 points. Estimating a quantity is not what defeats these models; building and querying a consistent spatial model of the scene is."

          - heading: "Analysis beyond accuracy"
            notes:
              - text: "An aggregate score says a model is bad at spatial reasoning; it does not say why. Two families of analysis go further, and they cut at different levels."
              - text: "The first stays in the text domain: ask the model to explain its reasoning, then read the explanation."
                image: "/assets/img/reading_list/self-explanation.png"
                image_width: 870
                image_alt: "Two VSI-Bench cases with the model's written reasoning. In a relative-direction question the model orients itself at the refrigerator, locates the dishwasher, visualises the Cartesian quadrants, and answers front-left, matching the ground truth; it is annotated as showing human-like reasoning, video understanding, and an internal world model. In a route-plan question it answers turn right then turn left where the truth is turn left then turn right, and is annotated as failing egocentric-allocentric transformation and relational reasoning."
                image_caption: "Left: the model reaches the right answer through recognisably human steps — orient yourself, locate the object, visualise the quadrants — grounding each in a video timestamp. Right: the same machinery inverts the turns of a route plan. That is an egocentric-to-allocentric failure, not a perception failure. Click the figure to view it full size."
              - text: "Because those explanations are text, they can be labelled and counted. Aggregating over the whole benchmark turns anecdote into a distribution of error patterns:"
                image: "/assets/img/reading_list/error-pattern.png"
                image_width: 870
                image_alt: "Two charts. A stacked bar chart shows the error breakdown per task for appearance order, absolute distance, room size, object size, route plan, relative direction, relative distance, and object count, split into linguistic intelligence error, visual perception error, relational reasoning error, and egocentric-allocentric transformation error. A pie chart shows the overall breakdown, in which relational reasoning error is the largest slice, followed by egocentric-allocentric transformation error, visual perception error, and linguistic intelligence error."
                image_caption: "Relational reasoning is the largest error bucket overall, followed by egocentric–allocentric transformation."
              - text: "The per-task bars matter more than the pie, because they show the bottleneck moving. Object count fails overwhelmingly on visual perception — the model simply misses objects. Appearance order fails mostly on linguistic intelligence. Route plan and room size are almost entirely relational and egocentric–allocentric. “Spatial reasoning” is not one failure mode but at least four, in different proportions per task."
              - text: "The second family opens the model up rather than taking its word for it. Attention weights over image patches show which regions an answer was actually computed from:"
                image: "/assets/img/reading_list/attention.png"
                image_width: 870
                image_alt: "A VLM such as LLaVA is asked where the book is in relation to the candle, and where the cat is in relation to the person. Its attention over image patches is visualised. A smoother, more diffuse attention map is labelled unfamiliar and paired with a low-confidence wrong answer; the model is told to look at other patches. A sharper map is labelled familiar; the model is told to look more closely. Both interventions yield the correct relation."
                image_caption: "Attention over image patches in LLaVA. The shape of the map is itself a signal: a diffuse map coincides with a low-confidence guess, and steering where the model attends recovers the correct relation. Click the figure to view it full size."
              - text: "The two are complementary. A self-explanation is legible but may be a post-hoc rationalisation of an answer the model had already committed to; an attention map is tied to the computation but needs interpreting before it means anything."

          - heading: "Reading"
            papers:
              - { title: "VSI-Bench", note: "Spatial tasks posed as VQA over walkthrough video; the benchmark used above.", grade: "A-", url: "https://arxiv.org/abs/2603.05591" }
              - { title: "OmniSpatial", note: "Broader coverage of spatial reasoning categories.", grade: "B+", url: "https://arxiv.org/abs/2506.03135" }
              - { title: "MMSI-Bench", note: "Multi-image spatial intelligence benchmark.", grade: "B+", url: "https://arxiv.org/abs/2505.23764" }
              - { title: "MindCube", grade: "B", url: "https://arxiv.org/abs/2506.21458" }
              - { title: "Why Is Spatial Reasoning Hard for VLMs? An Attention Mechanism Perspective on Focus Areas", note: "Reads spatial failure off the attention maps — the second analysis family above.", grade: "B+", url: "https://arxiv.org/abs/2503.01773" }
              - { title: "Beyond Semantics: Rediscovering Spatial Awareness in Vision-Language Models", note: "Argues spatial awareness is present but under-used relative to semantics.", grade: "B+", url: "https://arxiv.org/abs/2503.17349" }
      - name: "Data-driven methods"
        sections:
          - heading: "The data-scarcity hypothesis"
            notes:
              - text: "The most intuitive explanation for the gap is a data one. VLM pretraining corpora annotate semantics — what is in the picture — while data carrying genuine 3D spatial annotation is rare. If that is the whole story, spatial reasoning is not a missing capability but a missing dataset, and enough spatial VQA data should train it in."
              - text: "Since such data cannot be hand-labelled at scale, the standard move is a pipeline that manufactures it automatically from ordinary images:"
                image: "/assets/img/reading_list/automatic_label.png"
                image_width: 870
                image_alt: "An automatic spatial-VQA generation pipeline in five stages. (a) Semantic filtering discards unsuitable images. (b) 2D context extraction runs region captioning, metric depth estimation, coordinate canonicalization, and segmentation. (c) The 2D context is lifted into a 3D point cloud. (d) Ambiguity resolution clusters region captions and removes duplicates so each object has one unambiguous referring expression. (e) Distance and predicate extraction, followed by human alignment, synthesises question-answer pairs such as: how far is A from B, and the answer is a distance."
                image_caption: "The SpatialVLM-style recipe. Off-the-shelf perception models supply what the annotation lacks: depth estimation and segmentation lift a flat image into a 3D point cloud, from which distances and spatial predicates are read off and templated into question–answer pairs. Click the figure to view it full size."
              - text: "The critical step is (c). Metric depth turns pixels into coordinates, so a quantity that was never annotated — the distance between two objects — becomes computable, and therefore becomes supervision. Everything else exists to make that measurement unambiguous: clustering collapses “cake shaped like a house” and “cake on a plate” into a single referent before any question is asked about it."

          - heading: "Does scaling the data solve it?"
            notes:
              - text: "Fine-tuning on this synthetic data does improve the benchmarks. But an interesting finding is that spatial reasoning appears to emerge, and to scale, markedly more slowly than other capabilities:"
                image: "/assets/img/reading_list/scaling_data.jpg"
                image_width: 870
                image_alt: "Top: two bar charts. On basic cognition tasks such as boundary, intuitive physics, intentionality and tool use, humans score 79, GPT-5 scores 78, and InternVL3 scores 51. On spatial reasoning, humans score 95, GPT-5 scores 36, and InternVL3 scores 25. Bottom: two performance-versus-data-volume curves for SenseNova-SI built on InternVL3-8B and InternVL3-2B, for a measurement task and a multi-step reasoning task. Both curves rise steeply until roughly two million samples and then flatten out to eight million, with a red box marking the plateau. Other models including ViLaSR-7B, SpatialLadder-3B, SpaceR-7B, VST-7B and Cambrian-S-7B are plotted at their own data volumes."
                image_caption: "Spatial reasoning is not “emerging” at the rate other capabilities are. Top: GPT-5 essentially matches humans on basic cognition (78 against 79) yet collapses on spatial reasoning (36 against 95). Bottom: performance climbs steeply to about 2M samples, then plateaus out to 8M. Click the figure to view it full size."
              - text: "The top row isolates the anomaly. The same model that reaches human parity on boundary, intuitive physics, intentionality and tool use scores 36 against a human 95 once the question turns spatial. Whatever is missing is specific, not a general shortfall in capability."
              - text: "The bottom row is the part that should worry a purely data-driven programme. Both SenseNova-SI curves rise steeply, overtake GPT-5, then flatten after roughly 2M samples — the next four million buy almost nothing. If more data were sufficient, the curve would keep climbing."

          - heading: "Why the signal is weak"
            notes:
              - text: "There could be many reasons behind that plateau. A likely one is that a VQA pair is a very weak training signal for geometry."
              - text: "Compare what the video contains with what the label carries. The scene holds the full geometry: every surface, every relative position, the camera's path through it. The supervision is a single scalar, or one letter of a multiple choice. Gradient descent is being asked to recover a 3D world model from an extremely low-bandwidth target."
              - text: "Worse, that target is often reachable without the geometry at all. Answer priors, question phrasing and object co-occurrence offer shortcuts, so the model can over-attend to the text and score well without ever reasoning from the visual input — which is precisely what the error-pattern and attention analyses in the previous subtopic suggest is happening."

          - heading: "Reading"
            papers:
              - { title: "SpatialVLM: Endowing Vision-Language Models with Spatial Reasoning Capabilities", note: "The automatic spatial-VQA generation pipeline shown above.", grade: "A-", url: "https://arxiv.org/abs/2401.12168", featured: true }
              - { title: "Cambrian-S: Towards Spatial Supersensing in Video", grade: "B+", url: "https://arxiv.org/abs/2511.04670" }
              - { title: "Learning to Localize Objects Improves Spatial Reasoning in Visual-LLMs", note: "Localization as an auxiliary objective — a denser signal than VQA alone.", grade: "B+", url: "https://arxiv.org/abs/2404.07449" }
              - { title: "Scaling Spatial Intelligence with Multimodal Foundation Models", note: "The SenseNova-SI scaling curves shown above.", grade: "A-", url: "https://arxiv.org/abs/2511.13719" }
              - { title: "How Far are VLMs from Visual Spatial Intelligence? A Benchmark-Driven Perspective", grade: "B+", url: "https://arxiv.org/abs/2509.18905" }

      - name: "Incorporating 3D modality in the input layer"
        sections:
          - heading: "The idea: hand the model depth instead of hoping it infers depth"
            notes:
              - text: "If a VQA pair is too weak a signal to teach geometry from pixels alone, one response is to stop asking. Rather than hoping the model recovers 3D structure from a flat image, feed it a 3D signal directly at the input layer, alongside the RGB tokens."
              - text: "SpatialRGPT is the clearest instance. Depth enters as a second visual stream, and questions are asked about explicitly marked regions rather than the whole image:"
                image: "/assets/img/reading_list/spatialrgpt.png"
                image_width: 700
                image_alt: "The SpatialRGPT architecture. An input RGB image with optional depth passes through a frozen visual backbone. Region masks or boxes are fed to a region feature extractor, whose output is split between a trainable RGB connector and a trainable depth connector. These produce interleaved rgb and depth tokens for each region, which are placed into the language model's prompt alongside the question — what is the distance between the red region and the orange region — and the large language model answers that they are around 45 centimetres apart."
                image_caption: "SpatialRGPT. Each referenced region contributes a pair of tokens, <rgb> and <depth>, spliced into the prompt where the question points at it. The visual backbone is frozen (snowflake); the region feature extractor, both connectors and the LLM are tuned (flame)."

          - heading: "How it works"
            notes:
              - text: "The depth map is not ground truth. It comes from an off-the-shelf monocular estimator — Metric3Dv2 in SpatialRGPT's case, chosen because it is trained across indoor and outdoor scenes and so generalises to in-the-wild images."
              - text: "That depth map is then encoded by the same frozen visual backbone that encodes the RGB image. A region feature extractor turns each user-supplied mask or box into a pixel-level embedding, and two separate connectors project the RGB and depth features into the language embedding space."
              - text: "The depth connector is the plugin. Its weights are initialised from the trained RGB connector and then tuned only on spatial QA, which is what lets depth be optional: with no depth map supplied, the model falls back to RGB-only rather than breaking."
              - text: "Inside the prompt, special placeholder tokens are substituted with the corresponding region embeddings, so a question that points at two regions becomes a token sequence the LLM can attend over:"
                display: "“What is the distance between <region₁> and <region₂>?” → … <rgb₁><depth₁> … <rgb₂><depth₂> …"
              - text: "The training data is generated by the same kind of pipeline as the previous subtopic, but lifted to 3D scene graphs. Open-vocabulary detection and segmentation (GroundingDINO, SAM) find the regions, Metric3Dv2 supplies metric depth, and camera intrinsics and extrinsics are themselves estimated (WildCamera, PerspectiveFields) so the point cloud can be canonicalised. The resulting Open Spatial Dataset covers roughly 1M images and 5M regions from OpenImages, yielding about 8M template-based QAs and 700K LLM-written ones."

          - heading: "Limitations"
            notes:
              - text: "The 3D is borrowed, not learned. Depth arrives from a frozen external estimator, so its errors are simply inherited: no gradient flows back to correct a bad depth map, and the VLM has no way to notice one. The approach upgrades the input, not the model's ability to perceive geometry."
              - text: "Metric depth from a single image is ill-posed without the camera. SpatialRGPT recovers intrinsics and extrinsics with further estimators, so scale errors from three separate off-the-shelf models compound before the LLM sees a single token."
              - text: "The paper's own stated limitation is the use of axis-aligned bounding boxes. An AABB misrepresents any rotated object, and the accurate alternative — oriented bounding boxes — needs object pose estimation, which has no reliable open-world solution."
              - text: "Regions must be supplied. The model answers questions about regions you point at, which makes it a strong referring-expression reasoner but not a free-form scene understander. Something else has to decide what the regions are."
              - text: "Finally, it is single-image. Depth is computed per frame and nothing accumulates into a persistent map across a video. That leaves the tasks the benchmarks showed to be hardest — route planning, appearance order, egocentric-to-allocentric transformation — largely untouched, since a depth channel supplies metric distance rather than a viewpoint-independent model of the scene."

          - heading: "Reading"
            papers:
              - { title: "SpatialRGPT: Grounded Spatial Reasoning in Vision-Language Models", note: "Depth as a plugin modality plus region tokens; NeurIPS 2024. The architecture above.", grade: "A-", url: "https://arxiv.org/abs/2406.01584", featured: true }
              - { title: "Spatial-MLLM: Boosting MLLM Capabilities in Visual-based Spatial Intelligence", grade: "B+", url: "https://arxiv.org/abs/2505.23747" }
              - { title: "SSR: Enhancing Depth Perception in Vision-Language Models via Rationale-Guided Spatial Reasoning", note: "Turns the depth signal into a reasoning rationale rather than extra input tokens.", grade: "B+", url: "https://arxiv.org/abs/2505.12448" }
              - { title: "GeoSense: Internalizing Geometric Necessity Perception for Multimodal Reasoning", note: "Adds a geometry input channel, but injects it only when 2D cues are judged insufficient — a direct answer to the always-on cost of the approach above.", grade: "B+", url: "https://arxiv.org/abs/2603.10370" }
              - { title: "Thinking with Geometry: Active Geometry Integration for Spatial Reasoning", note: "Argues fusing geometry as a global, indiscriminate stream causes semantic-geometry misalignment; GeoThinker instead lets the model query geometric evidence on demand.", grade: "B+", url: "https://arxiv.org/abs/2602.06037" }

      - name: "Chain-of-thought reasoning for spatial tasks"
        sections:
          - heading: "Why words are the wrong default scratchpad"
            notes:
              - text: "Textual chain of thought helps when the intermediate state is naturally linguistic. Spatial questions depend on object identity, pose, metric distance, and the coordinate frame from which “left” or “front” is defined. Serializing that state into prose can discard the geometry needed by the next step."
              - text: "VSI-Bench provides the strongest contrary result to generic reasoning recipes: linguistic CoT, self-consistency, and Tree of Thoughts do not reliably improve performance, while explicitly generating a cognitive map helps spatial-distance reasoning."
              - text: "A 2025 controlled study reaches the same conclusion from another direction: simple CoT can hurt spatial accuracy, while staged scene-graph reasoning helps. The useful intervention is not “say more”; it is “materialize objects and relations before composing them.”"
                display: "frames → objects + poses + reference frame → map or scene graph → query → answer"
              - text: "Written explanations remain useful diagnostics, but a correct sentence about a wrong coordinate frame is still a wrong computation. A trace becomes inspectable when each step points to a box, coordinate, map cell, or source view."
            papers:
              - { year: 2024, title: "Thinking in Space", note: "Generic linguistic reasoning fails while explicit cognitive maps help.", grade: "A", url: "https://arxiv.org/abs/2412.14171", featured: true, tags: ["★"] }
              - { year: 2025, title: "Enhancing Spatial Reasoning in VLMs via CoT Prompting and Reinforcement Learning", note: "Simple CoT hurts; scene-graph CoT improves accuracy.", grade: "A-", url: "https://arxiv.org/abs/2507.13362", featured: true }
              - { year: 2024, title: "Visual Sketchpad", note: "Boxes, lines, crops, and specialist tools become visual working memory.", grade: "A", url: "https://arxiv.org/abs/2406.09403" }
              - { year: 2025, title: "EmbodiedVSR", note: "Dynamic scene-graph-guided reasoning for embodied tasks.", grade: "B+", url: "https://arxiv.org/abs/2503.11089" }
              - { year: 2024, title: "SpatialVLM", note: "An LLM coordinator composes grounded metric subqueries.", grade: "A-", url: "https://arxiv.org/abs/2401.12168" }

          - heading: "Ground every step in inspectable state"
            notes:
              - text: "SpatialVLM’s isosceles-triangle example captures the right decomposition: query three grounded distances, then execute an exact comparison. Its limitation is that the 3D state is borrowed from a specialist model rather than maintained by the VLM."
              - text: "SpatialCoT first aligns language, images, and coordinates bidirectionally, then teaches grounded reasoning for navigation and manipulation. The ordering matters: reasoning over an unaligned coordinate interface produces more fluent coordinate errors."
              - text: "Map2Thought goes further by placing deterministic vector, box-distance, and occlusion operations over a metric cognitive map. The explanation earns trust because the operations can be replayed."
              - text: "The architectural bet I find most credible is hybrid: language chooses the geometric operation, an explicit spatial state executes it, and language summarizes afterward. This is a synthesis of the readings, not a result established by any single paper."
            papers:
              - { year: 2025, title: "SpatialCoT", note: "Coordinate alignment before grounded chain of thought.", grade: "A-", url: "https://arxiv.org/abs/2501.10074", featured: true }
              - { year: 2026, title: "Map2Thought", note: "Deterministic reasoning over a metric cognitive map.", grade: "A-", url: "https://arxiv.org/abs/2601.11442", featured: true }
              - { year: 2024, title: "Visual Sketchpad", note: "Visual operations function as a replayable scratchpad.", grade: "A", url: "https://arxiv.org/abs/2406.09403" }
              - { year: 2025, title: "EmbodiedVSR", note: "Scene graphs are updated as the environment changes.", grade: "B+", url: "https://arxiv.org/abs/2503.11089" }
              - { year: 2025, title: "Chain-of-Visual-Thought", note: "Compact continuous tokens carry depth, layout, edges, and appearance.", grade: "B+", url: "https://arxiv.org/abs/2511.19418" }

      - name: "Spatial-aware RL"
        sections:
          - heading: "Reward geometry, not eloquent prose"
            notes:
              - text: "Final-answer reward is sparse and shortcut-prone. Geometry supplies denser checks almost for free: a mirror should exchange left and right, a rigid viewpoint change should preserve metric distance, and two views of one scene should induce a consistent map."
                display: "R = R_answer + λᵥR_equivariance + λgR_grounding + λmR_map-consistency − λc cost"
              - text: "The equation is a design template, not a formula from one paper. SpaceR rewards map imagination; SVQA-R1 builds relation-preserving view transformations into reward. A separate GRPO study reports more robustness than SFT under wording changes, suggesting outcome optimization can resist surface imitation."
              - text: "Answer-only RL can still reinforce a fluent trace built on faulty perception. Visual-RFT adds verifiable geometric rewards such as IoU; SR-REAL rewards 3D localization along its detect-then-reason path. The reward should touch the visual state where the error enters."
              - text: "The stronger test is closed-loop action. SA-VLA reports that ordinary RL adaptation can erode spatial inductive bias and uses geometric progress and spatially conditioned exploration to preserve it. A policy that reaches around an obstacle has demonstrated more than a VQA model that names “left.”"
              - text: "The caveat is scope. Most results use synthetic relations, benchmark QA, or short control horizons. Better reward on those tasks does not yet establish a persistent world model or robust transfer to open environments."
            papers:
              - { year: 2025, title: "SpaceR: Reinforcing MLLMs in Video Spatial Reasoning", note: "Map-imagination RL with verifiable rewards over long video.", grade: "A-", url: "https://arxiv.org/abs/2504.01805", featured: true, tags: ["★"] }
              - { year: 2025, title: "SVQA-R1", note: "Mirror and view consistency become spatial rewards.", grade: "A-", url: "https://arxiv.org/abs/2506.01371", featured: true }
              - { year: 2025, title: "Enhancing Spatial Reasoning in VLMs via CoT Prompting and RL", note: "GRPO versus SFT under spatial wording shifts.", grade: "B+", url: "https://arxiv.org/abs/2507.13362" }
              - { year: 2025, title: "Visual-RFT", note: "Task-verifiable visual rewards, including IoU.", grade: "A-", url: "https://arxiv.org/abs/2503.01785" }
              - { year: 2025, title: "Perception-R1", note: "Rewards explicit visual evidence rather than only the final answer.", grade: "B+", url: "https://arxiv.org/abs/2506.07218" }
              - { year: 2026, title: "Reinforcing Dual-Path Reasoning in Spatial VLMs (SR-REAL)", note: "Joint language-only and detect-then-reason paths.", grade: "B+", url: "https://arxiv.org/abs/2606.17539" }
              - { year: 2026, title: "SA-VLA", note: "Geometry-aware reward and exploration for manipulation RL.", grade: "B+", url: "https://arxiv.org/abs/2602.00743" }

      - name: "Promising research directions"
        sections:
          - heading: "Build a persistent, viewpoint-invariant world state"
            notes:
              - text: "A long video context is not a map. Frames remain indexed by camera time, objects recur under different appearances, and old evidence competes with every later token. A spatial system needs one canonical state into which observations are fused."
                display: "Mₜ = fuse(Mₜ₋₁, project(observationₜ, poseₜ));    answer = query(M_T, q)"
              - text: "The likely memory is two-level: working memory for recent high-resolution evidence and episodic memory for persistent objects, places, and relations. VLM² is direct evidence for this design; Ego3D-VLM and Map2Thought show the value of global coordinates and explicit maps."
              - text: "A real test should require loop closure, occlusion, revisiting, and counterfactual viewpoint queries. Current benchmark gains do not establish that one consistent scene survives a long trajectory."
              - text: "My research hypothesis is that uncertainty must be stored with geometry. A map cell should carry confidence or a distribution rather than a prematurely fixed fact; otherwise one depth error becomes an authoritative hallucination for every later query."
            papers:
              - { year: 2024, title: "Thinking in Space", note: "Evidence for emergent local world models and the benefit of explicit maps.", grade: "A", url: "https://arxiv.org/abs/2412.14171", featured: true, tags: ["★"] }
              - { year: 2025, title: "Vision-Language Memory for Spatial Reasoning (VLM²)", note: "Working plus episodic, view-consistent 3D-aware memory.", grade: "A-", url: "https://arxiv.org/abs/2511.20644" }
              - { year: 2025, title: "Spatial Reasoning with VLMs in Ego-Centric Multi-View Scenes", note: "Global-coordinate cognitive maps for real multi-view scenes.", grade: "B+", url: "https://arxiv.org/abs/2509.06266" }
              - { year: 2026, title: "Map2Thought", note: "Metric and discrete map representations in one interface.", grade: "A-", url: "https://arxiv.org/abs/2601.11442" }
              - { year: 2026, title: "Thinking with Geometry", note: "Queries geometric evidence on demand instead of fusing it indiscriminately.", grade: "B+", url: "https://arxiv.org/abs/2602.06037" }

          - heading: "Make perception active and consequences falsifiable"
            notes:
              - text: "Static VQA forces the model to guess from the supplied view. An embodied reasoner should choose its next observation—crop, zoom, move, or revisit—until competing spatial hypotheses separate."
              - text: "DeepEyes shows that RL can elicit useful visual tool calls; Visual Sketchpad shows that marks and specialist tools help spatial tasks; Chain-of-Visual-Thought compresses dense evidence into a smaller latent budget. None alone demonstrates a persistent 3D model."
              - text: "Action supplies the missing falsification signal. If a predicted relation must support navigation, reachability, or manipulation after a viewpoint change, pixel-space shortcuts stop paying."
              - text: "My highest-confidence bet is an adaptive hybrid: explicit geometry while the scene is uncertain, compact latent state after it stabilizes, and renewed observation whenever confidence falls. This is a direction suggested by the literature, not an established recipe."
            papers:
              - { year: 2025, title: "DeepEyes", note: "RL elicits crop-and-inspect visual reasoning.", grade: "A-", url: "https://arxiv.org/abs/2505.14362", featured: true }
              - { year: 2024, title: "Visual Sketchpad", note: "Visual working memory and specialist tools.", grade: "A", url: "https://arxiv.org/abs/2406.09403", featured: true, tags: ["★"] }
              - { year: 2025, title: "Chain-of-Visual-Thought", note: "Compact continuous visual state.", grade: "B+", url: "https://arxiv.org/abs/2511.19418" }
              - { year: 2024, title: "Visual Program Distillation", note: "Executed and verified visual programs become training traces.", grade: "A-", url: "https://arxiv.org/abs/2312.03052" }
              - { year: 2026, title: "SA-VLA", note: "Spatial generalization measured through manipulation.", grade: "B+", url: "https://arxiv.org/abs/2602.00743" }
              - { year: 2026, title: "SR-REAL", note: "Explicit 3D detection and language reasoning as complementary paths.", grade: "B+", url: "https://arxiv.org/abs/2606.17539" }

  - name: "Topic 2 · LLM interpretability"
    subtopics:
      - name: "Background: the object being interpreted"
        sections:
          - heading: "Overview"
            notes:
              - text: "Interpretability asks a question the benchmark cannot: not whether the model is right, but what computation produced the answer. The field is worth reading as a single argument, because every method below is constrained by one architectural fact — a transformer has no private memory. Every component reads from and writes to the same residual stream."
                display: "x_{l+1} = x_l + attn_l(x_l) + mlp_l(x_l)   — components communicate only by adding to one shared vector"
              - text: "Two consequences follow, and they organise the entire literature. Because the stream is additive, a hidden state is a sum of contributions that can be attributed to individual heads, neurons and layers. And because the unembedding W_U is applied to that same stream at the end, any intermediate state can be projected into vocabulary space and read as a distribution over tokens — the logit lens, and the reason so much of interpretability is legible at all."
              - text: "The unit of analysis is the axis along which this chapter is organised. One can interrogate the representation (probing, inspection), the component that wrote it (heads, MLPs, neurons), the feature it encodes (superposition, sparse autoencoders), or the subgraph that computes a behaviour end to end (circuits). Each unit turns out to be leakier than the one before it hoped."
              - text: "The organisation and reading lists here follow the Interpretability of Large Language Models course (0368.4264) at Tel Aviv University, developed by Mor Geva and Daniela Gottesman, which pairs each week's papers with a Colab exercise."
            papers:
              - { year: 2020, title: "Interpreting GPT: the logit lens", note: "Project any hidden state through W_U and read it as a next-token distribution.", grade: "A-", url: "https://www.lesswrong.com/posts/AcKRB8wDpdaN6v6ru/interpreting-gpt-the-logit-lens", featured: true }
              - { year: 2024, title: "The Quest for the Right Mediator", note: "A survey that puts causal interpretability on a common theoretical footing; read it to know what a “unit” buys you.", grade: "B+", url: "https://arxiv.org/abs/2408.01416" }

      - name: "Reading representations — probing and inspection"
        sections:
          - heading: "Probing: what is encoded"
            notes:
              - text: "The oldest method and still the entry point. Freeze the model, extract a hidden state, and fit a small supervised classifier from that state to some property — part of speech, syntax tree depth, the latitude of a city. If the probe succeeds, the property is linearly recoverable from the representation."
                display: "h_l  →  linear probe  →  property.   Probe accuracy is a claim about the representation, not about the model's behaviour."
              - text: "The structural probe is the elegant version: rather than classifying a label, it learns a linear transformation under which squared distance between word vectors reproduces the parse-tree distance between the words. Syntax is not a label read off a vector, it is a geometry the vector space already has. Space and Time then finds the same thing for the world — literal linear directions for latitude, longitude and date, with individual neurons that track them."
              - text: "The standard caveat is that a sufficiently expressive probe can learn the property rather than find it, so probe accuracy alone establishes correlation and nothing more. The subtler caveat comes from the bonus paper: not every feature is a direction. Some are irreducibly multi-dimensional — the days of the week live on a circle — and a linear probe that succeeds on them is measuring a projection of something it has mischaracterised."
            papers:
              - { year: 2019, title: "A Structural Probe for Finding Syntax in Word Representations", note: "Syntax as a geometry: a linear map under which vector distance is parse-tree distance.", grade: "A", url: "https://aclanthology.org/N19-1419/", featured: true }
              - { year: 2023, title: "Language Models Represent Space and Time", note: "Linear directions for place and date, plus neurons that read them.", grade: "A-", url: "https://arxiv.org/abs/2310.02207" }
              - { year: 2024, title: "Not All Language Model Features Are One-Dimensionally Linear", note: "Circular features for days and months; the linear-direction assumption has exceptions.", grade: "B+", url: "https://arxiv.org/abs/2405.14860" }

          - heading: "Inspecting representations: making the model explain itself"
            notes:
              - text: "A probe needs a labelled property, which means you can only look for what you already suspect. The alternative is to let the model decode its own states into natural language. Take a hidden state from one forward pass and paste it into a different prompt — an inspection prompt — and read what the model then generates."
                display: "patch h from a source run into a target prompt, then let the model talk: the continuation is the explanation"
              - text: "Patchscopes is the framework that shows the logit lens, activation patching and a dozen ad-hoc methods are all instances of this one operation, differing only in which prompt receives the state and whether the layer index is preserved. SelfIE and LatentQA push the same idea toward instruction following, training the model to answer questions about an injected activation."
              - text: "Language Model Inversion sharpens the security-flavoured corollary. The next-token distribution over a full vocabulary is a surprisingly high-bandwidth channel, and a trained inverter can recover a large fraction of the hidden system prompt from it. Representations do not merely encode the property you probed for; they encode the input, more completely than one would like."
            papers:
              - { year: 2024, title: "Patchscopes", note: "One framework — patch a state into an inspection prompt — that subsumes the logit lens and activation patching.", grade: "A", url: "https://arxiv.org/abs/2401.06102", featured: true, tags: ["★"] }
              - { year: 2023, title: "Language Model Inversion", note: "Recover the hidden prompt from the next-token distribution alone.", grade: "A-", url: "https://arxiv.org/abs/2311.13647" }
              - { year: 2024, title: "SelfIE: Self-Interpretation of LLM Embeddings", note: "Get the model to describe its own embeddings in words.", grade: "B+", url: "https://arxiv.org/abs/2403.10949" }
              - { year: 2024, title: "LatentQA", note: "Train a decoder to answer natural-language questions about activations.", grade: "B", url: "https://arxiv.org/abs/2412.08686" }

      - name: "Components — heads, MLPs, neurons"
        sections:
          - heading: "Attention heads"
            notes:
              - text: "A head is usually studied through its attention pattern on some input, which makes every claim about it input-dependent. The parameter-space view asks the harder question: what does this head do, before it sees any data? Multiply its OV matrix by the embedding and unembedding matrices and the result is a vocabulary-to-vocabulary map that can be read directly — this head copies, this one maps a country to its capital."
                display: "E · W_OV · W_U  →  a token-to-token map, computable from weights alone"
              - text: "Induction heads are the canonical finding and the one to internalise: a two-head circuit that, having seen the bigram [A][B] earlier in the context, attends from a later [A] back to the token that followed it and copies [B]. That pattern is the mechanistic substrate of in-context learning, and its formation is visible as a phase change in the loss curve."
              - text: "Talking Heads is the modern refinement. Heads do not just attend, they communicate: an early head writes into a low-rank subspace of the residual stream that a later head's query matrix reads out of, so the pair implements a composition neither performs alone. The residual stream is a shared bus, and its bandwidth is allocated in subspaces."
            papers:
              - { year: 2022, title: "In-context Learning and Induction Heads", note: "The circuit behind in-context learning, and the phase change that forms it.", grade: "A", url: "https://transformer-circuits.pub/2022/in-context-learning-and-induction-heads/index.html", featured: true, tags: ["★"] }
              - { year: 2024, title: "Inferring Functionality of Attention Heads from their Parameters", note: "Read a head's function off its weights, with no input at all.", grade: "A-", url: "https://arxiv.org/abs/2412.11965" }
              - { year: 2024, title: "Talking Heads: Inter-layer Communication", note: "Heads write to and read from low-rank subspaces of the residual stream.", grade: "A-", url: "https://arxiv.org/abs/2406.09519", featured: true }
              - { year: 2022, title: "Analyzing Transformers in Embedding Space", note: "Project every parameter matrix into vocabulary space and interpret it there.", grade: "B+", url: "https://arxiv.org/abs/2209.02535" }
              - { year: 2024, title: "Attention Heads of Large Language Models: A Survey", note: "A map of the named heads: induction, copy-suppression, name-mover, and the rest.", grade: "B", url: "https://arxiv.org/abs/2409.03752" }

          - heading: "MLP layers"
            notes:
              - text: "Two thirds of the parameters sit in the feed-forward blocks, and for years they were treated as an unstructured nonlinearity. Key-Value Memories is the paper that changed that, and it is the single most useful reframing in this chapter: the first weight matrix is a bank of pattern detectors, the second is a bank of vocabulary distributions, and the layer retrieves the second by matching the first."
                display: "FF(x) = f(x · K^T) · V   — K rows detect input patterns, V rows write distributions over tokens"
              - text: "The follow-up makes the output side concrete: each V row, projected through the unembedding, promotes a human-readable set of concepts, and the layer's output is a weighted sum of those promotions. An MLP is an additive edit to the model's next-token belief, which is why factual recall lives here."
              - text: "The recent turn is that a neuron is the wrong basis. Semi-nonnegative matrix factorisation decomposes MLP activations into features that respect the layer's structure — nonnegative activations, unconstrained directions — and recovers cleaner units than either raw neurons or a sparse autoencoder trained on the output, because it factorises the computation rather than the residual stream."
            papers:
              - { year: 2020, title: "Transformer Feed-Forward Layers Are Key-Value Memories", note: "The reframing the rest of the field is built on.", grade: "A", url: "https://arxiv.org/abs/2012.14913", featured: true, tags: ["★"] }
              - { year: 2022, title: "FF Layers Build Predictions by Promoting Concepts in Vocabulary Space", note: "The value side, read through the unembedding.", grade: "A-", url: "https://arxiv.org/abs/2203.14680" }
              - { year: 2025, title: "Decomposing MLP Activations via Semi-Nonnegative Matrix Factorization", note: "Factorise the computation, not the residual stream.", grade: "B+", url: "https://arxiv.org/abs/2506.10920" }
              - { year: 2024, title: "Interpreting Context Look-ups: Attention–MLP Interactions", note: "How the two component types compose on a real task.", grade: "B", url: "https://arxiv.org/abs/2402.15055" }

          - heading: "Neurons — are they the right unit?"
            notes:
              - text: "The neuron is the obvious unit and the wrong one. Sparse probing over a large neuron set finds genuinely monosemantic neurons — a French-language neuron, a base-64 neuron — but it also finds that most concepts are spread across many neurons and most neurons fire for several unrelated concepts. That is polysemanticity, and it is not a training defect. It is what a model does when it needs to represent more features than it has dimensions."
                display: "n features ≫ d dimensions  ⇒  features stored as almost-orthogonal directions, not as axes: superposition"
              - text: "Confidence Regulation Neurons is the best existence proof that some neurons are nonetheless real and mechanistically legible: entropy neurons that write into the null space of the unembedding, changing the softmax temperature without touching the ranking, and token-frequency neurons that shift toward the unigram prior when the model is uncertain. They regulate confidence rather than content."
              - text: "The two cautionary papers are worth the time. The BERT interpretability illusion shows that a direction which looks monosemantic on one dataset is polysemantic across datasets — the coherence was in the data, not the neuron. And Dead, N-gram, Positional finds that a large fraction of neurons in a trained model never activate at all."
            papers:
              - { year: 2023, title: "Finding Neurons in a Haystack: Sparse Probing", note: "Monosemantic neurons exist; superposition is the norm.", grade: "A-", url: "https://arxiv.org/abs/2305.01610", featured: true }
              - { year: 2024, title: "Confidence Regulation Neurons", note: "Entropy neurons act on the null space of W_U: temperature, not ranking.", grade: "A-", url: "https://arxiv.org/abs/2406.16254" }
              - { year: 2021, title: "An Interpretability Illusion for BERT", note: "Monosemanticity that is an artefact of the probing dataset.", grade: "B+", url: "https://arxiv.org/abs/2104.07143" }
              - { year: 2023, title: "Neurons in LLMs: Dead, N-gram, Positional", note: "A census of what neurons actually do; many do nothing.", grade: "B", url: "https://arxiv.org/abs/2309.04827" }

      - name: "Features — superposition, sparse autoencoders, descriptions"
        sections:
          - heading: "Feature representations"
            notes:
              - text: "If features are directions and there are more of them than dimensions, then the right unit is neither the neuron nor the layer but the overcomplete dictionary the model is implicitly using. Train a sparse autoencoder on the residual stream — encode to a much wider space, force sparsity, decode back — and the dictionary elements are the features."
                display: "h ≈ Σ_i a_i(h) · d_i,   a sparse, non-negative, and dim(d) ≫ dim(h)"
              - text: "The 2023 SAE paper is where this stopped being theory. Its features are more monosemantic than neurons by automated and human evaluation, and — the load-bearing result — they are causally usable: ablating a feature changes exactly the behaviour its description predicts."
              - text: "The geometry papers ask what structure the dictionary has. The Linear Representation Hypothesis gives the formal statement, using a causal inner product under which unrelated concepts are genuinely orthogonal. Categorical and Hierarchical Concepts then finds that hierarchy is geometry: a categorical concept like {mammal, bird, fish} is a simplex, and “is-a” relations between a parent and its children appear as orthogonality between the parent direction and the child simplex. Transcoders extend the machinery from the stream to the MLP, which is what makes feature-level circuits tractable."
            papers:
              - { year: 2023, title: "Sparse Autoencoders Find Highly Interpretable Features", note: "The paper that made SAEs the default unit; features are causally usable, not just legible.", grade: "A", url: "https://arxiv.org/abs/2309.08600", featured: true, tags: ["★"] }
              - { year: 2024, title: "The Geometry of Categorical and Hierarchical Concepts", note: "Hierarchy is orthogonality; categories are simplices.", grade: "A-", url: "https://arxiv.org/abs/2406.01506" }
              - { year: 2023, title: "The Linear Representation Hypothesis and the Geometry of LLMs", note: "The causal inner product that makes “direction” well defined.", grade: "A-", url: "https://arxiv.org/abs/2311.03658" }
              - { year: 2024, title: "Transcoders Find Interpretable LLM Feature Circuits", note: "Sparse dictionaries for the MLP, so circuits can be drawn over features.", grade: "B+", url: "https://arxiv.org/abs/2406.11944" }

          - heading: "Describing features"
            notes:
              - text: "A dictionary of thirty million features is not an explanation until each one has a name, and only a language model can afford to write them. The pipeline is the same everywhere: collect the inputs that activate a feature most strongly, ask an LLM to describe what they share, then score the description by whether a second model can use it to predict activations it has not seen."
              - text: "Automatically Interpreting Millions of Features is the scaled, open version, and it is honest about the cost and the failure rate. The important critique is Output-Centric Feature Descriptions: describing a feature by what activates it is only half the story, and often the less useful half. A feature is a term in a sum that ends at the unembedding, so what it does to the output — which tokens it promotes when you steer with it — is frequently a better description than what turns it on. The two views disagree more often than the field assumed."
              - text: "Rigorously Assessing Natural Language Explanations supplies the evaluation discipline, distinguishing a description that merely correlates with activation from one that supports intervention. And SAEs Are Good for Steering closes the loop: the features work, provided you select them by their causal effect rather than by the plausibility of their description."
            papers:
              - { year: 2024, title: "Automatically Interpreting Millions of Features in LLMs", note: "The auto-interpretability pipeline at scale, with its failure rate reported.", grade: "A-", url: "https://arxiv.org/abs/2410.13928" }
              - { year: 2025, title: "Enhancing Automated Interpretability with Output-Centric Feature Descriptions", note: "Describe a feature by what it promotes, not only by what activates it.", grade: "A-", url: "https://arxiv.org/abs/2501.08319", featured: true }
              - { year: 2023, title: "Language models can explain neurons in language models", note: "The original OpenAI auto-interp result.", grade: "B+", url: "https://openai.com/index/language-models-can-explain-neurons-in-language-models/" }
              - { year: 2023, title: "Rigorously Assessing Natural Language Explanations of Neurons", note: "Correlational description vs causal claim; how to tell them apart.", grade: "B+", url: "https://arxiv.org/abs/2309.10312" }
              - { year: 2025, title: "SAEs Are Good for Steering — If You Select the Right Features", note: "Select by causal effect, not by how good the description reads.", grade: "B", url: "https://arxiv.org/abs/2505.20063" }

      - name: "Mechanisms — circuits, binding, factual recall"
        sections:
          - heading: "Circuit discovery"
            notes:
              - text: "A circuit is the subgraph of components that suffices to compute one behaviour. The method that finds it is causal rather than correlational: run the model on a clean prompt and a corrupted one, then patch activations from one run into the other and measure what the output does. A component whose patch restores the behaviour is in the circuit."
                display: "clean run − corrupted run, patch component c:  Δ logit ⇒ c is causally responsible"
              - text: "Indirect Object Identification is the worked example everybody starts from — twenty-six heads in GPT-2 small, organised into duplicate-token heads, S-inhibition heads and name-mover heads, with a copy-suppression mechanism nobody predicted. It is also the paper that revealed how much labour this costs, which is why ACDC and its position-aware successor try to automate the search."
              - text: "Have Faith in Faithfulness is the necessary corrective. Two circuits found by different methods can overlap heavily in components and still implement different mechanisms, so component overlap is the wrong metric; what must be checked is whether the circuit alone, ablated from everything else, still reproduces the behaviour. Circuit Component Reuse is the encouraging counterpart: the same components are recruited across tasks, so the inventory of mechanisms may be far smaller than the inventory of behaviours."
            papers:
              - { year: 2022, title: "Interpretability in the Wild: a Circuit for IOI in GPT-2 small", note: "The canonical end-to-end circuit, copy-suppression and all.", grade: "A", url: "https://arxiv.org/abs/2211.00593", featured: true, tags: ["★"] }
              - { year: 2024, title: "Have Faith in Faithfulness", note: "Component overlap is not mechanism identity. The methodological check.", grade: "A-", url: "https://arxiv.org/abs/2403.17806", featured: true }
              - { year: 2023, title: "Towards Automated Circuit Discovery (ACDC)", note: "Automating the patch-and-prune search.", grade: "B+", url: "https://arxiv.org/abs/2304.14997" }
              - { year: 2025, title: "Position-aware Automatic Circuit Discovery", note: "Circuits that respect token position, not just component identity.", grade: "B", url: "https://arxiv.org/abs/2502.04577" }
              - { year: 2023, title: "Circuit Component Reuse Across Tasks", note: "The same heads, recruited by different behaviours.", grade: "B+", url: "https://arxiv.org/abs/2310.08744" }

          - heading: "Binding mechanisms"
            notes:
              - text: "“Alice is in the kitchen, Bob is in the garden. Where is Bob?” Answering requires the model to keep two entity–attribute pairs distinct, which is the variable-binding problem that symbolic architectures got for free and connectionist ones never did."
              - text: "The answer is geometric and slightly startling. The model assigns each entity–attribute pair a shared binding ID — a direction added to both the entity's and the attribute's representation — and the pairs are recovered by matching IDs. The IDs behave like abstract, position-independent variables: swap them and the model swaps its answer; interpolate between them and it interpolates."
                display: "bind(Alice, kitchen) ≈ add the same binding vector to both;  retrieval = match on that vector"
              - text: "Lookbacks generalises this to belief tracking, where an entity's state changes over the context and the model must return a pointer to the most recent binding rather than to the first. Mixing Mechanisms then complicates the picture usefully: binding is not one mechanism but several — positional, lexical, and reflexive — running in parallel and mixed by context."
            papers:
              - { year: 2023, title: "How do Language Models Bind Entities in Context?", note: "Binding IDs: an abstract variable implemented as a shared direction.", grade: "A", url: "https://arxiv.org/abs/2310.17191", featured: true }
              - { year: 2025, title: "Language Models use Lookbacks to Track Beliefs", note: "Pointers to the latest binding; belief tracking as a mechanism.", grade: "A-", url: "https://arxiv.org/abs/2505.14685" }
              - { year: 2025, title: "Mixing Mechanisms: How LMs Retrieve Bound Entities In-Context", note: "Several binding mechanisms coexist and are mixed by context.", grade: "B+", url: "https://arxiv.org/abs/2510.06182" }
              - { year: 2024, title: "Monitoring Latent World States with Propositional Probes", note: "Read the bound propositions out of the activations.", grade: "B", url: "https://arxiv.org/abs/2406.19501" }
              - { year: 2024, title: "Fine-Tuning Enhances Existing Mechanisms: Entity Tracking", note: "Fine-tuning sharpens the circuit that was already there rather than building a new one.", grade: "B+", url: "https://arxiv.org/abs/2402.14811" }

          - heading: "Factual knowledge recall and editing"
            notes:
              - text: "ROME is the paper that made interpretability actionable. Causal tracing localises a fact to mid-layer MLPs at the subject's last token; treating that MLP as the key-value memory of the earlier section, one can then solve in closed form for the rank-one weight update that maps the subject key to a new value — and the Eiffel Tower is in Rome."
                display: "locate with causal tracing → edit with a rank-one update to W_V at the located layer"
              - text: "Dissecting Recall gives the full pipeline that ROME's localisation hints at: early layers enrich the subject token with its attributes, an MLP encodes the relation, and an attention head at the last position extracts the attribute the relation selects. Linearity of Relation Decoding shows that many relations are, to good approximation, a single affine map from subject to object — which is why a rank-one edit works at all."
              - text: "Then read Does Localization Inform Editing? last, and read it carefully. Causal tracing tells you where a fact is stored, editing tells you where a fact can be changed, and the paper's uncomfortable finding is that these two locations are barely correlated. An edit at a layer causal tracing never implicates works just as well. The success of ROME is not evidence that its localisation was correct."
            papers:
              - { year: 2022, title: "Locating and Editing Factual Associations in GPT (ROME)", note: "Causal tracing plus a rank-one edit. The field's most cited demonstration.", grade: "A", url: "https://arxiv.org/abs/2202.05262", featured: true, tags: ["★"] }
              - { year: 2023, title: "Dissecting Recall of Factual Associations", note: "Subject enrichment → relation in the MLP → extraction by a head.", grade: "A", url: "https://arxiv.org/abs/2304.14767", featured: true }
              - { year: 2023, title: "Does Localization Inform Editing?", note: "Where a fact is stored and where it can be edited are barely correlated. Read last.", grade: "A-", url: "https://arxiv.org/abs/2301.04213", featured: true }
              - { year: 2023, title: "Linearity of Relation Decoding in Transformer LMs", note: "Many relations are an affine map — which is why rank-one editing works.", grade: "B+", url: "https://arxiv.org/abs/2308.09124" }
              - { year: 2023, title: "Characterizing Mechanisms for Factual Recall", note: "When the model prefers the context over its weights, and why.", grade: "B+", url: "https://arxiv.org/abs/2310.15910" }

      - name: "Training dynamics — where mechanisms come from"
        sections:
          - heading: "Circuits over training time and scale"
            notes:
              - text: "Everything above interprets a finished checkpoint. The last question is whether any of it is stable — whether a circuit found in GPT-2 small says anything about a model a hundred times larger, or about the same model ten thousand steps earlier."
              - text: "The answer is more encouraging than one would guess. Circuit analyses are broadly consistent across training and scale: the algorithm a circuit implements, and the order in which its components acquire their roles, are preserved even as the specific heads that fill each role are reshuffled. Task-relevant behaviours emerge at similar token counts across model sizes."
              - text: "What needs to go right for an induction head is the mechanistic zoom-in on a single such emergence. The phase change in the loss curve is the visible tip of three subcircuits — a previous-token head, a matching operation, and a copy operation — that must form in the right order, and the paper shows the interaction is genuinely non-additive: the head appears when the last piece lands, not gradually. Linear Representations and Pretraining Data Frequency completes the arc back to probing: a concept becomes linearly represented once its co-occurrence count in the pretraining corpus crosses a threshold. The geometry the first section measured is a fossil of the data distribution."
            papers:
              - { year: 2024, title: "LLM Circuit Analyses Are Consistent Across Training and Scale", note: "The algorithm persists; which heads implement it does not.", grade: "A-", url: "https://arxiv.org/abs/2407.10827", featured: true }
              - { year: 2024, title: "What needs to go right for an induction head?", note: "The phase change, decomposed into the three subcircuits that must co-form.", grade: "A-", url: "https://arxiv.org/abs/2404.07129" }
              - { year: 2025, title: "On Linear Representations and Pretraining Data Frequency", note: "Linear structure appears once co-occurrence frequency crosses a threshold.", grade: "B+", url: "https://arxiv.org/abs/2504.12459" }

  - name: "Topic 3 · World models"
    intro: >
      “World model” now labels several different objects: a video generator that renders
      plausible scenes, a simulator that predicts how actions change state, and a planner
      that chooses those actions. This chapter uses a stricter test. A world model should
      represent the current situation, answer counterfactual questions about interventions,
      and make those answers useful for control. Photorealism can help, but it is not the contract.
    subtopics:
      - name: "What is being modeled?"
        sections:
          - heading: "The control loop, not the pixels"
            notes:
              - text: "In a partially observed environment, pixels are observations rather than state. A useful model compresses observation history into a belief state and predicts how an action changes that state:"
                display: "zₜ = e(o≤ₜ),      pθ(zₜ₊₁, rₜ, cₜ | zₜ, aₜ)"
              - text: "The renderer–simulator–planner distinction is more than vocabulary. A renderer needs perceptual fidelity, a simulator needs structural and intervention fidelity, and a planner needs predictions that preserve the ranking of actions. One system may implement all three, but success at one does not establish the others."
              - text: "A model need not reconstruct the whole world. Its representation should retain distinctions that change the optimal action and discard nuisance detail that does not. The downstream decision defines the useful boundary."
              - text: "The definition is falsifiable: vary the action while holding context fixed, test whether consequences change correctly, and then measure whether planning with those predictions improves closed-loop behavior."
            image: "/assets/img/reading_list/world_model_loop.svg"
            image_width: 860
            image_alt: "A world-model loop in which observations become a latent state, action-conditioned dynamics predict a next state, and a policy chooses actions from imagined consequences."
            image_caption: "Prediction becomes a world model when action-conditioned counterfactuals close a useful control loop."
            papers:
              - { year: 2026, title: "A Functional Taxonomy of World Models", note: "A recent antidote to calling every video generator a simulator; organized by function rather than model family.", grade: "A", url: "https://www.worldlabs.ai/blog/taxonomy-of-world-models", featured: true, tags: ["★"] }
              - { year: 2018, title: "World Models", note: "The compact seminal demonstration of an agent learning and acting inside latent rollouts.", grade: "B+", url: "https://arxiv.org/abs/1803.10122" }
              - { year: 2023, title: "DreamerV3", note: "Representation learning, latent dynamics, and policy learning operating as one system.", grade: "A", url: "https://arxiv.org/abs/2301.04104", featured: true, tags: ["★"] }
              - { year: 2023, title: "TD-MPC2", note: "Task-oriented latent simulation plus online replanning across a broad control suite.", grade: "A", url: "https://arxiv.org/abs/2310.16828", featured: true }
              - { year: 2025, title: "V-JEPA 2", note: "Predictive representations learned mostly without actions become useful for planning after limited action-conditioned data.", grade: "A-", url: "https://arxiv.org/abs/2506.09985" }

          - heading: "Learn a state worth predicting"
            notes:
              - text: "Pixel reconstruction is attractive but often misaligned with control. It spends capacity on texture, lighting, and other hard-to-predict details even when those details do not change an action. Reconstruction-free objectives try to preserve predictable, decision-relevant structure instead."
              - text: "A JEPA predicts a future representation rather than a future frame. That can remove visual nuisance, but creates a compression–controllability trade: a feature may be excellent for recognition while merging states that require different actions."
                display: "L_JEPA = ‖gθ(e(o≤ₜ), aₜ:ₜ₊H) − stopgrad(e_target(oₜ₊H))‖²"
              - text: "Deterministic predictors also average mutually exclusive futures. A probabilistic latent state should preserve uncertainty where it changes decisions rather than merely rendering a blurry mean."
              - text: "Judge a latent state by prediction and planning under interventions, not only reconstruction loss or feature similarity. The representation’s job is to keep exactly the distinctions a policy will need."
            papers:
              - { year: 2024, title: "MuDreamer", note: "Challenges the assumption that visual reconstruction is necessary under distracting observations.", grade: "B+", url: "https://arxiv.org/abs/2405.15083" }
              - { year: 2024, title: "DINO-WM", note: "Predicting spatial foundation-model features as a middle ground between pixels and tiny task states.", grade: "A-", url: "https://arxiv.org/abs/2411.04983" }
              - { year: 2025, title: "V-JEPA 2", note: "The strongest current case for representation-space future prediction as a base for physical reasoning.", grade: "A", url: "https://arxiv.org/abs/2506.09985", featured: true, tags: ["★"] }
              - { year: 2025, title: "World-in-World", note: "Closed-loop evidence that representation and dynamics should be judged by action-conditioned task success.", grade: "A-", url: "https://arxiv.org/abs/2510.18135" }

      - name: "Planning in imagination"
        sections:
          - heading: "Dreamer and MPC solve different halves"
            notes:
              - text: "Dreamer amortizes planning into a policy. It rolls the learned model forward, trains an actor and critic on imagined trajectories, and acts cheaply at deployment. This is efficient when the task distribution is stable, but the policy inherits model errors accumulated during training."
              - text: "Model-predictive control instead optimizes a short action sequence at decision time, executes only the first action, then replans after the next observation:"
                display: "a*ₜ:ₜ₊H = argmaxₐ E_pθ[ Σₖ₌₀ᴴ γᵏ r(zₜ₊ₖ, aₜ₊ₖ) ]"
              - text: "The receding horizon repeatedly anchors imagination to reality and limits compounding error. It costs more inference compute but can adapt to a new goal without retraining; a learned policy moves that cost into training."
              - text: "Planning depends more on preserving the ordering of candidate actions than on exact long-horizon pixels. A consistently biased simulator can remain useful; a beautiful simulator that reverses two candidates is actively harmful."
            papers:
              - { year: 2023, title: "DreamerV3", note: "The canonical example of learning behavior largely from imagined experience.", grade: "A", url: "https://arxiv.org/abs/2301.04104", featured: true, tags: ["★"] }
              - { year: 2023, title: "TD-MPC2", note: "The complementary case for short-horizon latent planning and continual replanning.", grade: "A", url: "https://arxiv.org/abs/2310.16828", featured: true }
              - { year: 2024, title: "DINO-WM", note: "Uses a learned representation for zero-shot planning without a learned reward model.", grade: "A-", url: "https://arxiv.org/abs/2411.04983" }
              - { year: 2025, title: "V-JEPA 2", note: "Connects passive-video pretraining to action-conditioned model-predictive control.", grade: "A-", url: "https://arxiv.org/abs/2506.09985" }
              - { year: 2025, title: "World-in-World", note: "Controllability and rollout compute predict success better than conventional video quality.", grade: "A", url: "https://arxiv.org/abs/2510.18135", featured: true }

      - name: "Foundation world models"
        sections:
          - heading: "Passive video does not come with action labels"
            notes:
              - text: "Internet video offers scale but rarely records the action that caused each transition. A latent-action model infers a compact control variable between frames and learns future observations conditioned on it, hoping to discover reusable interaction primitives without annotation."
              - text: "The weakness is identifiability. Camera motion, object motion, editing, and intention can explain the same change. An inferred action is therefore a useful modeling convention, not necessarily the physical control that generated a scene."
              - text: "Genie’s progression captures the ambition: learn controllable 2D environments from unlabeled video, extend to interactive 3D generation, then improve persistence and real-time response. The missing result is reliable agent transfer, not a more compelling human demo."
              - text: "The action symbol carries most of the scientific burden. If changing a does not reliably produce the correct counterfactual future, the system remains a conditional renderer rather than a simulator."
                display: "pθ(oₜ₊₁:ₜ₊H | o≤ₜ, aₜ:ₜ₊H)"
            papers:
              - { year: 2024, title: "Genie: Generative Interactive Environments", note: "Learns latent actions and controllable transitions from action-free video.", grade: "A-", url: "https://arxiv.org/abs/2402.15391", featured: true, tags: ["★"] }
              - { year: 2024, title: "Genie 2", note: "A striking extension to interactive 3D worlds; public evidence is stronger on generation than agent transfer.", grade: "B+", url: "https://deepmind.google/blog/genie-2-a-large-scale-foundation-world-model/" }
              - { year: 2025, title: "Genie 3", note: "Real-time, longer-lived worlds are genuine progress, not yet proof of reliable physical simulation.", grade: "B+", url: "https://deepmind.google/blog/genie-3-a-new-frontier-for-world-models/" }
              - { year: 2025, title: "V-JEPA 2", note: "A less rendering-centric route from passive video to action-conditioned prediction.", grade: "A", url: "https://arxiv.org/abs/2506.09985", featured: true }
              - { year: 2026, title: "Cosmos 3", note: "An ambitious open omnimodal backbone for physical AI whose assets permit scrutiny beyond a demo reel.", grade: "A-", url: "https://arxiv.org/abs/2606.02800" }

      - name: "Physical AI and synthetic experience"
        sections:
          - heading: "Counterfactual coverage is useful only when consequences are faithful"
            notes:
              - text: "Robotics and autonomous driving are natural applications because real failures are expensive and rare events are missing precisely where a policy needs experience. A generative model can vary weather, geometry, agents, and sensor streams to fill that tail."
              - text: "Synthetic experience helps only when simulator mistakes are less consequential than missing data. A world that softens collisions, simplifies grasping, or repairs impossible states creates optimistic policy estimates."
              - text: "Policy evaluation in a learned world is a ranking problem under distribution shift. Current work suggests rankings may remain useful in familiar regimes while absolute success estimates—and unfamiliar actions—are much less trustworthy."
              - text: "The defensible pattern is layered: use learned worlds for exploration and regression testing, reserve real trials or trusted simulation for calibration, and actively search for cases where learned dynamics and reality disagree."
            papers:
              - { year: 2025, title: "Evaluating Robot Policies in a World Model", note: "Reports both useful policy ranking and characteristic optimism on unfamiliar actions.", grade: "A-", url: "https://arxiv.org/abs/2506.00613", featured: true, tags: ["★"] }
              - { year: 2026, title: "Cosmos 3", note: "A broad physical-AI platform whose openness makes its claims more scientifically useful.", grade: "A-", url: "https://arxiv.org/abs/2606.02800" }
              - { year: 2026, title: "The Waymo World Model", note: "Rare-scenario generation is a natural application; a company demo is not public safety validation.", grade: "B", url: "https://waymo.com/blog/2026/02/the-waymo-world-model-a-new-frontier-for-autonomous-driving-simulation/" }
              - { year: 2026, title: "dWorldEval", note: "Action-first evaluation exposes generated videos that visually repair a policy mistake.", grade: "B+", url: "https://arxiv.org/abs/2604.22152" }
              - { year: 2024, title: "ACT-Bench", note: "Strong-looking driving videos can still fail to obey the requested trajectory.", grade: "A-", url: "https://arxiv.org/abs/2412.05337" }

      - name: "Evaluation — realism is not dynamics"
        sections:
          - heading: "Measure the contract in layers"
            notes:
              - text: "Frame-quality metrics reward texture and appearance but are insensitive to whether objects obey contact, conservation, or a requested action. Models can improve perceptually while remaining unreliable for control."
              - text: "Evaluation should move through layers: perceptual quality, temporal consistency, physical or structural validity, action fidelity, and finally closed-loop task success. Collapsing them into one score hides the failure that matters."
              - text: "Open-loop evaluation can be accidentally gamed. A generator may produce a plausible recovery after an impossible action, making the video coherent while returning a false positive for the policy being tested."
              - text: "The strongest recent result is that improving the action-conditioned stage can matter more than replacing the underlying video generator. Better visual priors help, but controllability is often the true bottleneck."
            papers:
              - { year: 2025, title: "World-in-World", note: "The strongest current evidence that video quality is a poor proxy for closed-loop utility.", grade: "A", url: "https://arxiv.org/abs/2510.18135", featured: true, tags: ["★"] }
              - { year: 2025, title: "Evaluating Robot Policies in a World Model", note: "Gives world-model policy-evaluation error a direction, not only an aggregate correlation.", grade: "A-", url: "https://arxiv.org/abs/2506.00613", featured: true }
              - { year: 2026, title: "dWorldEval", note: "Makes the proposed action explicit and checks whether consequences remain faithful.", grade: "B+", url: "https://arxiv.org/abs/2604.22152" }
              - { year: 2024, title: "ACT-Bench", note: "A focused demonstration that action compliance deserves its own metric.", grade: "A-", url: "https://arxiv.org/abs/2412.05337" }
              - { year: 2025, title: "WorldModelBench", note: "Broad coverage of instruction and physics violations, one layer below closed-loop success.", grade: "B+", url: "https://arxiv.org/abs/2502.20694" }

  - name: "Topic 4 · Diffusion LLMs"
    intro: >
      Autoregressive models make one irreversible local decision at a time. Diffusion
      language models begin with an uncertain sequence and repeatedly reveal or revise it.
      That creates genuine options—parallel token proposals, flexible order, and correction—
      while giving up conveniences on which modern LLM systems rely: a unique left-to-right
      likelihood, a mature KV cache, and a simple RL trajectory. The useful question is not
      whether diffusion wins in the abstract, but which factorization wins at a particular
      point on the quality, latency, compute, and controllability frontier.
    subtopics:
      - name: "From masking to a generative model"
        sections:
          - heading: "Masked diffusion is generative masked-language modeling"
            notes:
              - text: "In absorbing-state diffusion, each clean token survives with probability αₜ and otherwise becomes a mask. Increasing t erases information until the sequence is almost entirely blank:"
                display: "q(zₜⁱ | xᵢ) = αₜ 1[zₜⁱ = xᵢ] + (1 − αₜ) 1[zₜⁱ = MASK]"
              - text: "The reverse model sees a partially masked sequence and predicts every missing original token. Training resembles masked-language modeling, but it spans all noise levels and defines a consistent path from complete uncertainty to a complete sample."
                display: "L_MDLM = Eₜ,x,zₜ [ w(t) Σᵢ:zₜⁱ=MASK −log pθ(xᵢ | zₜ, t) ]"
              - text: "Sampling starts from masks, predicts all blank positions, commits some tokens, and repeats. Bidirectional context is the conceptual advantage: a token may use decisions on both sides. The price is that each pass attends over much more sequence than one cached autoregressive step."
              - text: "Ordinary BERT filling is therefore the right intuition but the wrong endpoint. What makes the system generative is the learned family of denoisers and a sampler that traverses noise levels."
            image: "/assets/img/reading_list/diffusion_generation.svg"
            image_width: 860
            image_alt: "Autoregressive generation commits one token per serial step, while masked diffusion repeatedly updates a block of uncertain positions."
            image_caption: "Parallel proposals reduce serial decisions; they do not automatically reduce total computation or wall-clock latency."
            papers:
              - { year: 2021, title: "Structured Denoising Diffusion Models in Discrete State-Spaces", note: "The discrete-diffusion foundation; important, though not the easiest first read.", grade: "B+", url: "https://arxiv.org/abs/2107.03006" }
              - { year: 2023, title: "SEDD", note: "Replaces awkward reverse probabilities with a score-entropy objective.", grade: "A-", url: "https://arxiv.org/abs/2310.16834" }
              - { year: 2024, title: "Simple and Effective Masked Diffusion Language Models", note: "The core masked-diffusion derivation and best technical starting paper.", grade: "A", url: "https://arxiv.org/abs/2406.07524", featured: true, tags: ["★"] }
              - { year: 2025, title: "LLaDA", note: "A broadly convincing open demonstration that masked diffusion scales to an 8B general language model.", grade: "A-", url: "https://arxiv.org/abs/2502.09992", featured: true }
              - { year: 2026, title: "How to Build a Diffusion Language Model", note: "The best current engineering map from the forward process to architecture, sampling, and post-training.", grade: "A", url: "https://kuleshov-group.github.io/blog/blog/2026/how-to-build-a-diffusion-language-model/", featured: true, tags: ["★"] }

          - heading: "Masks, random corruption, and remasking"
            notes:
              - text: "Absorbing masks identify exactly which positions are uncertain. That makes the target clean and efficient, but a revealed token is usually treated as final; sampling needs explicit remasking to reopen an early mistake."
              - text: "Uniform diffusion replaces tokens with random vocabulary items. Every location may remain uncertain and can be corrected naturally, but the network cannot tell whether a plausible-looking token is clean or corrupted."
                display: "q(zₜⁱ | xᵢ) = αₜ δ(xᵢ) + (1 − αₜ) Uniform(V)"
              - text: "The choice changes posterior parameterization, sampler stability, guidance, distillation, and cache approximations. “Diffusion LLM” is not one algorithm with one scaling curve."
              - text: "Remasking narrows the practical gap: confidence or a learned policy can reopen questionable tokens, gaining inference-time correction without adopting random-token corruption everywhere."
            papers:
              - { year: 2024, title: "Simple and Effective Masked Diffusion Language Models", note: "The reference for why absorbing masks yield a simple objective.", grade: "A", url: "https://arxiv.org/abs/2406.07524", featured: true }
              - { year: 2025, title: "ReMDM: Remasking Discrete Diffusion Models", note: "Exposes irreversible commitment as a sampler choice.", grade: "A-", url: "https://arxiv.org/abs/2503.00307" }
              - { year: 2024, title: "Simple Guidance Mechanisms for Discrete Diffusion Models", note: "A compact account of conditional control in discrete denoising.", grade: "A-", url: "https://arxiv.org/abs/2412.10193" }
              - { year: 2025, title: "The Diffusion Duality", note: "A uniform-diffusion counterpoint and route toward few-step consistency generation.", grade: "A-", url: "https://arxiv.org/abs/2506.10892" }
              - { year: 2026, title: "Scaling Beyond Masked Diffusion Language Models", note: "The paper to read before claiming that one noise process is categorically superior.", grade: "A", url: "https://arxiv.org/abs/2602.15014", featured: true, tags: ["★"] }

      - name: "Building a usable diffusion LLM"
        sections:
          - heading: "Blocks are the practical compromise"
            notes:
              - text: "Full-sequence diffusion does not naturally know the response length. Padding to a fixed canvas wastes compute, while pure autoregression handles length elegantly but gives up parallel denoising."
              - text: "Block diffusion factorizes autoregressively across blocks and diffuses inside the active block. A one-token block recovers autoregression; a sequence-sized block recovers full diffusion, making block size a systems knob rather than an ideological choice."
                display: "p(x₁:L) = ∏ᵦ pθ(x_Bᵦ | x_B<ᵦ)"
              - text: "Completed blocks can use a KV cache while unresolved positions attend bidirectionally inside the current block. This restores length flexibility and much of the serving infrastructure that full diffusion discards."
              - text: "The compromise limits correction: tokens may be revised inside the active block but become fixed context after the frontier advances. Large blocks buy parallelism and reconsideration; small blocks reduce work and stabilize long-form generation."
            papers:
              - { year: 2025, title: "Block Diffusion", note: "The clearest bridge between diffusion parallelism and autoregressive serving.", grade: "A", url: "https://arxiv.org/abs/2503.09573", featured: true, tags: ["★"] }
              - { year: 2025, title: "LLaDA", note: "The full-sequence scaled baseline against which blockwise compromises should be read.", grade: "A-", url: "https://arxiv.org/abs/2502.09992" }
              - { year: 2025, title: "Dream 7B", note: "A scaled recipe combining autoregressive initialization with adaptive corruption.", grade: "A-", url: "https://arxiv.org/abs/2508.15487" }
              - { year: 2026, title: "DiffusionGemma Model Card", note: "Its block architecture and explicit quality caveats make it unusually useful production evidence.", grade: "B+", url: "https://ai.google.dev/gemma/docs/diffusiongemma/model_card" }
              - { year: 2026, title: "Nemotron Labs Diffusion", note: "A tri-mode model supporting autoregressive, diffusion, and speculative hybrid operation.", grade: "A-", url: "https://research.nvidia.com/publication/2026-05_nemotron-labs-diffusion-tri-mode-language-model-unifying-autoregressive" }

          - heading: "Parallel tokens per pass are not tokens per second"
            notes:
              - text: "If S denoising passes produce L tokens, the sampler appears to generate L/S useful tokens per pass. That is algorithmically meaningful, but a pass over a bidirectional block is far more expensive than one cached autoregressive step."
                display: "latency ≈ S × cost(one full-sequence or active-block pass)"
              - text: "A credible speed comparison must hold model size, hardware, precision, context, output length, batch, cache policy, and output quality reasonably fixed. Removing steps can improve latency while deleting the reasoning tokens a benchmark rewards."
              - text: "KV caching is hard because unresolved tokens change between iterations and invalidate states that attended to them. Approximate caches can work when representations move slowly, but error may accumulate or interact with remasking."
              - text: "Distillation attacks the other side by learning a few larger denoising transitions. The plausible endpoint is a useful quality–throughput frontier, not universally one-step generation."
            papers:
              - { year: 2026, title: "Scaling Beyond Masked Diffusion Language Models", note: "The most careful compute study: different objectives win different parts of the speed–quality frontier.", grade: "A", url: "https://arxiv.org/abs/2602.15014", featured: true, tags: ["★"] }
              - { year: 2025, title: "The Diffusion Duality", note: "Makes few-step consistency generation concrete.", grade: "A-", url: "https://arxiv.org/abs/2506.10892" }
              - { year: 2025, title: "Fast-dLLM", note: "Combines approximate KV caching with more aggressive parallel decoding.", grade: "B+", url: "https://arxiv.org/abs/2505.22618" }
              - { year: 2025, title: "dKV-Cache", note: "Focused systems work on cache invalidation across denoising steps.", grade: "B", url: "https://arxiv.org/abs/2505.15781" }
              - { year: 2025, title: "Mercury", note: "Important throughput evidence for diffusion coding models; quality parity remains comparison-dependent.", grade: "B+", url: "https://arxiv.org/abs/2506.17298" }

      - name: "Post-training and reasoning"
        sections:
          - heading: "Likelihood is the hard part"
            notes:
              - text: "Autoregression gives a response one left-to-right factorization. Diffusion can reach the same response through many reveal, corruption, and remasking trajectories, so “the probability of this answer” involves a combinatorial latent path."
              - text: "Supervised tuning remains straightforward: corrupt target responses and train the denoising objective while conditioning on prompts. Preference optimization and RL are harder because a policy ratio or advantage must be assigned to denoising actions with ambiguous final contribution."
              - text: "Current methods use masked supervised losses, approximate trajectory likelihoods, or estimators sampling pieces of the reverse process. Estimator bias and variance are part of the algorithm, not incidental implementation noise."
              - text: "Guidance offers simpler conditional control by mixing conditional and unconditional reverse predictions. It can strengthen adherence before full RL, although too much guidance reduces diversity and can amplify model mistakes."
                display: "log pγ(zₛ | zₜ, y) = γ log p(zₛ | zₜ, y) + (1 − γ) log p(zₛ | zₜ) + C"
            papers:
              - { year: 2025, title: "d1: Scaling Reasoning in Diffusion LLMs via Reinforcement Learning", note: "The first persuasive diffusion-specific RL reasoning result.", grade: "A-", url: "https://arxiv.org/abs/2504.12216", featured: true, tags: ["★"] }
              - { year: 2025, title: "d2: Direct Diffusion Language Model Alignment", note: "Improves likelihood estimation and exposes alignment as a trajectory problem.", grade: "A-", url: "https://arxiv.org/abs/2509.21474" }
              - { year: 2024, title: "Simple Guidance Mechanisms for Discrete Diffusion Models", note: "Conditional control before reaching for full reinforcement learning.", grade: "A-", url: "https://arxiv.org/abs/2412.10193" }
              - { year: 2025, title: "LLaDA", note: "Instruction tuning shows that supervised adaptation transfers more easily than RL.", grade: "A-", url: "https://arxiv.org/abs/2502.09992" }
              - { year: 2026, title: "How to Build a Diffusion Language Model", note: "The clearest map of the fragmented post-training literature.", grade: "A", url: "https://kuleshov-group.github.io/blog/blog/2026/how-to-build-a-diffusion-language-model/", featured: true }

          - heading: "Any-order generation is a policy, not a free lunch"
            notes:
              - text: "A denoiser may choose which token to finalize next. This is often described as “thinking in any order,” but architectural permission does not imply that training discovers a useful reasoning order."
              - text: "Confidence-first decoding can skip uncertain intermediate reasoning and commit an answer supported by superficial cues. Flexible order may reduce sample diversity when many trajectories collapse onto the same premature conclusion."
              - text: "The counterexample is real: when required output order conflicts with natural reasoning order, bidirectional refinement can stabilize hidden reasoning fields before it commits the answer field."
              - text: "Recent evidence favors gated flexibility: keep positions revisable until prerequisite evidence exists, or constrain the commitment frontier during reasoning. The schedule is task-dependent and should be learned or validated."
            papers:
              - { year: 2026, title: "The Flexibility Trap", note: "Arbitrary-order decoding can route around hard reasoning tokens and reduce useful diversity.", grade: "A", url: "https://arxiv.org/abs/2601.15165", featured: true, tags: ["★"] }
              - { year: 2026, title: "Thinking Out of Order", note: "Strong gains when presentation order and reasoning order deliberately conflict.", grade: "A-", url: "https://arxiv.org/abs/2601.22035", featured: true }
              - { year: 2026, title: "Answer First, Reason Later", note: "Very recent evidence for frontier-gated commitment; treat conclusions as provisional.", grade: "B+", url: "https://arxiv.org/abs/2608.05687" }
              - { year: 2026, title: "A3: Any-Order Autoregressive Language Modeling", note: "An important control: flexible ordering is not exclusive to diffusion.", grade: "B+", url: "https://arxiv.org/abs/2601.13228" }
              - { year: 2025, title: "A2D: Any-to-Any Diffusion Language Models and Safety", note: "Extra generation paths also create new attack and control surfaces.", grade: "B", url: "https://arxiv.org/abs/2509.23286" }

      - name: "What scaled systems establish"
        sections:
          - heading: "The likely endpoint is hybrid"
            notes:
              - text: "LLaDA established a serious general-purpose diffusion model; Dream showed that autoregressive initialization can reduce the scaling burden; Mercury and Seed demonstrated high throughput in narrower regimes. None establishes universal superiority."
              - text: "DiffusionGemma is instructive because its public material states both coordinates: faster generation in the target setup and lower quality than the standard Gemma family. That is more useful than a speed headline with no quality coordinate."
              - text: "Tri-mode systems suggest a pragmatic endpoint. The same weights may decode autoregressively for difficult tokens, diffuse a block when parallelism matters, or draft with diffusion and verify autoregressively."
              - text: "Perplexity is not sufficient across factorization families. A diffusion objective can require more training compute for likelihood yet do well on reasoning or at high serving throughput. Choose against the metric and SLO the application actually pays for."
            papers:
              - { year: 2025, title: "LLaDA", note: "The foundational scaled open diffusion LM.", grade: "A-", url: "https://arxiv.org/abs/2502.09992", featured: true, tags: ["★"] }
              - { year: 2025, title: "Dream 7B", note: "Autoregressive checkpoints can be converted instead of always training diffusion from zero.", grade: "A-", url: "https://arxiv.org/abs/2508.15487" }
              - { year: 2025, title: "Mercury", note: "A commercially relevant speed point, not a blanket frontier-quality victory.", grade: "B+", url: "https://arxiv.org/abs/2506.17298" }
              - { year: 2026, title: "DiffusionGemma", note: "A consequential block-diffusion release with unusually explicit quality caveats.", grade: "B+", url: "https://blog.google/innovation-and-ai/technology/developers-tools/diffusion-gemma-faster-text-generation/" }
              - { year: 2026, title: "Nemotron Labs Diffusion", note: "The clearest current evidence for one model choosing its factorization at inference time.", grade: "A-", url: "https://research.nvidia.com/publication/2026-05_nemotron-labs-diffusion-tri-mode-language-model-unifying-autoregressive", featured: true }
              - { year: 2026, title: "Scaling Beyond Masked Diffusion Language Models", note: "Compare Pareto frontiers across compute and throughput, not one benchmark column.", grade: "A", url: "https://arxiv.org/abs/2602.15014", featured: true, tags: ["★"] }

  - name: "Others"
    intro: >
      This section is intentionally not a miscellaneous drawer. Modern models are often
      easier to improve than to measure, so it collects three questions that cut across
      language models, world models, and agents: whether a benchmark still measures what
      it claims, whether an automated judge is a trustworthy instrument, and whether a
      system knows when its answer should be withheld.
    subtopics:
      - name: "Evaluation that survives training"
        sections:
          - heading: "A score belongs to a pipeline and a date"
            notes:
              - text: "A benchmark result belongs to a model, prompt template, decoding procedure, tool configuration, scorer, and evaluation date—not to the weights alone. Reporting only the number hides reproducibility details and how quickly a public task becomes training data."
              - text: "Dynamic benchmarks shorten the window for contamination by adding newly released, objectively scored problems. They do not make contamination impossible; they make provenance and timestamps first-class metadata."
              - text: "Human pairwise preference measures a different target from factual or task accuracy. Arena rankings are useful for product preference, but the prompt population, rater population, presentation, latency, and verbosity all affect the result."
              - text: "A defensible suite mixes frozen diagnostic tasks, fresh verifiable tasks, and human preference. Agreement across these views is stronger evidence than another decimal place on one leaderboard."
            papers:
              - { year: 2022, title: "HELM", note: "The durable lesson is multidimensional reporting: capability alone is an incomplete measurement.", grade: "B+", url: "https://arxiv.org/abs/2211.09110" }
              - { year: 2024, title: "LiveBench", note: "A strong template for frequently refreshed evaluation with objective ground truth.", grade: "A-", url: "https://arxiv.org/abs/2406.19314", featured: true, tags: ["★"] }
              - { year: 2024, title: "LiveCodeBench", note: "Coding suits dynamic evaluation because problems can be dated and answers executed.", grade: "B+", url: "https://arxiv.org/abs/2403.07974" }
              - { year: 2024, title: "Chatbot Arena", note: "A powerful preference instrument that should not be reinterpreted as truthfulness or reasoning accuracy.", grade: "A-", url: "https://arxiv.org/abs/2403.04132", featured: true }

          - heading: "Judges are instruments, not oracles"
            notes:
              - text: "LLM judges offer scale and rubric-based feedback, but show position bias, verbosity preference, self-preference, and sensitivity to framing. Calling a judge stronger than the candidate does not remove systematic error."
              - text: "Pairwise ranking often assumes a Bradley–Terry model, but the inferred score describes preference under the sampled prompts, judge, and presentation protocol. It is not context-free quality."
                display: "P(i ≻ j) = σ(sᵢ − sⱼ)"
              - text: "Treat an automated judge like a measurement device: calibrate on a human-reviewed slice, swap response order, hide model identity, use task-specific rubrics, and report disagreement. A judge should be allowed to abstain."
              - text: "More judge calls are not automatically better than trusted human labels. When the judge is systematically worse than the systems it evaluates, cheap automation can amplify bias faster than it reduces variance."
            papers:
              - { year: 2023, title: "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena", note: "Foundational because it documents both surprising utility and characteristic biases.", grade: "A", url: "https://arxiv.org/abs/2306.05685", featured: true, tags: ["★"] }
              - { year: 2024, title: "Self-Preference Bias in LLM-as-a-Judge", note: "Shared model family or style can leak into supposedly neutral evaluation.", grade: "B+", url: "https://arxiv.org/abs/2410.21819" }
              - { year: 2025, title: "The Limits of Scalable Oversight and Automated Evaluation", note: "A sharp argument against assuming cheap judge labels dominate a smaller trusted sample.", grade: "A-", url: "https://proceedings.iclr.cc/paper_files/paper/2025/hash/4264ee4376776907c0b87ed70b959585-Abstract-Conference.html", featured: true }
              - { year: 2025, title: "RewardBench 2", note: "Tests whether preference models capture harder downstream distinctions.", grade: "B+", url: "https://arxiv.org/abs/2506.01937" }

      - name: "Knowing when not to answer"
        sections:
          - heading: "Confidence, abstention, and explicit guarantees"
            notes:
              - text: "Accuracy and calibration are different. If a calibrated system reports probability p, it should be correct about a fraction p of the time among similarly scored cases. A less accurate but calibrated system can be safer when a product may abstain."
                display: "P(correct | p̂ ≈ p) ≈ p"
              - text: "A proper score such as Brier loss penalizes both confident error and unjustified timidity. Accuracy alone cannot distinguish a careful 60% forecast from a reckless 99% forecast."
                display: "Brier score = (p − y)²"
              - text: "Semantic entropy samples answers, groups meaning-equivalent outputs, and measures uncertainty across those groups. It detects unstable guessing better than token entropy, but cannot catch a model that is consistently confident in one misconception."
                display: "H_sem(x) = −Σc p(c | x) log p(c | x)"
              - text: "Abstention should be chosen on a risk–coverage curve. Asking “are you sure?” is not a safety mechanism; selecting a threshold against an acceptable empirical risk is."
                display: "coverage(τ) = P(c ≥ τ),      risk(τ) = E[loss | c ≥ τ]"
              - text: "Conformal methods can promise that an answer set contains the truth with a chosen marginal probability under exchangeability. The guarantee is valuable because it is explicit, and limited because deployment shift can violate the assumption."
                display: "P{Y ∈ Cα(X)} ≥ 1 − α"
            papers:
              - { year: 2024, title: "Detecting Hallucinations in Large Language Models Using Semantic Entropy", note: "The strongest practical idea for uncertainty over meanings rather than surface strings.", grade: "A", url: "https://www.nature.com/articles/s41586-024-07421-0", featured: true, tags: ["★"] }
              - { year: 2023, title: "Can LLMs Express Their Uncertainty?", note: "Verbalized confidence is overconfident and sensitive to how it is elicited.", grade: "A-", url: "https://arxiv.org/abs/2306.13063" }
              - { year: 2024, title: "Conformal Language Modeling", note: "Turns abstention and generation sets into an explicit statistical coverage problem.", grade: "A-", url: "https://openreview.net/forum?id=pzUhfQ74c5", featured: true }
              - { year: 2024, title: "Enhanced Conformal Prediction for LLMs", note: "Extensions that make conformal sets less blunt for language tasks.", grade: "B+", url: "https://arxiv.org/abs/2406.09714" }
              - { year: 2026, title: "ConfidenceBench", note: "A recent reminder that model rankings by accuracy and calibration can diverge.", grade: "B+", url: "https://arxiv.org/abs/2607.20526" }
              - { year: 2024, title: "Larger and More Instructable Language Models Become Less Reliable", note: "Smoother instruction following can conceal rather than eliminate confident failure.", grade: "B+", url: "https://www.nature.com/articles/s41586-024-07930-y" }
