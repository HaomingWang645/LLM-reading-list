# =============================================================================
# Reading-list data. Edit this file to add papers — the page renders itself.
#
# Structure:
#   meta:        hero banner text
#   legend:      reading-depth grades (the A / A- / B+ / B / C badges)
#   tags:        optional special tags (e.g. NVIDIA) shown in the legend
#   categories:  top-level sections. Each category has EITHER `papers:` directly,
#                OR `subtopics:` (each with its own `papers:`), or both.
#
# A subtopic may optionally lead with a video:
#   - name: "Tokenization"
#     video_id:   "zduSFxRajkE"   # YouTube id — renders a clickable thumbnail
#     video_note: "Karpathy — ..."# optional caption under the thumbnail
#     papers: [ ... ]             # related papers, shown below the video
#
# Figures (on a section, or on a single note) take:
#   image: "/assets/img/..."   image_alt: "..."   image_caption: "..."
#   image_width: 640           # px cap; figures are centred. Pick it so the text
#                              # drawn inside the diagram lands near the body's
#                              # ~15.5px:  width = 15.5 * native_width / text_px
#
# A paper entry:
#   - year: 2024            # a plain number — never quote it (quoting breaks the year stats)
#     title: "Paper Title"
#     note: "One-line takeaway."
#     grade: "A"            # MUST be exactly one of: A, A-, B+, B, C
#     url: "https://..."    # optional; omit to render a non-linked title
#     featured: true        # optional; renders the title in bold
#     tags: ["NV"]          # optional; each must match a key in the `tags:` block below
#
# Valid tag colors (in the `tags:` block): green, amber, gray
# A wrong grade renders a red "?" badge; an unknown tag renders a gray "?" pill —
# both are visible in preview so mistakes are easy to catch.
# =============================================================================

