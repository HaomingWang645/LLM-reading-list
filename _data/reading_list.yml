  - name: "Topic 1 · Spatial reasoning"
    subtopics:
      - name: "Background: standard design of VLMs"
        sections:
          - heading: "Overview"
            notes:
              - text: "VLMs are the bridge between perception and language."
              - text: "A practical implementation usually decomposes the model into visual representation, language representation, alignment or fusion, and a task head or decoder:"
                display: "VLM = visual representation + text representation + alignment/fusion mechanism + task head or decoder"
                image: "/assets/img/reading_list/llava_arch.png"
                image_width: 640   # native 1607px wide, ~40px text -> ~15.5px on screen
                image_alt: "The LLaVA architecture. An image X_v enters a vision encoder producing features Z_v; a projection matrix W maps them into visual tokens H_v. A language instruction X_q becomes text tokens H_q. Both token sequences feed the language model f_phi, which autoregressively emits the language response X_a."
                image_caption: "LLaVA makes the four parts concrete: the vision encoder is the visual representation, the instruction tokens are the text representation, the projection W is the alignment/fusion mechanism, and the language model itself serves as the decoder."
              - text: "This gives the standard modular MLLM pipeline:"
                display: "image → vision encoder → projector / adapter / resampler → LLM → text response"

          - heading: "The vision encoder"
            notes:
              - text: "The vision encoder is the first stage of that pipeline: it turns raw pixels into a sequence of tokens the LLM can attend over. Almost every modern VLM uses a Vision Transformer (ViT), typically one pretrained by image–text contrastive learning (CLIP, SigLIP) and often kept frozen."
              - text: "It begins by patchifying the image. The picture is cut into a grid of fixed-size patches; each patch is flattened, linearly projected to the model width D, and given a positional encoding. The patch grid — not the pixel count — sets the token budget:"
                display: "224×224 image, 16×16 px patches → 14×14 grid = 196 visual tokens"
                image: "/assets/img/reading_list/image_tokenization.jpeg"
                image_width: 540   # native 1566px wide, ~46px text -> ~15.5px on screen
                image_alt: "Patch embeddings in a Vision Transformer. A 224 by 224 image is divided into 16 by 16 pixel patches, forming a 14 by 14 grid. Each patch is flattened into 768 values, linearly projected to D dimensions, and given a positional encoding, yielding 196 tokens."
                image_caption: "Patch embedding. Each 16×16 px patch flattens to 16·16·3 = 768 values before the linear projection to D. Note the middle panel labels patch size, not grid size: the grid is 14×14."
              - text: "Stacked self-attention blocks then contextualize those patch tokens. The encoder's output is N token vectors in its own width, which the projector maps into the LLM's embedding space so they can simply be concatenated with the text tokens."
              - text: "Two consequences drive much of the spatial-reasoning literature: fine detail is capped by the patch grid, and token count grows quadratically with resolution. That is why resamplers (Q-Former, Perceiver) and dynamic-resolution schemes (Qwen2-VL, LLaVA-NeXT) exist."

          - heading: "VLM training"
            image: "/assets/img/reading_list/VLMArch.jpg"
            image_width: 850   # native 2794px wide, ~52px text -> ~15.5px on screen
            image_alt: "Two VLM training stages side by side. In pre-training the image encoder and text decoder are frozen and only the multimodal projector is trained; in fine-tuning the projector and text decoder are trained while the image encoder stays frozen."
            image_caption: "The standard two-stage recipe: pre-training aligns the projector against a frozen encoder and decoder; fine-tuning unfreezes the decoder for instruction following."

          - heading: "Qwen2.5-VL as an example"
            notes:
              - text: "The standard design above is not necessarily the optimal one. Production VLMs depart from it wherever the fixed-resolution ViT costs accuracy or compute, and Qwen2.5-VL is a convenient place to see the three most common departures: native dynamic resolution, window attention in place of full attention over every patch, and genuine video support rather than a stack of independent frames."
              - text: "Qwen2.5-VL instantiates the same pipeline, but drops the fixed-resolution assumption that produced a constant 196 tokens above. Images enter at native resolution, so the token count becomes a function of the picture itself:"
                display: "native-resolution image → Conv3D patch embed (2×14×14) → windowed ViT → merger → Qwen2.5 LM decoder"
                image: "/assets/img/reading_list/qwen2vl.jpg"
                # Dense figure: its small labels sit near 16px in a 1872px-wide source, so
                # matching body text would need ~1800px. Given the full column instead; click to zoom.
                image_width: 870
                image_alt: "The Qwen2.5-VL architecture. Images and video at native resolution enter a vision encoder built from RMSNorm and SwiGLU blocks using mostly window attention with occasional full attention, after a Conv3D patch embedding with two-times temporal merging. The resulting visual tokens, varying in count per image, are concatenated with text tokens and fed to the Qwen2.5 language-model decoder. Video frames use dynamic FPS sampling and MRoPE time IDs aligned to absolute time."
                image_caption: "Qwen2.5-VL. Native-resolution input makes the visual token count vary per image; window attention keeps the cost of a large token sequence manageable. Click the figure to view it full size."
              - text: "Because resolution is preserved, a thin 224×28 banner costs only 8 tokens while a tall 1092×8204 page costs 11,427. Detail is no longer capped by a 14×14 grid, but the sequence the LLM must attend over grows with the image."
              - text: "To make that affordable the encoder uses window attention over 112×112 windows in most blocks, whose cost is linear rather than quadratic in token count, interleaved with occasional full-attention blocks that restore global context. The blocks themselves mirror the LLM: RMSNorm and a SwiGLU feed-forward."
              - text: "Video is not fed in as a sequence of independent image frames. The patch embedding is a Conv3D spanning two adjacent frames (2×14×14), so each visual token already summarises a short slice of time and the temporal token count is halved before the encoder ever runs."
              - text: "On top of that, dynamic FPS sampling decides how many frames survive — the same clip costs 644, 1288 or 2576 tokens depending on the rate — and MRoPE gives every token a time ID aligned to its absolute timestamp. The model therefore sees elapsed seconds rather than frame indices, which is what lets it answer questions about duration and ordering."
            papers:
              - { title: "Qwen2.5-VL Technical Report", note: "The architecture and training recipe in full.", grade: "A-", url: "https://arxiv.org/abs/2502.13923" }
              - { title: "Qwen2.5-VL: a hands-on code walkthrough", note: "Traces the implementation end to end, from patch embedding to the LM decoder.", grade: "B", url: "https://pub.towardsai.net/qwen2-5-vl-a-hands-on-code-walkthrough-5fba8a34e7d7" }
      - name: "Spatial tasks and benchmarks — overview of VLM capability"
        sections:
          - heading: "The gap between semantic and spatial understanding"
            notes:
              - text: "At the semantic level a frontier VLM is close to human: it names objects, describes activities, and answers open-ended questions about a scene. Most people have felt this in daily use."
              - text: "Understanding 3D spatial information is a different story. The geometry of objects, where they sit relative to one another, and how they move are all immediate for a human and hard for a VLM. The failures are systematic rather than random: qualitative results show the model repeatedly making low-level mistakes, such as reasoning over pixel space — taking a measurement in pixels for an object's length in 3D — and being unable to perform mental rotation while thinking."
                image: "/assets/img/reading_list/performance_gap.jpg"
                # Dense slide: its smallest text is ~20px in an 1800px-wide source, so matching
                # body text would need ~1400px. Given the full column instead; click to zoom.
                image_width: 870
                image_alt: "Two GPT-5 failure cases beside a radar plot. In a spatial-relations question about which object is higher in 3D world space, GPT-5 reasons from apparent height in the 2D image and answers wrongly. In a mental-reconstruction task it cannot build a 3D shape from its top view. The radar plot compares humans against GPT-5 and Qwen3-VL-8B across eight axes including object-object relationships, camera-region relationships, measurement, appearance, camera motion, and multi-step reasoning; the human polygon encloses both models on every axis."
                image_caption: "GPT-5 judges elevation from 2D pixel height rather than 3D world space, and cannot perform the mental rotation needed to reconstruct a shape from its top view. The radar plot shows the gap is not confined to one skill: the human envelope encloses both proprietary and open models on every axis. Source: “Has GPT-5 Achieved Spatial Intelligence? An Empirical Study.” Click the figure to view it full size."

          - heading: "Benchmarks: spatial tasks as VQA"
            notes:
              - text: "To quantify a model's spatial capability, the standard way to build benchmark data is to formulate each spatial skill as a visual question-answering task. Given an image or a video, the model answers a numerical or a multiple-choice question, so grading is exact and automatic:"
                display: "image / video + spatial question → numerical answer or multiple choice"
              - text: "VSI-Bench is a representative instance. Its questions are posed over a walkthrough video of a single real room, and its eight tasks split cleanly by answer type:"
                image: "/assets/img/reading_list/vsibench_tasks.png"
                # Same treatment: ~22px question text in a 1990px-wide source.
                image_width: 870
                image_alt: "The eight VSI-Bench tasks arranged around a 3D floor plan showing the camera trajectory through a flat. On the left: object count, relative distance, appearance order, and relative direction. On the right: object size, absolute distance, room size, and route plan. A strip of video frames from the walkthrough runs across the top."
                image_caption: "VSI-Bench. Every task is answered from the same walkthrough video, so the model must integrate observations across frames rather than read one picture. Click the figure to view it full size."
              - text: "Four tasks want a number, and are scored against the true value: object count, object size in centimetres, absolute distance in metres, and room size in square metres."
              - text: "The other four are multiple choice: relative distance, relative direction from an assumed viewpoint and heading, the order in which objects first appear, and route planning, where the model fills in the missing turns of a navigation plan."
              - text: "Because the input is a video of one continuous scene rather than an isolated frame, the model has to accumulate what it has seen into a persistent spatial map — which is precisely the ability the radar plot above says is missing."
