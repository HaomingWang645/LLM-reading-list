<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Autoregressive and masked-diffusion text generation</title>
  <desc id="desc">Autoregressive decoding commits to one new token per serial step. Masked diffusion begins with a block of masks and repeatedly predicts and remasks positions, allowing parallel updates but spending several full-sequence passes.</desc>
  <rect width="960" height="390" rx="18" fill="#faf9f7"/>
  <g font-family="Inter,Arial,sans-serif" fill="#29263d">
    <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700">Parallel tokens do not imply less computation</text>
    <text x="42" y="104" font-size="17" font-weight="700">autoregressive</text>
    <text x="42" y="129" font-size="14" fill="#686373">commit one token, extend the cache, repeat</text>
    <g transform="translate(320 82)">
      <g fill="#ddd5f1" stroke="#7459a6"><rect x="0" y="0" width="62" height="54" rx="9"/><rect x="78" y="0" width="62" height="54" rx="9"/><rect x="156" y="0" width="62" height="54" rx="9"/><rect x="234" y="0" width="62" height="54" rx="9"/><rect x="312" y="0" width="62" height="54" rx="9"/><rect x="390" y="0" width="62" height="54" rx="9"/></g>
      <g font-size="15" text-anchor="middle"><text x="31" y="33">The</text><text x="109" y="33">model</text><text x="187" y="33">writes</text><text x="265" y="33">left</text><text x="343" y="33">to</text><text x="421" y="33">right</text></g>
      <g stroke="#716b80" stroke-width="2"><line x1="63" y1="27" x2="77" y2="27"/><line x1="141" y1="27" x2="155" y2="27"/><line x1="219" y1="27" x2="233" y2="27"/><line x1="297" y1="27" x2="311" y2="27"/><line x1="375" y1="27" x2="389" y2="27"/></g>
      <text x="520" y="33" font-size="14" fill="#686373">6 serial decisions</text>
    </g>
    <line x1="40" y1="180" x2="920" y2="180" stroke="#d8d4df" stroke-width="2"/>
    <text x="42" y="225" font-size="17" font-weight="700">masked diffusion</text>
    <text x="42" y="250" font-size="14" fill="#686373">revise a block; keep or remask tokens</text>
    <g transform="translate(320 205)" font-size="15" text-anchor="middle">
      <g fill="#eeeafb" stroke="#8b78b8"><rect x="0" y="0" width="118" height="52" rx="10"/><rect x="164" y="0" width="118" height="52" rx="10"/><rect x="328" y="0" width="118" height="52" rx="10"/><rect x="492" y="0" width="118" height="52" rx="10"/></g>
      <text x="59" y="31">□□□□□□</text><text x="223" y="31">The □□□ □□</text><text x="387" y="31">The model □□□</text><text x="551" y="31">The model writes</text>
      <g stroke="#716b80" stroke-width="2"><line x1="119" y1="26" x2="163" y2="26"/><line x1="283" y1="26" x2="327" y2="26"/><line x1="447" y1="26" x2="491" y2="26"/></g>
      <g fill="#716b80"><path d="M163 26 l-10 -6 v12z"/><path d="M327 26 l-10 -6 v12z"/><path d="M491 26 l-10 -6 v12z"/></g>
    </g>
    <rect x="260" y="298" width="610" height="57" rx="12" fill="#fff2df" stroke="#c48943"/>
    <text x="565" y="322" text-anchor="middle" font-size="15" font-weight="700">The systems question</text>
    <text x="565" y="344" text-anchor="middle" font-size="14">Do fewer serial steps repay bidirectional attention, repeated passes, and weaker KV reuse?</text>
  </g>
</svg>
