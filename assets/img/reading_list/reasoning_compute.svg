<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Three ways to spend inference-time reasoning compute</title>
  <desc id="desc">A shared prompt branches into a single long reasoning chain, many independent samples, or a searched prefix tree with a verifier. Each strategy spends the same abstract budget differently.</desc>
  <rect width="960" height="390" rx="18" fill="#faf9f7"/>
  <g font-family="Inter,Arial,sans-serif" fill="#29263d">
    <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700">A token budget is a search budget only if it changes the decision</text>
    <rect x="40" y="170" width="112" height="54" rx="12" fill="#e9e4f7" stroke="#8b78b8"/>
    <text x="96" y="202" text-anchor="middle" font-size="16" font-weight="700">problem</text>
    <line x1="152" y1="197" x2="215" y2="197" stroke="#716b80" stroke-width="3"/>
    <path d="M215 197 C260 197 250 96 300 96 M215 197 L300 197 M215 197 C260 197 250 300 300 300" fill="none" stroke="#716b80" stroke-width="3"/>
    <g>
      <text x="430" y="76" text-anchor="middle" font-size="17" font-weight="700">one long path</text>
      <circle cx="310" cy="96" r="8" fill="#7459a6"/><line x1="318" y1="96" x2="378" y2="96" stroke="#7459a6" stroke-width="4"/>
      <circle cx="390" cy="96" r="8" fill="#7459a6"/><line x1="398" y1="96" x2="458" y2="96" stroke="#7459a6" stroke-width="4"/>
      <circle cx="470" cy="96" r="8" fill="#7459a6"/><line x1="478" y1="96" x2="538" y2="96" stroke="#7459a6" stroke-width="4"/>
      <circle cx="550" cy="96" r="8" fill="#3d8875"/>
      <text x="675" y="101" font-size="14" fill="#686373">depth; no alternative survives</text>
    </g>
    <g>
      <text x="445" y="146" text-anchor="middle" font-size="17" font-weight="700">many complete samples</text>
      <circle cx="310" cy="197" r="8" fill="#7459a6"/>
      <path d="M318 197 C360 197 360 160 410 160 M318 197 L410 197 M318 197 C360 197 360 234 410 234" fill="none" stroke="#7459a6" stroke-width="3"/>
      <circle cx="420" cy="160" r="7" fill="#d06b52"/><circle cx="420" cy="197" r="7" fill="#3d8875"/><circle cx="420" cy="234" r="7" fill="#d06b52"/>
      <rect x="500" y="174" width="100" height="46" rx="10" fill="#eeeafb" stroke="#8b78b8"/>
      <text x="550" y="202" text-anchor="middle" font-size="14" font-weight="700">selector</text>
      <line x1="427" y1="197" x2="500" y2="197" stroke="#716b80" stroke-width="2"/>
      <text x="675" y="202" font-size="14" fill="#686373">diversity; selector is the bottleneck</text>
    </g>
    <g>
      <text x="550" y="258" text-anchor="middle" font-size="17" font-weight="700">prefix search + verifier</text>
      <circle cx="310" cy="300" r="8" fill="#7459a6"/>
      <path d="M318 300 L365 270 M318 300 L365 330 M373 270 L420 250 M373 270 L420 290 M373 330 L420 315 M373 330 L420 350" fill="none" stroke="#7459a6" stroke-width="3"/>
      <g fill="#7459a6"><circle cx="370" cy="270" r="7"/><circle cx="370" cy="330" r="7"/><circle cx="425" cy="250" r="7"/><circle cx="425" cy="290" r="7"/><circle cx="425" cy="315" r="7"/><circle cx="425" cy="350" r="7"/></g>
      <rect x="500" y="277" width="100" height="46" rx="10" fill="#eeeafb" stroke="#8b78b8"/>
      <text x="550" y="305" text-anchor="middle" font-size="14" font-weight="700">verifier</text>
      <line x1="432" y1="300" x2="500" y2="300" stroke="#716b80" stroke-width="2"/>
      <text x="675" y="305" font-size="14" fill="#686373">adaptive; verifier errors steer the tree</text>
    </g>
  </g>
</svg>
