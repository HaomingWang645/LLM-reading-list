<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Roofline view of transformer inference</title>
  <desc id="desc">A chart of attainable throughput against arithmetic intensity. A rising memory-bandwidth line meets a flat compute ceiling. Decode sits on the bandwidth-bound slope, while a batched prefill sits near the compute-bound plateau.</desc>
  <rect width="960" height="430" rx="18" fill="#faf9f7"/>
  <g font-family="Inter,Arial,sans-serif" fill="#29263d">
    <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700">One model, two hardware regimes</text>
    <line x1="105" y1="355" x2="885" y2="355" stroke="#6b6682" stroke-width="2"/>
    <line x1="105" y1="355" x2="105" y2="78" stroke="#6b6682" stroke-width="2"/>
    <text x="495" y="405" text-anchor="middle" font-size="16">arithmetic intensity  ·  FLOPs per byte moved →</text>
    <text x="28" y="220" text-anchor="middle" font-size="16" transform="rotate(-90 28 220)">attainable throughput →</text>
    <path d="M105 355 L590 105 L885 105" fill="none" stroke="#7459a6" stroke-width="6" stroke-linecap="round"/>
    <text x="280" y="230" font-size="17" fill="#7459a6" transform="rotate(-27 280 230)">memory-bandwidth ceiling</text>
    <text x="710" y="92" font-size="17" text-anchor="middle" fill="#7459a6">compute ceiling</text>
    <line x1="590" y1="105" x2="590" y2="355" stroke="#b5afc5" stroke-width="2" stroke-dasharray="7 7"/>
    <circle cx="250" cy="280" r="10" fill="#d06b52"/>
    <text x="250" y="310" text-anchor="middle" font-size="17" font-weight="700">decode</text>
    <text x="250" y="333" text-anchor="middle" font-size="14" fill="#686373">small matrix–vector work; reread weights + KV</text>
    <circle cx="700" cy="105" r="10" fill="#3d8875"/>
    <text x="700" y="137" text-anchor="middle" font-size="17" font-weight="700">batched prefill / training</text>
    <text x="700" y="160" text-anchor="middle" font-size="14" fill="#686373">large matrix multiplies reuse each byte</text>
    <rect x="625" y="218" width="260" height="86" rx="12" fill="#eeeafb" stroke="#c6bce5"/>
    <text x="755" y="246" text-anchor="middle" font-size="15" font-weight="700">Optimization rule</text>
    <text x="755" y="271" text-anchor="middle" font-size="14">count bytes before FLOPs;</text>
    <text x="755" y="292" text-anchor="middle" font-size="14">then move the bottleneck deliberately.</text>
  </g>
</svg>
